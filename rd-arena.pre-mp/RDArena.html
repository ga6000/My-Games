<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reaction-Diffusion Arena (Fleshscape)</title>
    <!--
      Shared token layer (AESTHETIC_GUIDE.md 2 and 3), loaded BEFORE this game's
      own <style> so anything below can override a token without fighting
      specificity. data-cabinet="raster" on <body> is what PERMITS the scanline
      overlay: 4.6 makes scanlines raster-only and the CSS is gated on that
      attribute, so a Vector cabinet cannot switch them on by reaching for the
      class name. This is the cabinet they belong to.
    -->
    <link rel="stylesheet" href="../shared/retro.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            /* Was #050505 / #d1d5db / monospace. 2.1: pure black. */
            background-color: var(--ground);
            color: var(--phos-mid);
            font-family: var(--font-ui);
            letter-spacing: 1px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        /* The tube. Wrapping the canvas is what lets the scanlines sit over the
           PLAYFIELD rather than over the whole viewport including its margins. */
        #screen {
            position: relative;
            line-height: 0;
            /* 4.11 -- a thin bezel with a hard inner rule sells "cabinet" more
               cheaply than any texture. */
            border: 2px solid var(--sig-cyan);
            box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.9);
        }
        canvas {
            background-color: var(--ground);
            cursor: crosshair;
            display: block;
            /* The flesh field is a cell grid now (6.4); let the browser scale it
               as pixels rather than smoothing the edges back off. */
            image-rendering: pixelated;
        }
        #ui {
            position: absolute;
            top: 6px;
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }
        h1 {
            margin: 0;
            font-family: var(--font-display);
            font-size: 15px;
            color: var(--phos-hot);
            text-transform: uppercase;
            letter-spacing: 3px;
        }
        p {
            margin: 4px 0 0 0;
            font-size: 14px;
            color: var(--phos-mid);
            text-transform: uppercase;
        }
    </style>
</head>
<body data-game="rd-arena" data-cabinet="raster">

    <div id="ui">
        <h1>RD-Arena</h1>
        <p>WASD Move &middot; LMB Gun &middot; SPACE/RMB Machete &middot; Hold+Release E Dash &middot; Q Splatter &middot; R Crawlers &middot; F Bio-Tube</p>
    </div>

    <div id="screen">
        <canvas id="gameCanvas" width="800" height="800"></canvas>
        <div class="retro-scanlines"></div>
    </div>

<!--
  Split into nine rd-*.js files 2026-09-05 (FINAL_THREE_PASS_PLAN.md 3). The
  file was flagged "best split candidate" in the tracker for weeks. Lines were
  moved VERBATIM and IN STRICT SOURCE ORDER; the only textual change is that the
  four-space indent the whole script carried inside <script> was removed, which
  is whitespace-only (there are no multi-line template literals).

  THESE TAGS MUST STAY AT THE END OF <body>. rd-core.js resolves #gameCanvas
  from the DOM at load time, and rd-boot.js ENDS by calling rebuildFlowField(),
  startRound(1) and loop() -- so the load order below is the game's start-up
  sequence, not just a dependency list.

  retro.js and sfx.js only define globals (RETRO, SFX) and must precede
  rd-core.js, which calls SFX.configure() at load.
-->
<script src="../shared/retro.js"></script>
<script src="../shared/sfx.js"></script>
<!-- The L+G dev panel. BEFORE the game's own files: its error capture only
     sees throws that happen after it installs, and its keydown listener has
     to be attached before rd-input.js's so a combo press can be stopped from
     also reaching the player. Registration is rd-dev.js, at the very end. -->
<script src="../shared/devtools.js"></script>
<script src="rd-core.js"></script>
<script src="rd-field.js"></script>
<script src="rd-netfield.js"></script>
<script src="rd-sanctuary.js"></script>
<script src="rd-flow.js"></script>
<script src="rd-input.js"></script>
<script src="rd-entities.js"></script>
<script src="rd-rounds.js"></script>
<script src="rd-render.js"></script>
<script src="rd-boot.js"></script>
<!-- LAST, after the loop has already started. Registration only. -->
<script src="rd-dev.js"></script>
</body>
</html>
