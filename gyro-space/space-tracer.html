<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">

<title>Gyro Space Trail</title>

<!-- Shared token layer (AESTHETIC_GUIDE.md §2/§3). data-cabinet="vector" on
     <body> keeps the raster-only scanline overlay (§4.6) off this game, and
     data-game selects its world hue: #7DF9FF ice. -->
<link rel="stylesheet" href="../shared/retro.css">
<style>
html,body{
    margin:0;
    padding:0;
    overflow:hidden;
    background:#000;
    touch-action:none;
    font-family: var(--font-ui);
}

canvas{
    display:block;
    width:100vw;
    height:100vh;
}

#overlay{
    position:absolute;
    top:12px;
    left:12px;
    color:white;
    font-family:var(--font-ui);
    font-size:14px;
    line-height:1.4;
    background:rgba(0,0,0,.45);
    padding:10px;
    border-radius:8px;
    user-select:none;
    pointer-events:auto;
    display:none;
}

#overlay.hidden{
    display:none;
}

#guiToggle{
    position:absolute;
    top:12px;
    left:12px;
    width:24px;
    height:24px;
    border-radius:50%;
    background:rgba(0,229,255,0.7);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    font-weight:bold;
    color:white;
    z-index:999;
    border:2px solid var(--sig-cyan);
    transition:all 0.2s ease;
}

#guiToggle:hover{
    background:var(--sig-cyan);
    transform:scale(1.1);
}

button{
    margin-top:8px;
    padding:8px 12px;
    font-size:14px;
}

/* ===== START SCREEN ===== */
</style>
<!-- Firebase: Firestore for persisted scores, anonymous Auth so a
     device/player gets a stable identity without a sign-up flow. Loaded
     as ES modules from the CDN -- no build step, matches how the rest
     of this project is a single static HTML file. -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
    // Config lives in one shared file so space-tracer.html, leaderboard.html,
    // and any future game never have three copies of the same object to
    // keep in sync by hand. Fill in the real values in firebase-config.js
    // once -- every file that imports it picks them up automatically.
    // firebase-config.js lives at the repo root (shared with leaderboard.html);
    // this file lives one level down in gyro-space/, hence "../".
    import { firebaseConfig } from "../firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // Anonymous auth just gives Firestore security rules something to
    // check ("request.auth != null") without making friends create
    // accounts. Sign-in happens immediately on page load so it's ready
    // well before any score needs writing.
    signInAnonymously(auth).catch(err => {
        console.error("Firebase anonymous auth failed:", err);
    });

    // Exposed on window so the plain-script game code (everything else
    // in this file is a non-module <script> below) can call it without
    // this file needing a full module conversion. submitScoreToFirebase
    // is called from reportLifeEnded() in the main game script.
    window.submitScoreToFirebase = async function(playerName, score, roomCode) {
        try {
            await addDoc(collection(db, "scores"), {
                game: "space-tracer",
                player: playerName || "Anonymous",
                score: score,
                room: roomCode || "public",
                // "public" room + a real room code both count toward the
                // solo/global leaderboard -- the leaderboard page can
                // filter by room when someone wants "just our group's"
                // scores, but every score is visible globally by default.
                timestamp: serverTimestamp()
            });
        } catch (err) {
            // Never let a failed score write break gameplay -- this is
            // called mid-game from reportLifeEnded(), which the player
            // should never notice fail even if Firebase is unreachable.
            console.error("Score submission failed:", err);
        }
    };
</script>
</head>
<body data-game="space-tracer" data-cabinet="vector">

<canvas id="game"></canvas>

<div id="guiToggle">⚙</div>

<!-- START SCREEN SYSTEM -->
<div id="startScreenContainer" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2000; background: #000;">
    
    <!-- Screen 1: Simple Click to Start -->
    <div id="screen1-title" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; cursor: pointer; background: #000;">
        <div style="text-align: center; user-select: none;">
            <h1 style="font-size: 64px; color: white; margin: 0; text-shadow: 0 0 20px rgba(100, 200, 255, 0.8); letter-spacing: 4px;">GYRO SPACE</h1>
            <div style="font-size: 32px; color: white; margin-top: 80px; animation: pulse 1s ease-in-out infinite;">CLICK TO START</div>
        </div>
    </div>
    
    <!-- Screen 3: Player Name + Room Code Input -->
    <div id="screen3-name" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px);">
        <div style="background: rgba(0, 0, 0, 0.8); padding: 40px; border-radius: 12px; border: 2px solid #64c8ff; min-width: 400px; text-align: center; user-select: none;">
            <label style="display: block; font-size: 18px; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; color: white;">ENTER YOUR NAME (Optional)</label>
            <input id="playerNameInput" type="text" placeholder="Enter name..." maxlength="20" style="width: 100%; padding: 12px; font-size: 16px; border: 1px solid #64c8ff; background: rgba(100, 200, 255, 0.1); color: white; border-radius: 6px; margin-bottom: 20px; box-sizing: border-box;">
            <label style="display: block; font-size: 18px; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; color: white;">ROOM CODE</label>
            <input id="roomCodeInput" type="text" placeholder="e.g. ABCD (blank = public)" maxlength="8" style="width: 100%; padding: 12px; font-size: 16px; border: 1px solid #64c8ff; background: rgba(100, 200, 255, 0.1); color: white; border-radius: 6px; margin-bottom: 8px; box-sizing: border-box; text-transform: uppercase; letter-spacing: 2px; text-align: center;">
            <p style="font-size: 12px; color: #888; margin: 0 0 20px 0;">Share this code with friends so you land in the same game. Leave blank to join the public room.</p>
            <button id="screen3-submit" style="width: 100%; padding: 12px; font-size: 16px; background: rgba(100, 200, 255, 0.3); border: 2px solid #64c8ff; color: white; cursor: pointer; border-radius: 6px; text-transform: uppercase; font-weight: bold;">ENTER</button>
        </div>
    </div>
    
    <!-- Screen 4: Enter Game -->
    <div id="screen4-enter" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px);">
        <button id="screen4-enter-btn" style="padding: 25px 60px; font-size: 32px; background: rgba(100, 200, 255, 0.3); border: 3px solid #64c8ff; color: white; cursor: pointer; border-radius: 12px; text-transform: uppercase; font-weight: bold; letter-spacing: 2px;">PRESS TO ENTER GAME</button>
    </div>
    
</div>

<style>
@keyframes pulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
}
</style>

<!-- Shared multiplayer core. Classic script, so it still loads over
     file:// -- this game's only module script is the Firebase block in
     <head>, which is the one accepted exception (see PROJECT_MEMORY). -->
<!-- identity.js must load BEFORE mp-core: mp-core falls back to
     IDENTITY.colorFromName() when there is no server (file:// solo play). -->
<script src="../shared/identity.js"></script>
<script src="../shared/mp-core.js"></script>
<!-- RETRO.vertexBloom puts a hot dot on every ship hull vertex (§4.3); the
     trail uses a two-pass beam overdraw (§4.2) built on the same idea. -->
<script src="../shared/retro.js"></script>

<!-- Current life's running score. Top-right, always visible once the
     game starts. Sits above #scoreboard rather than inside it, since
     this is "my score right now" and the scoreboard below it is "best
     score per player this session" -- different things, kept visually
     separate rather than merged into one number. -->
<div id="scoreDisplay" style="position: absolute; top: 12px; right: 12px; color: white; font-family: monospace; font-size: 20px; font-weight: bold; background: rgba(0,0,0,.45); padding: 8px 14px; border-radius: 8px; display: none;">SCORE: 0</div>

<!-- Multiplier callout: large yellow text, top-center. Appears/resets to
     full opacity on every multiplier increase, fades to 0 opacity after
     2s. The multiplier itself keeps applying to score in the background
     even after this fades -- fading is purely visual, not a reset of
     the actual multiplier value (that only resets on death). -->
<div id="multiplierCallout" style="position: absolute; top: 20px; left: 50%; transform: translateX(-50%); color: #ffe600; font-family: 'Arial Black', Arial, sans-serif; font-size: 48px; font-weight: 900; text-shadow: 0 0 12px rgba(255,230,0,0.6), 0 2px 4px rgba(0,0,0,0.8); opacity: 0; transition: opacity 0.4s ease; pointer-events: none;"></div>

<!-- Friend-facing scoreboard: best score-this-session per player
     currently in this room. Deliberately separate from #overlay below,
     which is the dense dev/debug panel -- this one is meant to be
     glanced at mid-game, so it stays small and always visible once the
     game starts. -->
<div id="scoreboard" style="position: absolute; top: 54px; right: 12px; color: white; font-family: monospace; font-size: 13px; background: rgba(0,0,0,.45); padding: 10px 14px; border-radius: 8px; display: none; min-width: 160px;">
    <div style="font-weight: bold; margin-bottom: 6px; letter-spacing: 1px; color: #64c8ff;">BEST SCORE</div>
    <div id="scoreboard-list">—</div>
</div>

<!-- Dash meter: bottom-center, above where the mobile dash button sits
     (so it works in the same visual spot whether the player is on
     mobile with a visible dash button, or on computer where dash is
     SPACE with no button at all). Two visual states sharing one bar:
     while charging (holding dash), the bar fills blue-to-white toward
     the 10s cap; while actively dashing, it switches to draining
     orange/yellow, counting the up-to-5s dash window back down to
     empty. Reads directly from the existing dashChargeDuration /
     dashTimeRemaining / isDashing state -- no new game-state was added
     for this, it's the same numbers the dev overlay already showed as
     text, now shown as a bar too. -->
<div id="dashMeterContainer" style="position: absolute; bottom: 110px; left: 50%; transform: translateX(-50%); width: 160px; display: none; text-align: center;">
    <div id="dashMeterLabel" style="color: white; font-family: monospace; font-size: 11px; margin-bottom: 4px; text-shadow: 0 1px 2px rgba(0,0,0,0.8); letter-spacing: 1px;">DASH</div>
    <div style="width: 100%; height: 10px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.4); border-radius: 5px; overflow: hidden;">
        <div id="dashMeterFill" style="width: 0%; height: 100%; background: #64c8ff; transition: width 0.05s linear, background-color 0.15s ease;"></div>
    </div>
</div>

<div id="overlay">
    <div><b>Gyro Space Prototype</b></div>
    <div id="status">Waiting...</div>
    <button id="audioToggleBtn">Audio: ALL ON</button>
    <div style="margin-top:8px;">Click to fire. Hold 3 sec for charged beam.<br>Hold [SPACE] to charge Dash.</div>
</div>

<!-- This game's own script, split out of this file 2026-09-04 (was one
     2,218-line inline block). Classic scripts sharing ONE global scope --
     every top-level name across them must be unique, and
     scripts/check-global-collisions.js enforces it.

     The order below is the ORIGINAL SOURCE ORDER and must stay that way:
     unlike the hub or Glass City, this game's load-time statements (pool
     fills, audio preloads, listener registration, the rAF boot) are spread
     through its sections rather than gathered at the end. See ST_PASS_PLAN.md. -->
<script src="st-core.js"></script>
<script src="st-audio.js"></script>
<script src="st-world.js"></script>
<script src="st-game.js"></script>
<script src="st-render.js"></script>
<script src="st-ui.js"></script>
<script src="st-motion.js"></script>
<script src="st-draw.js"></script>
<script src="st-boot.js"></script>
    
</body>
</html>
