<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hex Wall Defense</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Courier New', Courier, monospace; }
        canvas { display: block; }
        #ui { position: absolute; top: 0; left: 0; width: 100%; pointer-events: none; z-index: 10; padding: 20px; box-sizing: border-box; color: white; text-shadow: 2px 2px 0 #000; }
        .stats { display: flex; justify-content: space-between; font-size: 24px; font-weight: bold; }
        #gold { color: #ffd700; }
        #kills { color: #ff4d4d; }
        #gameover { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 64px; color: red; font-weight: bold; display: none; text-shadow: 4px 4px 0 #000; pointer-events: none;}
        #instructions { position: absolute; bottom: 20px; left: 20px; color: #aaa; font-size: 14px; pointer-events: none; }
    </style>
</head>
<body>
    <div id="ui">
        <div class="stats">
            <div id="gold">Gold: 100</div>
            <div id="kills">Kills: 0</div>
        </div>
    </div>
    <div id="gameover">DEFENSES BREACHED!</div>
    <div id="instructions">
        Left-Click: Build / Upgrade Wall<br>
        Shift + Left-Click: Add +10 Clicks (Fast Build)<br>
        Right-Click + Drag: Rotate Camera
    </div>

    <!-- Load Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // --- GAME STATE ---
        let gold = 100;
        let kills = 0;
        let isGameOver = false;
        
        // --- CONSTANTS ---
        const HEX_SIZE = 2;
        const BUILD_RADIUS = 8; 
        const FADE_RADIUS = 30; 
        const SPAWN_RADIUS = 40; 
        
        // --- THREE.JS SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);
        scene.fog = new THREE.Fog(0x000000, 20, 60);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 30, 40);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Infinite black plane
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(1000, 1000),
            new THREE.MeshBasicMaterial({ color: 0x000000 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.1; // Slightly below zero to prevent z-fighting with the grid
        scene.add(ground);

        // Controls (Fixed left-click issue by explicitly setting NONE for LEFT)
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.mouseButtons = {
            LEFT: THREE.MOUSE.NONE, 
            MIDDLE: THREE.MOUSE.DOLLY,
            RIGHT: THREE.MOUSE.ROTATE
        };
        controls.maxPolarAngle = Math.PI / 2 - 0.05; 
        controls.minDistance = 10;
        controls.maxDistance = 80;

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // --- MATERIALS & GEOMETRIES ---
        // 2D Vector Grid lines
        const hexShape = new THREE.CircleGeometry(HEX_SIZE, 6);
        hexShape.rotateZ(Math.PI / 6); // Make pointy-topped
        const edgesGeo = new THREE.EdgesGeometry(hexShape);
        const lineMat = new THREE.LineBasicMaterial({ color: 0xffffff });
        
        // Invisible hitboxes for raycasting
        const hitboxMat = new THREE.MeshBasicMaterial({ visible: false });

        // Wall & Towers
        const wallGeo = new THREE.CylinderGeometry(HEX_SIZE * 0.95, HEX_SIZE * 0.95, 1, 6);
        const wallMat = new THREE.MeshLambertMaterial({ color: 0xcccccc });
        const turretMat = new THREE.MeshLambertMaterial({ color: 0x4488ff });
        const laserMat = new THREE.MeshLambertMaterial({ color: 0xff3333, emissive: 0xaa0000 });
        
        // 2D Goblin Squares
        const goblinGeo = new THREE.PlaneGeometry(0.8, 0.8);
        const goblinMat = new THREE.MeshBasicMaterial({ color: 0x22cc22, transparent: true, opacity: 0, side: THREE.DoubleSide });
        
        // --- HEX GRID SYSTEM ---
        const hexes = new Map();

        function getHexKey(q, r) { return `${q},${r}`; }

        function axialToWorld(q, r) {
            const x = HEX_SIZE * Math.sqrt(3) * (q + r / 2);
            const z = HEX_SIZE * 3 / 2 * r;
            return { x, z };
        }

        function worldToAxial(x, z) {
            const q = (Math.sqrt(3) / 3 * x - 1 / 3 * z) / HEX_SIZE;
            const r = (2 / 3 * z) / HEX_SIZE;
            return hexRound(q, r);
        }

        function hexRound(q, r) {
            let s = -q - r;
            let rq = Math.round(q);
            let rr = Math.round(r);
            let rs = Math.round(s);
            const q_diff = Math.abs(rq - q);
            const r_diff = Math.abs(rr - r);
            const s_diff = Math.abs(rs - s);
            if (q_diff > r_diff && q_diff > s_diff) {
                rq = -rr - rs;
            } else if (r_diff > s_diff) {
                rr = -rq - rs;
            }
            return { q: rq, r: rr };
        }

        function hexDistance(q, r) {
            return (Math.abs(q) + Math.abs(q + r) + Math.abs(r)) / 2;
        }

        const gridGroup = new THREE.Group();
        scene.add(gridGroup);
        const hitboxes = [];

        // Generate Grid
        for (let q = -BUILD_RADIUS; q <= BUILD_RADIUS; q++) {
            for (let r = -BUILD_RADIUS; r <= BUILD_RADIUS; r++) {
                if (hexDistance(q, r) <= BUILD_RADIUS) {
                    const pos = axialToWorld(q, r);
                    
                    // Invisible Hitbox for clicking
                    const hitbox = new THREE.Mesh(hexShape, hitboxMat);
                    hitbox.rotation.x = -Math.PI / 2;
                    hitbox.position.set(pos.x, 0, pos.z);
                    gridGroup.add(hitbox);
                    hitboxes.push(hitbox);

                    // 2D White Line Grid
                    const hexLine = new THREE.LineLoop(edgesGeo, lineMat);
                    hexLine.rotation.x = -Math.PI / 2;
                    hexLine.position.set(pos.x, 0.01, pos.z);
                    scene.add(hexLine);

                    // Hex State Data
                    hexes.set(getHexKey(q, r), {
                        q, r, x: pos.x, z: pos.z,
                        clicks: 0,
                        hp: 0,
                        hitbox: hitbox,
                        mesh: null, // The 3D wall mesh when built
                        isCenter: (q === 0 && r === 0),
                        attachments: []
                    });
                }
            }
        }

        // Draw Thick Perimeter Boundary
        const perimeterRadius = HEX_SIZE * Math.sqrt(3) * (BUILD_RADIUS + 0.5);
        const perimeterGeo = new THREE.CircleGeometry(perimeterRadius, 6);
        perimeterGeo.rotateZ(Math.PI / 6);
        const perimeterEdges = new THREE.EdgesGeometry(perimeterGeo);
        // Using a tube for a guaranteed "thick" line in WebGL
        const perimeterLine = new THREE.LineLoop(perimeterEdges, new THREE.LineBasicMaterial({ color: 0xffffff }));
        perimeterLine.rotation.x = -Math.PI / 2;
        perimeterLine.position.y = 0.02;
        // Scale it manually since axial edge distance is slightly different than perfect circle
        perimeterLine.scale.set(1.05, 1.05, 1.05); 
        scene.add(perimeterLine);

        // Smaller Gold Pile visual
        const coinGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.1, 8);
        const coinMat = new THREE.MeshLambertMaterial({ color: 0xffd700 });
        const goldStacksGroup = new THREE.Group();
        scene.add(goldStacksGroup);

        function updateGoldVisual() {
            goldStacksGroup.clear();
            const numCoins = Math.min(100, Math.floor(gold)); // More visually responsive
            for(let i=0; i<numCoins; i++) {
                const coin = new THREE.Mesh(coinGeo, coinMat);
                const ang = Math.random() * Math.PI * 2;
                const rad = Math.random() * 0.8;
                coin.position.set(Math.cos(ang)*rad, 0.05 + (i * 0.03), Math.sin(ang)*rad);
                coin.rotation.y = Math.random();
                coin.rotation.z = (Math.random() - 0.5) * 0.1;
                goldStacksGroup.add(coin);
            }
        }
        updateGoldVisual();

        // --- INTERACTION (Fixed Raycasting) ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('pointerdown', (e) => {
            if (isGameOver || e.button !== 0) return; // Only Left Click

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            // Intersect with hitboxes instead of visible grid
            const intersects = raycaster.intersectObjects(hitboxes);
            if (intersects.length > 0) {
                const clickedHitbox = intersects[0].object;
                
                let targetHex = null;
                hexes.forEach(h => { if (h.hitbox === clickedHitbox) targetHex = h; });

                if (targetHex && !targetHex.isCenter) {
                    let blocked = false;
                    for (const g of goblins) {
                        if (Math.hypot(g.mesh.position.x - targetHex.x, g.mesh.position.z - targetHex.z) < HEX_SIZE) {
                            blocked = true; break;
                        }
                    }
                    
                    if (!blocked) {
                        const amount = e.shiftKey ? 10 : 1;
                        addClicksToHex(targetHex, amount);
                    }
                }
            }
        });

        function addClicksToHex(hex, amount) {
            hex.clicks += amount;
            hex.hp = hex.clicks * 10;
            updateHexVisuals(hex);
        }

        function updateHexVisuals(hex) {
            hex.attachments.forEach(a => scene.remove(a));
            hex.attachments = [];

            if (hex.mesh) {
                scene.remove(hex.mesh);
                hex.mesh = null;
            }

            if (hex.clicks === 0) return;

            // Spawn 3D Wall over the 2D grid
            const h = Math.min(9, hex.clicks); 
            hex.mesh = new THREE.Mesh(wallGeo, wallMat);
            hex.mesh.scale.y = h;
            hex.mesh.position.set(hex.x, h * 0.5, hex.z);
            // Re-align geometry to match pointy-topped grid
            hex.mesh.rotation.y = Math.PI / 6; 
            scene.add(hex.mesh);

            // Turrets (10-99)
            if (hex.clicks >= 10 && hex.clicks < 100) {
                const turrets = Math.floor(hex.clicks / 10);
                for(let i=0; i<Math.min(turrets, 5); i++) { 
                    const turret = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), turretMat);
                    const angle = (i / turrets) * Math.PI * 2;
                    const offset = turrets > 1 ? 0.6 : 0;
                    turret.position.set(
                        hex.x + Math.cos(angle) * offset,
                        h + 0.4,
                        hex.z + Math.sin(angle) * offset
                    );
                    scene.add(turret);
                    hex.attachments.push(turret);
                }
            }
            // Death Laser (100+)
            else if (hex.clicks >= 100) {
                const lasers = Math.floor(hex.clicks / 100);
                for(let i=0; i<Math.min(lasers, 3); i++) {
                    const laser = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 2), laserMat);
                    const angle = (i / lasers) * Math.PI * 2;
                    const offset = lasers > 1 ? 0.6 : 0;
                    laser.position.set(
                        hex.x + Math.cos(angle) * offset,
                        h + 1.0,
                        hex.z + Math.sin(angle) * offset
                    );
                    scene.add(laser);
                    hex.attachments.push(laser);
                }
            }
        }

        // --- GOBLIN SYSTEM ---
        const goblins = [];
        const clock = new THREE.Clock();

        function spawnWave() {
            if (isGameOver) return;
            const count = 20 + Math.floor(Math.random() * 30);
            const waveAngle = Math.random() * Math.PI * 2; 
            
            for (let i = 0; i < count; i++) {
                const angle = waveAngle + (Math.random() - 0.5) * 1.5; 
                const dist = SPAWN_RADIUS + Math.random() * 10;
                
                const mesh = new THREE.Mesh(goblinGeo, goblinMat.clone());
                mesh.position.set(Math.cos(angle) * dist, 0.4, Math.sin(angle) * dist);
                scene.add(mesh);
                
                goblins.push({
                    mesh: mesh,
                    hp: 20,
                    speed: 0.05 + Math.random() * 0.03,
                    state: 'approach', 
                    animOffset: Math.random() * Math.PI * 2
                });
            }
            
            setTimeout(spawnWave, 4000 + Math.random() * 6000);
        }
        setTimeout(spawnWave, 1000);

        // --- COMBAT & ANIMATION LOGIC ---
        const lazers = []; 
        let frameCount = 0;

        function updateGame() {
            frameCount++;
            const time = clock.getElapsedTime();

            for (let i = goblins.length - 1; i >= 0; i--) {
                const g = goblins[i];
                
                if (g.hp <= 0) {
                    scene.remove(g.mesh);
                    goblins.splice(i, 1);
                    kills++;
                    gold += 1;
                    document.getElementById('kills').innerText = `Kills: ${kills}`;
                    document.getElementById('gold').innerText = `Gold: ${gold}`;
                    updateGoldVisual();
                    continue;
                }

                const distToCenter = Math.hypot(g.mesh.position.x, g.mesh.position.z);
                
                // Fade in
                if (distToCenter > FADE_RADIUS) {
                    g.mesh.material.opacity = 0;
                } else if (distToCenter > BUILD_RADIUS * HEX_SIZE) {
                    g.mesh.material.opacity = 1 - ((distToCenter - BUILD_RADIUS * HEX_SIZE) / (FADE_RADIUS - BUILD_RADIUS * HEX_SIZE));
                } else {
                    g.mesh.material.opacity = 1;
                }

                // 2D Square Billboarding & Hopping Animation
                g.mesh.quaternion.copy(camera.quaternion); // Always face camera
                
                // If moving, animate wobble and hop
                if (g.state !== 'attack' && g.mesh.material.opacity > 0) {
                    g.mesh.rotateZ(Math.sin(time * 15 + g.animOffset) * 0.25);
                    g.mesh.position.y = 0.4 + Math.abs(Math.sin(time * 15 + g.animOffset)) * 0.6;
                } else {
                    g.mesh.position.y = 0.4; // flat on ground when attacking
                }

                if (g.state === 'flee') {
                    const angle = Math.atan2(g.mesh.position.z, g.mesh.position.x);
                    g.mesh.position.x += Math.cos(angle) * g.speed;
                    g.mesh.position.z += Math.sin(angle) * g.speed;
                    if (distToCenter > SPAWN_RADIUS) {
                        scene.remove(g.mesh);
                        goblins.splice(i, 1);
                    }
                    continue;
                }

                const ax = worldToAxial(g.mesh.position.x, g.mesh.position.z);
                
                if (distToCenter < 1.5) {
                    gold = Math.max(0, gold - 5);
                    document.getElementById('gold').innerText = `Gold: ${gold}`;
                    updateGoldVisual();
                    g.state = 'flee';
                    g.mesh.material.color.setHex(0xffff00); 
                    if (gold <= 0) {
                        isGameOver = true;
                        document.getElementById('gameover').style.display = 'block';
                    }
                    continue;
                }

                const dirX = -g.mesh.position.x;
                const dirZ = -g.mesh.position.z;
                const mag = Math.hypot(dirX, dirZ);
                const nextX = g.mesh.position.x + (dirX / mag) * g.speed * 10; 
                const nextZ = g.mesh.position.z + (dirZ / mag) * g.speed * 10;
                
                const nextAx = worldToAxial(nextX, nextZ);
                const nextHex = hexes.get(getHexKey(nextAx.q, nextAx.r));

                if (nextHex && nextHex.clicks > 0) {
                    g.state = 'attack';
                    // 10 hits to reduce 1 layer. We run 60fps. 
                    // Let's make an attack tick subtract HP properly.
                    nextHex.hp -= 0.5; 
                    
                    if (nextHex.hp <= 0) {
                        nextHex.clicks = 0;
                        updateHexVisuals(nextHex);
                        g.state = 'approach';
                    } else {
                        const expectedClicks = Math.ceil(nextHex.hp / 10);
                        if (expectedClicks !== nextHex.clicks) {
                            nextHex.clicks = expectedClicks;
                            updateHexVisuals(nextHex);
                        }
                    }
                } else {
                    g.state = 'approach';
                    g.mesh.position.x += (dirX / mag) * g.speed;
                    g.mesh.position.z += (dirZ / mag) * g.speed;
                }
            }

            // Tower Shooting Update
            if (frameCount % 10 === 0) {
                lazers.forEach(l => scene.remove(l));
                lazers.length = 0;

                hexes.forEach(hex => {
                    if (hex.clicks >= 10) {
                        const isLaser = hex.clicks >= 100;
                        const range = isLaser ? 25 : 15;
                        const damage = isLaser ? 20 : 5;
                        const shots = isLaser ? Math.floor(hex.clicks/100) : Math.floor(hex.clicks/10);

                        let fired = 0;
                        for (const g of goblins) {
                            if (fired >= shots) break;
                            const dist = Math.hypot(g.mesh.position.x - hex.x, g.mesh.position.z - hex.z);
                            if (dist < range && g.mesh.material.opacity > 0.5) {
                                g.hp -= damage;
                                fired++;

                                const material = new THREE.LineBasicMaterial({
                                    color: isLaser ? 0xff0000 : 0x00aaff, 
                                    linewidth: isLaser ? 3 : 1
                                });
                                const points = [];
                                points.push(new THREE.Vector3(hex.x, hex.clicks > 9 ? 5 : hex.clicks, hex.z));
                                points.push(g.mesh.position.clone());
                                const geometry = new THREE.BufferGeometry().setFromPoints(points);
                                const line = new THREE.Line(geometry, material);
                                scene.add(line);
                                lazers.push(line);
                            }
                        }
                    }
                });
            }
        }

        // --- RENDER LOOP ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            if (!isGameOver) {
                updateGame();
            }
            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
