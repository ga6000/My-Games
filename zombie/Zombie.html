<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DOS Zombie Survival: Multiplayer Edition</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; overflow: hidden;
            cursor: crosshair;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }
        canvas {
            display: block;
            image-rendering: pixelated; 
        }
        #ui {
            position: absolute; top: 20px; left: 20px;
            color: #55FF55; font-size: 20px;
            text-shadow: 2px 2px 0 #000; pointer-events: none; z-index: 10;
        }
        #gameover, #startprompt {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center; pointer-events: none;
            background: black; padding: 20px;
        }
        #gameover {
            color: #FF5555; font-size: 48px; display: none;
            border: 4px solid #FF5555;
        }
        #startprompt {
            color: #FFFFFF; font-size: 24px; border: 2px solid #55FF55;
        }
    </style>
</head>
<body>

    <div id="ui">
        TIME ALIVE: <span id="scoreDisplay">0</span><br>
        ZOMBIES: <span id="zombieCount">0</span><br>
        KILLS: <span id="killCount">0</span>
    </div>
    
    <div id="startprompt">
        MOVE MOUSE, PRESS W-A-S-D, or PRESS ARROWS to Join!
    </div>

    <div id="gameover">
        ALL PLAYERS DIED.<br>
        <span style="font-size: 24px; color: #55FF55;">Click anywhere to restart</span>
    </div>

    <canvas id="gameCanvas"></canvas>

<script src="../shared/mp-core.js"></script>
<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // ===================================================
    //   FIXED WORLD SIZE  (was: the browser viewport)
    // ===================================================
    // This used to be window.innerWidth/innerHeight, which is fine for a
    // single-player game but breaks the moment two people share a level:
    // a phone and a desktop would have differently-sized arenas, so walls
    // and spawn points wouldn't line up and players would collide with
    // geometry their friend can't see.
    //
    // The world is now a fixed 1600x900 and the canvas letterboxes it to
    // fit whatever screen it's on (see applyViewTransform). Because
    // `width`/`height` still name the world's bounds, every existing
    // collision check, spawn and clamp below keeps working unchanged --
    // they were already written in world coordinates, they just happened
    // to equal screen coordinates before.
    let width = 1600;
    let height = 900;

    // Screen-space letterbox: uniform scale + centering offsets,
    // recomputed on resize. viewScale is also what converts a mouse
    // position back into world coordinates.
    let viewScale = 1, viewOffsetX = 0, viewOffsetY = 0;

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        viewScale = Math.min(canvas.width / width, canvas.height / height);
        viewOffsetX = (canvas.width - width * viewScale) / 2;
        viewOffsetY = (canvas.height - height * viewScale) / 2;
    }

    function screenToWorld(sx, sy) {
        return {
            x: (sx - viewOffsetX) / viewScale,
            y: (sy - viewOffsetY) / viewScale
        };
    }

    resizeCanvas();

    // UI Elements
    const uiTime = document.getElementById('scoreDisplay');
    const uiZombies = document.getElementById('zombieCount');
    const uiKills = document.getElementById('killCount');
    const uiGameOver = document.getElementById('gameover');
    const uiStart = document.getElementById('startprompt');

    // DOS Colors
    const COLOR_BG = "#000000";
    const COLOR_ZOMBIE = "#FF5555"; 
    const COLOR_POWERFUL = "#AA00AA"; // Purple for powerful zombies
    const COLOR_WALL = "#AAAAAA"; 
    const COLOR_BULLET = "#FFFFFF";
    const COLOR_POWERUP = "#FFAA00";
    const P_COLORS = ["#55FFFF", "#FFFF55", "#FF55FF"];

    // Game State
    let gameOver = false;
    let gameStarted = false;
    let startTime = 0;
    let kills = 0;
    
    // Entities
    let players = [];
    let assignedControls = { mouse: null, wasd: null, arrows: null };
    let activePlayerCount = 0;
    
    let zombies = [];
    let zombiesSpawnedTotal = 0;
    let zombieBaseSpeed = 1.0;
    let zombieSpawnRate = 2000;
    let lastSpawnTime = 0;

    // Powerful Zombie Logic
    let nextPowerfulSpawn = 100;
    let powerfulWave = 0;

    let bullets = [];
    let powerups = [];
    let walls = [];

    // Inputs
    let mouseX = width / 2;
    let mouseY = height / 2;

    // ===================================================
    //   NETWORKING
    // ===================================================
    // Model: HOST-AUTHORITATIVE WORLD, client-owned players.
    //
    //  - Each client owns and moves its own player(s) and tells everyone
    //    where they are. Nobody is corrected on their own position --
    //    same trust model Gyro Space already uses, and the right call for
    //    a friend group (cheating here means cheating yourself out of a
    //    co-op game).
    //  - Exactly one client is the HOST (assigned by the server). It is
    //    the only one that spawns zombies, runs their AI, resolves bullet
    //    hits, and decides who died. Everyone else renders what it sends.
    //    Without a single authority, two clients spawning zombies from
    //    their own RNG would drift into two different games within
    //    seconds.
    //  - Walls come from the shared room seed (see generateLevel), so
    //    they never need to be sent at all.
    //
    // Couch co-op survives: a single client can still have up to 3 local
    // players on one keyboard, and each gets its own network identity
    // (socketId + control scheme), so a room can mix "three friends on
    // one sofa" with "two more online".
    const NET_SEND_MS = 66;          // ~15Hz, matches the project's existing "how often do we send" convention closely enough
    const REMOTE_TIMEOUT_MS = 5000;  // drop a peer's player if we stop hearing about it

    let netOnline = false;
    let netIsHost = true;            // solo players are their own host
    let netPrefix = "solo";

    let remotePlayers = {};          // netId -> rendered state from other clients
    let remoteBullets = [];          // host-authoritative bullets NOT owned by us
    let pendingReset = false;

    function netIdFor(p) {
        return netPrefix + ":" + p.ctrl;
    }

    function isMyNetId(id) {
        return typeof id === "string" && id.indexOf(netPrefix + ":") === 0;
    }

    MP.connect({
        game: "zombie",
        onReady: function (info) {
            netOnline = !info.solo;
            netIsHost = info.isHost;
            netPrefix = info.selfId || "solo";
            // The seed only becomes known here, so the level built at
            // page load was generated from a throwaway local seed.
            // Rebuild it now that we know what everyone else is using.
            generateLevel();
        },
        onHostChange: function (nowHost) {
            // Host migration: whoever is promoted keeps simulating from
            // the last world state it received, so zombies carry on from
            // roughly where they were rather than the arena emptying.
            netIsHost = nowHost;
        },
        onPeerLeave: function (peer) {
            if (!peer) return;
            Object.keys(remotePlayers).forEach(function (id) {
                if (id.indexOf(peer.id + ":") === 0) delete remotePlayers[id];
            });
        },
        onStatus: function (s) {
            netOnline = (s === "online");
            if (!netOnline) netIsHost = true; // dropped to solo -- simulate locally again
        },
        onMessage: function (msg) {
            if (!msg || !msg.k) return;

            if (msg.k === "players") {
                // Someone else's local players. Stored as render-only
                // state; we never simulate them.
                (msg.list || []).forEach(function (rp) {
                    if (isMyNetId(rp.id)) return; // never mirror our own back onto ourselves
                    const prev = remotePlayers[rp.id];
                    remotePlayers[rp.id] = {
                        id: rp.id, name: rp.name, color: rp.color,
                        size: rp.size, facingX: rp.facingX, facingY: rp.facingY,
                        minigunUntil: rp.mg || 0,
                        // Interpolate toward the reported position instead
                        // of snapping -- at 15Hz, snapping reads as a
                        // stutter rather than movement.
                        x: prev ? prev.x : rp.x,
                        y: prev ? prev.y : rp.y,
                        tx: rp.x, ty: rp.y,
                        lastSeen: Date.now()
                    };
                });
                return;
            }

            if (msg.k === "world") {
                if (netIsHost) return; // we ARE the authority; ignore stale peers
                applyWorldSnapshot(msg);
                return;
            }

            if (msg.k === "shoot" && netIsHost) {
                // A client fired. Only the host turns this into a real
                // bullet that can damage anything.
                bullets.push({
                    x: msg.x, y: msg.y, vx: msg.vx, vy: msg.vy,
                    size: 8, ownerColor: msg.color, owner: msg.id
                });
                return;
            }

            if (msg.k === "death") {
                // Host says one of our local players died.
                const p = players.find(function (pl) { return netIdFor(pl) === msg.id; });
                if (p) killLocalPlayer(p);
                delete remotePlayers[msg.id];
                return;
            }

            if (msg.k === "reset") {
                pendingReset = true;
                return;
            }
        }
    });

    function applyWorldSnapshot(msg) {
        // Zombies: reconcile by index rather than rebuilding the array,
        // so the interpolation targets survive between snapshots.
        const incoming = msg.z || [];
        const next = [];
        for (let i = 0; i < incoming.length; i++) {
            const zi = incoming[i];
            const prev = zombies[i];
            next.push({
                x: prev ? prev.x : zi[0],
                y: prev ? prev.y : zi[1],
                tx: zi[0], ty: zi[1],
                size: zi[2], hp: 1,
                color: zi[3] ? COLOR_POWERFUL : COLOR_ZOMBIE,
                isPowerful: !!zi[3],
                flashTime: zi[4] || 0,
                maxSpeedMult: 1, speedOffset: 0
            });
        }
        zombies = next;

        powerups = (msg.p || []).map(function (pu) {
            return { x: pu[0], y: pu[1], size: 16 };
        });

        // Other players' bullets only -- our own are simulated locally
        // below so our shots appear instantly instead of after a round
        // trip to the host.
        remoteBullets = (msg.b || [])
            .filter(function (b) { return !isMyNetId(b[4]); })
            .map(function (b) {
                return { x: b[0], y: b[1], size: 8, ownerColor: b[2], vx: b[3] ? b[3][0] : 0, vy: b[3] ? b[3][1] : 0 };
            });

        kills = msg.k2 || kills;

        if (msg.go && !gameOver) {
            gameOver = true;
            uiGameOver.style.display = 'block';
        }
    }

    function broadcastPlayers() {
        if (!netOnline || players.length === 0) return;
        if (!MP.canSend("players", NET_SEND_MS)) return;
        MP.send({
            k: "players",
            list: players.map(function (p) {
                return {
                    id: netIdFor(p), name: MP.selfName || "", color: p.color,
                    x: Math.round(p.x), y: Math.round(p.y), size: p.size,
                    facingX: +p.facingX.toFixed(2), facingY: +p.facingY.toFixed(2),
                    mg: p.minigunTimer
                };
            })
        });
    }

    function broadcastWorld() {
        if (!netOnline || !netIsHost) return;
        if (!MP.canSend("world", NET_SEND_MS)) return;
        // Packed as arrays rather than objects: with ~100 zombies in
        // flight this is the difference between a ~2KB and a ~7KB frame,
        // 15 times a second, on a free-tier server.
        MP.send({
            k: "world",
            z: zombies.map(function (z) {
                return [Math.round(z.x), Math.round(z.y), z.size, z.isPowerful ? 1 : 0, z.flashTime];
            }),
            b: bullets.map(function (b) {
                return [Math.round(b.x), Math.round(b.y), b.ownerColor, [b.vx, b.vy], b.owner || ""];
            }),
            p: powerups.map(function (pu) { return [Math.round(pu.x), Math.round(pu.y)]; }),
            k2: kills,
            go: gameOver
        });
    }

    function killLocalPlayer(p) {
        players = players.filter(function (pl) { return pl.id !== p.id; });
        assignedControls[p.ctrl] = null;
        checkAllDead();
    }

    function checkAllDead() {
        // Online, "everyone died" means every player in the ROOM, not
        // just the ones on this keyboard -- otherwise one client emptying
        // would show that client a game-over while their friends are
        // still alive and playing.
        const remoteAlive = Object.keys(remotePlayers).length > 0;
        if (players.length === 0 && (!netOnline || !remoteAlive)) {
            gameOver = true;
            uiGameOver.style.display = 'block';
        }
    }

    function pruneRemotePlayers() {
        const now = Date.now();
        Object.keys(remotePlayers).forEach(function (id) {
            if (now - remotePlayers[id].lastSeen > REMOTE_TIMEOUT_MS) delete remotePlayers[id];
        });
    }

    function interpolateRemotes() {
        // Positional smoothing between the 15Hz snapshots.
        const k = 0.35;
        Object.keys(remotePlayers).forEach(function (id) {
            const r = remotePlayers[id];
            r.x += (r.tx - r.x) * k;
            r.y += (r.ty - r.y) * k;
        });
        if (!netIsHost) {
            for (let i = 0; i < zombies.length; i++) {
                const z = zombies[i];
                if (z.tx === undefined) continue;
                z.x += (z.tx - z.x) * k;
                z.y += (z.ty - z.y) * k;
            }
        }
    }

    // --- PROCEDURAL GENERATION ---
    function generateLevel() {
        // MP.random() instead of Math.random(): every client in the room
        // shares one server-issued seed, so this produces the IDENTICAL
        // building layout on every screen. resetRandom() rewinds to the
        // start of that seeded stream first, so a mid-session restart
        // regenerates the same level rather than continuing a stream
        // each client has advanced a different number of times.
        MP.resetRandom();

        walls = [];
        const thickness = 20;
        const numBuildings = 4 + Math.floor(MP.random() * 5);

        for(let i=0; i<numBuildings; i++) {
            let bx, by;
            do {
                bx = MP.random() * (width - 200) + 100;
                by = MP.random() * (height - 200) + 100;
            } while (Math.abs(bx - width/2) < 200 && Math.abs(by - height/2) < 200);

            let bw = 120 + MP.random() * 150;
            let bh = 120 + MP.random() * 150;

            let top = {x: bx - bw/2, y: by - bh/2, w: bw, h: thickness};
            let bottom = {x: bx - bw/2, y: by + bh/2 - thickness, w: bw, h: thickness};
            let left = {x: bx - bw/2, y: by - bh/2, w: thickness, h: bh};
            let right = {x: bx + bw/2 - thickness, y: by - bh/2, w: thickness, h: bh};

            let buildingWalls = [top, bottom, left, right];

            // 60% chance for Nook (3 walls), 40% chance for Through (2 parallel walls)
            if (MP.random() < 0.6) {
                // Nook: Remove 1 random wall
                buildingWalls.splice(Math.floor(MP.random()*4), 1);
            } else {
                // Through: Remove 2 opposite walls
                if (MP.random() < 0.5) {
                    buildingWalls.splice(0, 2); // removes top & bottom
                } else {
                    buildingWalls.splice(2, 2); // removes left & right
                }
            }
            walls.push(...buildingWalls);
        }
        
        // *Note: Explicit border walls removed so zombies can walk in.*
    }

    // --- PLAYER SPAWNING ---
    function spawnPlayer(ctrlType) {
        if (assignedControls[ctrlType] || activePlayerCount >= 3) return;
        
        // Colour: online, the FIRST local player wears this client's
        // server-assigned name-hash colour, so they're the same colour
        // here as on the hub roster and in every other game. Extra couch
        // co-op players on the same keyboard fall back to the local
        // palette, since they share one network identity and can't each
        // have their own hashed colour. (Modulo guards the palette
        // lookup -- activePlayerCount is never decremented on death, so
        // a raw index could run past the end of the array.)
        const useNetColor = netOnline && activePlayerCount === 0 && MP.selfColor;

        // Spread clients out around the centre instead of stacking every
        // player in the room on the exact same pixel.
        const spawnAngle = (hashToUnit(netPrefix) * Math.PI * 2) + (activePlayerCount * 0.7);
        const spawnRadius = netOnline ? 90 : 30;

        let p = {
            id: activePlayerCount,
            color: useNetColor ? MP.selfColor : P_COLORS[activePlayerCount % P_COLORS.length],
            ctrl: ctrlType,
            x: width/2 + Math.cos(spawnAngle) * spawnRadius + (activePlayerCount * 30 - 30),
            y: height/2 + Math.sin(spawnAngle) * spawnRadius,
            size: 16,
            speed: 4,
            facingX: 1, facingY: 0,
            lastShotTime: 0,
            minigunTimer: 0,
            keys: { up:false, down:false, left:false, right:false, shoot:false }
        };
        
        assignedControls[ctrlType] = p;
        players.push(p);
        activePlayerCount++;

        if (!gameStarted) {
            gameStarted = true;
            uiStart.style.display = 'none';
            startTime = Date.now();
            lastSpawnTime = startTime;
        }
    }

    // --- INPUT HANDLING ---
    window.addEventListener('keydown', (e) => {
        let key = e.key.toLowerCase();
        
        if (['w','a','s','d','e'].includes(key)) {
            if (!assignedControls.wasd) spawnPlayer('wasd');
            let p = assignedControls.wasd;
            if (p) {
                if (key === 'w') p.keys.up = true;
                if (key === 's') p.keys.down = true;
                if (key === 'a') p.keys.left = true;
                if (key === 'd') p.keys.right = true;
                if (key === 'e') p.keys.shoot = true;
            }
        }
        
        if (['arrowup','arrowdown','arrowleft','arrowright','/'].includes(key)) {
            if (['arrowup','arrowdown','arrowleft','arrowright','/'].includes(key)) e.preventDefault();
            
            if (!assignedControls.arrows) spawnPlayer('arrows');
            let p = assignedControls.arrows;
            if (p) {
                if (key === 'arrowup') p.keys.up = true;
                if (key === 'arrowdown') p.keys.down = true;
                if (key === 'arrowleft') p.keys.left = true;
                if (key === 'arrowright') p.keys.right = true;
                if (key === '/') p.keys.shoot = true;
            }
        }
    }, {passive: false});

    window.addEventListener('keyup', (e) => {
        let key = e.key.toLowerCase();
        let pW = assignedControls.wasd;
        if (pW) {
            if (key === 'w') pW.keys.up = false;
            if (key === 's') pW.keys.down = false;
            if (key === 'a') pW.keys.left = false;
            if (key === 'd') pW.keys.right = false;
            if (key === 'e') pW.keys.shoot = false;
        }
        
        let pA = assignedControls.arrows;
        if (pA) {
            if (key === 'arrowup') pA.keys.up = false;
            if (key === 'arrowdown') pA.keys.down = false;
            if (key === 'arrowleft') pA.keys.left = false;
            if (key === 'arrowright') pA.keys.right = false;
            if (key === '/') pA.keys.shoot = false;
        }
    });

    window.addEventListener('mousemove', (e) => {
        // Convert through the letterbox -- the canvas is no longer 1:1
        // with the world, so raw client coords would aim wrong on any
        // screen whose aspect ratio isn't exactly 16:9.
        const w = screenToWorld(e.clientX, e.clientY);
        mouseX = w.x; mouseY = w.y;
        if (!assignedControls.mouse) spawnPlayer('mouse');
    });

    window.addEventListener('mousedown', (e) => {
        if (gameOver) { requestReset(); return; }
        if (!assignedControls.mouse) spawnPlayer('mouse');
        if (assignedControls.mouse) assignedControls.mouse.keys.shoot = true;
    });

    window.addEventListener('mouseup', () => {
        if (assignedControls.mouse) assignedControls.mouse.keys.shoot = false;
    });

    // The world no longer changes size on resize -- only the letterbox
    // that maps it onto this particular screen does.
    window.addEventListener('resize', resizeCanvas);

    // --- UTILS ---
    // Stable 0..1 from a string, used to give each client a different
    // spawn angle without needing the server to hand out positions.
    function hashToUnit(str) {
        let h = 5381;
        for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0;
        return (Math.abs(h) % 10000) / 10000;
    }

    function rectIntersect(r1x, r1y, r1w, r1h, r2x, r2y, r2w, r2h) {
        return r1x < r2x + r2w && r1x + r1w > r2x && r1y < r2y + r2h && r1y + r1h > r2y;
    }

    function moveWithCollisions(entity, dx, dy, isPlayer) {
        entity.x += dx;
        for (let w of walls) {
            if (rectIntersect(entity.x, entity.y, entity.size, entity.size, w.x, w.y, w.w, w.h)) {
                if (dx > 0) entity.x = w.x - entity.size;
                else if (dx < 0) entity.x = w.x + w.w;
            }
        }
        
        entity.y += dy;
        for (let w of walls) {
            if (rectIntersect(entity.x, entity.y, entity.size, entity.size, w.x, w.y, w.w, w.h)) {
                if (dy > 0) entity.y = w.y - entity.size;
                else if (dy < 0) entity.y = w.y + w.h;
            }
        }

        // Only clamp the player to the screen edges so zombies can spawn/walk outside 
        if (isPlayer) {
            entity.x = Math.max(0, Math.min(width - entity.size, entity.x));
            entity.y = Math.max(0, Math.min(height - entity.size, entity.y));
        }
    }

    // --- SPAWNERS ---
    function spawnZombie(isPowerful = false) {
        let zx, zy;
        // Spawn randomly outside edges
        if (Math.random() < 0.5) {
            zx = Math.random() < 0.5 ? -40 : width + 40;
            zy = Math.random() * height;
        } else {
            zx = Math.random() * width;
            zy = Math.random() < 0.5 ? -40 : height + 40;
        }
        
        let size = isPowerful ? 24 : 16;
        let hp = isPowerful ? 5 : 1;
        let speedMult = isPowerful ? 1.4 : 1.0;
        let color = isPowerful ? COLOR_POWERFUL : COLOR_ZOMBIE;

        zombies.push({ 
            x: zx, y: zy, size: size, hp: hp, 
            color: color, isPowerful: isPowerful, maxSpeedMult: speedMult, flashTime: 0,
            speedOffset: (Math.random() * 0.4) - 0.2 
        });

        if (!isPowerful) {
            zombiesSpawnedTotal++;
            // Power-up Logic
            if (zombiesSpawnedTotal % 20 === 0 && zombiesSpawnedTotal > 0) {
                powerups.push({
                    x: 50 + Math.random() * (width - 100),
                    y: 50 + Math.random() * (height - 100),
                    size: 16
                });
            }
        }
    }

    function shoot(p) {
        let bs = 10;
        const b = {
            x: p.x + p.size/2 - 4,
            y: p.y + p.size/2 - 4,
            vx: p.facingX * bs,
            vy: p.facingY * bs,
            size: 8,
            ownerColor: p.color,
            owner: netIdFor(p)
        };

        // Always spawn locally so your own shot appears on the same frame
        // you pressed fire. On a non-host client this is prediction: the
        // host is spawning its own authoritative copy of this bullet for
        // damage purposes, and we filter that copy out of what we render
        // (see applyWorldSnapshot) so it isn't drawn twice.
        bullets.push(b);

        if (netOnline && !netIsHost) {
            MP.send({
                k: "shoot",
                id: b.owner, x: b.x, y: b.y, vx: b.vx, vy: b.vy, color: b.ownerColor
            });
        }
    }

    function resetGame() {
        players = [];
        assignedControls = { mouse: null, wasd: null, arrows: null };
        activePlayerCount = 0;
        zombies = [];
        bullets = [];
        powerups = [];
        zombiesSpawnedTotal = 0;
        zombieBaseSpeed = 1.0;
        zombieSpawnRate = 2000;
        kills = 0;
        gameOver = false;
        gameStarted = false;
        
        nextPowerfulSpawn = 100;
        powerfulWave = 0;

        remotePlayers = {};
        remoteBullets = [];

        uiGameOver.style.display = 'none';
        uiStart.style.display = 'block';

        generateLevel();
    }

    // Restart is room-wide: one person clicking "restart" shouldn't drop
    // them into a fresh level while everyone else is still staring at a
    // game-over screen. echo:true so the sender resets on the same
    // message path as everyone else rather than a separate local branch.
    function requestReset() {
        if (netOnline) MP.send({ k: "reset" }, true);
        else resetGame();
    }

    // --- MAIN LOOP ---
    function update() {
        if (!gameStarted || gameOver) return;

        let now = Date.now();
        uiTime.innerText = Math.floor((now - startTime) / 1000) + "s";
        uiZombies.innerText = zombies.length;
        uiKills.innerText = kills;

        // Difficulty scaling + spawning: HOST ONLY. Zombie spawn timing
        // and placement use plain Math.random() quite deliberately -- the
        // host is the sole authority and broadcasts the results, so these
        // rolls never need to agree with anyone else's. (Contrast
        // generateLevel, which every client runs independently and which
        // therefore must use the shared seeded MP.random().)
        if (netIsHost) {
            zombieBaseSpeed += 0.0003;
            if (zombieSpawnRate > 200) zombieSpawnRate -= 0.3;

            // Spawn regular zombies
            if (now - lastSpawnTime > zombieSpawnRate) {
                spawnZombie(false);
                lastSpawnTime = now;
            }

            // Spawn Powerful zombie waves
            if (zombiesSpawnedTotal >= nextPowerfulSpawn) {
                powerfulWave++;
                let qty = 1 + Math.floor(powerfulWave / 3); // Quantity steps up
                for(let k = 0; k < qty; k++) {
                    spawnZombie(true);
                }

                // Frequency steps up (gap between required regular spawns shrinks)
                let requiredGap = Math.max(20, 100 - (powerfulWave * 15));
                nextPowerfulSpawn += requiredGap;
            }
        }

        // 1. UPDATE PLAYERS
        for (let i = players.length - 1; i >= 0; i--) {
            let p = players[i];
            let vx = 0, vy = 0;

            if (p.ctrl === 'mouse') {
                let dx = mouseX - (p.x + p.size/2);
                let dy = mouseY - (p.y + p.size/2);
                let dist = Math.hypot(dx, dy);
                if (dist > 2) {
                    let moveSpeed = Math.min(p.speed, dist);
                    vx = (dx / dist) * moveSpeed;
                    vy = (dy / dist) * moveSpeed;
                }
                if (dist > 0) {
                    p.facingX = dx / dist;
                    p.facingY = dy / dist;
                }
            } else {
                if (p.keys.up) vy -= p.speed;
                if (p.keys.down) vy += p.speed;
                if (p.keys.left) vx -= p.speed;
                if (p.keys.right) vx += p.speed;
                
                if (vx !== 0 && vy !== 0) {
                    let length = Math.hypot(vx, vy);
                    vx = (vx / length) * p.speed;
                    vy = (vy / length) * p.speed;
                }
                
                if (vx !== 0 || vy !== 0) {
                    let length = Math.hypot(vx, vy);
                    p.facingX = vx / length;
                    p.facingY = vy / length;
                }
            }

            moveWithCollisions(p, vx, vy, true); // true = clamp to screen bounds

            // Powerup collection
            for (let j = powerups.length - 1; j >= 0; j--) {
                let pu = powerups[j];
                if (rectIntersect(p.x, p.y, p.size, p.size, pu.x, pu.y, pu.size, pu.size)) {
                    p.minigunTimer = now + 5000;
                    powerups.splice(j, 1);
                }
            }

            // Shooting
            let cooldown = (now < p.minigunTimer) ? 100 : 1000; 
            if (p.keys.shoot && now - p.lastShotTime > cooldown) {
                shoot(p);
                p.lastShotTime = now;
            }
        }

        // 2. UPDATE BULLETS
        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            b.x += b.vx;
            b.y += b.vy;

            // Wall collision
            let hitWall = false;
            for (let w of walls) {
                if (rectIntersect(b.x, b.y, b.size, b.size, w.x, w.y, w.w, w.h)) {
                    hitWall = true; break;
                }
            }
            
            if (hitWall || b.x < 0 || b.x > width || b.y < 0 || b.y > height) {
                bullets.splice(i, 1);
                continue;
            }

            // Zombie collision — HOST ONLY. A non-host client is running
            // these bullets purely as a visual prediction of its own
            // shots; letting it also decide what died would mean two
            // clients disagreeing about the zombie count within seconds.
            if (!netIsHost) continue;

            for (let j = zombies.length - 1; j >= 0; j--) {
                let z = zombies[j];
                if (rectIntersect(b.x, b.y, b.size, b.size, z.x, z.y, z.size, z.size)) {
                    z.hp--;
                    if (z.hp <= 0) {
                        zombies.splice(j, 1);
                        kills += z.isPowerful ? 5 : 1; // More points for tough zombies
                    } else {
                        z.flashTime = now + 50; // Visual feedback for damage
                    }
                    bullets.splice(i, 1);
                    break;
                }
            }
        }

        // 3. UPDATE ZOMBIES — HOST ONLY.
        // Non-hosts skip this entirely; their zombies come from the
        // host's snapshot and are smoothed in interpolateRemotes().
        if (netIsHost) {
            // Zombies must chase EVERY player in the room, not just the
            // ones on this keyboard -- otherwise a remote player could
            // stand in the open and never be attacked.
            const targets = players.map(function (p) {
                return { x: p.x, y: p.y, size: p.size, ref: p, local: true, id: netIdFor(p) };
            }).concat(Object.keys(remotePlayers).map(function (id) {
                const r = remotePlayers[id];
                return { x: r.x, y: r.y, size: r.size || 16, ref: r, local: false, id: id };
            }));

            for (let i = zombies.length - 1; i >= 0; i--) {
                let z = zombies[i];

                // Find closest player
                let closest = null;
                let minDist = Infinity;
                for (let t of targets) {
                    let dist = Math.hypot(t.x - z.x, t.y - z.y);
                    if (dist < minDist) { minDist = dist; closest = t; }
                }

                if (closest) {
                    let dx = closest.x - z.x;
                    let dy = closest.y - z.y;
                    let dist = Math.hypot(dx, dy);
                    if (dist > 0) {
                        let speed = (zombieBaseSpeed + z.speedOffset) * z.maxSpeedMult;
                        moveWithCollisions(z, (dx/dist)*speed, (dy/dist)*speed, false); // false = DO NOT clamp to screen
                    }

                    if (rectIntersect(closest.x, closest.y, closest.size, closest.size, z.x, z.y, z.size, z.size)) {
                        // The host decides who died, and tells them.
                        if (netOnline) MP.send({ k: "death", id: closest.id }, true);

                        if (closest.local) {
                            killLocalPlayer(closest.ref);
                        } else {
                            delete remotePlayers[closest.id];
                            checkAllDead();
                        }
                    }
                }
            }
        }

        // Smooth remote players (and, on a client, remote zombies)
        // between the 15Hz snapshots, then publish our own state.
        interpolateRemotes();
        pruneRemotePlayers();
        broadcastPlayers();
        broadcastWorld();
    }

    function draw() {
        // Letterbox: clear the whole physical canvas first (in screen
        // space), then switch into world space so every draw call below
        // can keep using world coordinates exactly as it always has.
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillStyle = "#000000";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.setTransform(viewScale, 0, 0, viewScale, viewOffsetX, viewOffsetY);

        ctx.fillStyle = COLOR_BG;
        ctx.fillRect(0, 0, width, height);

        // Visual DOS screen border (Decorative, not physics)
        ctx.strokeStyle = COLOR_WALL;
        ctx.lineWidth = 2;
        ctx.strokeRect(1, 1, width - 2, height - 2);

        // Draw Walls
        ctx.fillStyle = COLOR_WALL;
        for (let w of walls) {
            ctx.fillRect(w.x, w.y, w.w, w.h);
            ctx.fillStyle = "#FFFFFF";
            ctx.fillRect(w.x, w.y, w.w, 2);
            ctx.fillRect(w.x, w.y, 2, w.h);
            ctx.fillStyle = COLOR_WALL; 
        }

        // Draw Powerups
        for (let pu of powerups) {
            ctx.fillStyle = (Date.now() % 300 < 150) ? COLOR_POWERUP : "#FFFFFF";
            ctx.fillRect(pu.x, pu.y, pu.size, pu.size);
            ctx.fillStyle = "#000";
            ctx.font = "12px Courier";
            ctx.fillText("M", pu.x + 3, pu.y + 12);
        }

        // Draw Zombies
        let now = Date.now();
        for (let z of zombies) {
            // Flash white if recently damaged
            ctx.fillStyle = (now < z.flashTime) ? "#FFFFFF" : z.color;
            ctx.fillRect(z.x, z.y, z.size, z.size);
        }

        // Draw Bullets — ours (locally simulated, zero latency) plus
        // everyone else's, which arrive in the host's snapshot with our
        // own copies already filtered out so nothing is drawn twice.
        for (let b of bullets) {
            ctx.fillStyle = b.ownerColor;
            ctx.fillRect(b.x, b.y, b.size, b.size);
        }
        for (let b of remoteBullets) {
            ctx.fillStyle = b.ownerColor;
            ctx.fillRect(b.x, b.y, b.size, b.size);
        }

        // Draw remote players. Same look as local ones, with a name tag
        // so you can tell who's who -- three cyan squares on screen is
        // ambiguous once they're not all on your own keyboard.
        for (let id in remotePlayers) {
            if (!Object.prototype.hasOwnProperty.call(remotePlayers, id)) continue;
            const r = remotePlayers[id];
            ctx.fillStyle = r.color || "#55FFFF";
            ctx.fillRect(r.x, r.y, r.size, r.size);

            ctx.fillStyle = "#FFFFFF";
            const rnx = r.x + r.size/2 + (r.facingX * 12) - 2;
            const rny = r.y + r.size/2 + (r.facingY * 12) - 2;
            ctx.fillRect(rnx, rny, 4, 4);

            if (r.name) {
                ctx.font = "12px Courier";
                ctx.textAlign = "center";
                ctx.fillStyle = r.color || "#FFFFFF";
                ctx.fillText(r.name, r.x + r.size/2, r.y - 6);
                ctx.textAlign = "left";
            }
        }

        // Draw Players
        for (let p of players) {
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, p.size, p.size);
            
            if (now < p.minigunTimer) {
                ctx.strokeStyle = COLOR_POWERUP;
                ctx.lineWidth = 2;
                ctx.strokeRect(p.x - 4, p.y - 4, p.size + 8, p.size + 8);
            }

            ctx.fillStyle = "#FFFFFF";
            let nubX = p.x + p.size/2 + (p.facingX * 12) - 2;
            let nubY = p.y + p.size/2 + (p.facingY * 12) - 2;
            ctx.fillRect(nubX, nubY, 4, 4);
        }
    }

    function gameLoop() {
        // Applied here rather than inside the message handler so the
        // reset lands on a frame boundary, not mid-update with half the
        // entity arrays already iterated.
        if (pendingReset) {
            pendingReset = false;
            resetGame();
        }
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    // Init
    generateLevel();
    requestAnimationFrame(gameLoop);

</script>
</body>
</html>
