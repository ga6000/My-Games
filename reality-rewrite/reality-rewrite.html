<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reality Rewrite - Enhanced Arena</title>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --text-color: #222222;
            --stable-color: #ffffff;
            --warn-color: #fdfd96;
            --critical-color: #ffb7b2;
            --ui-bg: rgba(255, 255, 255, 0.9);
        }

        * { box-sizing: border-box; }
        
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        #gameCanvas {
            display: block;
            width: 100%; height: 100%;
            cursor: crosshair;
        }

        /* Visibility Vignette */
        #vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background: radial-gradient(circle at center, transparent 22%, rgba(0,0,0,0.3) 45%, rgba(0,0,0,0.9) 100%);
            filter: blur(9px);
            transition: background 1s ease;
            z-index: 5;
        }

        /* UI Layer */
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 10;
        }

        /* Match Timer */
        #match-timer {
            position: absolute;
            top: 20px; right: 20px;
            font-size: 32px;
            font-weight: bold;
            color: var(--text-color);
            background: var(--ui-bg);
            padding: 10px 20px;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            letter-spacing: 2px;
        }

        /* Scoreboard */
        #scoreboard {
            position: absolute;
            top: 20px; left: 20px;
            background: var(--ui-bg);
            padding: 15px 20px;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            pointer-events: auto;
        }

        .score-row {
            display: flex; justify-content: space-between;
            margin-bottom: 8px; font-size: 13px; color: var(--text-color); gap: 20px;
        }
        .score-row.player {
            font-weight: bold; margin-bottom: 12px; padding-bottom: 12px;
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }
        .score-row span { min-width: 30px; text-align: right; }
        .score-row .name { text-align: left; flex-grow: 1; }

        /* Active Cards (Left Side) */
        #active-cards {
            position: absolute;
            top: 180px; left: 20px;
            display: flex; flex-direction: column; gap: 10px;
        }
        .card {
            background: var(--ui-bg); padding: 10px 15px;
            border-left: 4px solid #333; border-radius: 0 4px 4px 0;
            font-size: 12px; font-weight: bold; text-transform: uppercase;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn { from { transform: translateX(-20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* Stability Meter */
        #top-center {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            display: flex; flex-direction: column; align-items: center; gap: 8px;
        }
        .meter-container { display: flex; align-items: center; gap: 15px; }
        #stability-bar-container {
            width: 300px; height: 6px; background-color: rgba(0,0,0,0.2); border-radius: 3px; overflow: hidden;
        }
        #stability-bar { width: 100%; height: 100%; background-color: var(--stable-color); transition: width 0.1s linear; }

        /* Bottom HUD */
        #player-hud {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 20px; font-size: 14px; font-weight: bold;
            background: var(--ui-bg); padding: 10px 20px; border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* Modals */
        #author-modal {
            display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95); padding: 30px 40px; border-radius: 8px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3); pointer-events: auto; text-align: center; z-index: 100;
        }
        .options-container { display: flex; gap: 15px; justify-content: center; margin-top: 15px; }
        .author-option {
            background: #fff; border: 2px solid #eee; padding: 15px; cursor: pointer; width: 140px;
            border-radius: 6px; transition: all 0.2s;
        }
        .author-option:hover { border-color: var(--text-color); transform: translateY(-3px); }
        .author-option h3 { margin: 0 0 5px 0; font-size: 14px; }
        .author-option span { font-size: 11px; color: #666; }

        #fullscreen-overlay {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.85); z-index: 200;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        #giant-countdown { font-size: 150px; font-weight: 900; color: #d9534f; margin: 0; display: none; }
        #end-rankings { display: none; text-align: center; }
        #end-rankings h1 { font-size: 48px; margin-bottom: 20px; }
        .rank-row { font-size: 24px; margin: 10px 0; font-weight: bold; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="vignette"></div>
    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div id="match-timer">3:00</div>
        
        <div id="scoreboard">
            <div class="score-row player" id="sb-player">
                <span class="name">YOU</span><span title="Score">0</span><span>K 0</span><span>D 0</span>
            </div>
            <div id="sb-bots"></div>
        </div>

        <div id="active-cards"></div>

        <div id="top-center">
            <div class="meter-container">
                <div id="stability-bar-container"><div id="stability-bar"></div></div>
            </div>
            <div style="font-size: 11px; font-weight: bold; letter-spacing: 2px;">REALITY STABILITY</div>
        </div>

        <div id="player-hud">
            <div id="hud-hp">HP: 100</div>
            <div id="hud-ammo">AMMO: 8/8</div>
            <div id="hud-orb">ORB [E]: RDY</div>
        </div>
    </div>

    <div id="author-modal">
        <h2 style="margin:0; letter-spacing:2px;">REALITY COLLAPSE</h2>
        <div id="author-countdown" style="font-size: 20px; color: #d9534f; font-weight: bold;">5.0</div>
        <div class="options-container" id="author-options"></div>
    </div>

    <div id="fullscreen-overlay" style="display:none;">
        <div id="giant-countdown">3</div>
        <div id="end-rankings"></div>
    </div>

<script>
/**
 * Reality Rewrite - Enhanced
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let width, height;
function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width; canvas.height = height;
}
resize();

// -----------------------------------------------------------
// MATH HELPERS (Restored)
// -----------------------------------------------------------
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const lerp = (a, b, t) => a + (b - a) * t;

// UI Elements
const ui = {
    timer: document.getElementById('match-timer'),
    stabBar: document.getElementById('stability-bar'),
    sbPlayer: document.getElementById('sb-player'),
    sbBots: document.getElementById('sb-bots'),
    hudHp: document.getElementById('hud-hp'),
    hudAmmo: document.getElementById('hud-ammo'),
    hudOrb: document.getElementById('hud-orb'),
    modal: document.getElementById('author-modal'),
    options: document.getElementById('author-options'),
    countdown: document.getElementById('author-countdown'),
    overlay: document.getElementById('fullscreen-overlay'),
    giantCount: document.getElementById('giant-countdown'),
    endRankings: document.getElementById('end-rankings'),
    cardsContainer: document.getElementById('active-cards'),
    vignette: document.getElementById('vignette')
};

// Game State
const STATE = { PLAYING: 0, AUTHOR_PHASE: 1, ENDING: 2, GAME_OVER: 3 };
let gameState = STATE.PLAYING;
let lastTime = performance.now();
let gameTimer = 180.0; // 3 minutes

// Mechanics
let stability = 100.0;
let camera = { x: 0, y: 0, shake: 0 };
let authorTimer = 0;
let activeCards = [];
let hasDuplicated = false;
let hitStop = 0; // brief dt dampening on player-involved kills, for punch

// Map Size (Starts at 3000x3000, symmetrical museum)
let mapBounds = { x: 0, y: 0, w: 3000, h: 3000 };

// Central pool feature, set by buildMap(). 'lobes' describes the quatrefoil: an
// elongated main body plus two side lobes, all drawn with the same fill so they
// visually fuse into one shape.
let waterFeature = { x: 0, y: 0, radius: 130 };
let poolLobes = [];
const POOL_EXCLUSION_RADIUS = 280;
const SPAWN_SAFE_DIST = 500;

// Card Database
const SHIFTS = [
    { id: 'ricochet', name: 'Ballistics', desc: 'Your bullets bounce.', type: 'buff', color: '#3498db' },
    { id: 'voidgun', name: 'Void Gun', desc: 'R-Click destroys terrain.', type: 'buff', color: '#9b59b6' },
    { id: 'phase', name: 'Phase', desc: 'Walk through cover.', type: 'buff', color: '#1abc9c' },
    { id: 'stasis', name: 'Stasis', desc: 'Enemy bullets are 90% slower.', type: 'debuff', color: '#e67e22' },
    { id: 'blind', name: 'Blind', desc: 'Drastically reduces enemy vision.', type: 'debuff', color: '#34495e' },
    { id: 'shrink', name: 'Shrink', desc: 'Arena walls close in.', type: 'global', color: '#e74c3c' },
    { id: 'growth', name: 'Growth', desc: 'All cover doubles in size.', type: 'global', color: '#2ecc71' },
    { id: 'fragility', name: 'Fragility', desc: 'All cover can be destroyed.', type: 'global', color: '#f1c40f' },
    { id: 'duplicate', name: 'Duplicate', desc: 'Arena quadruples in size.', type: 'global', color: '#ff00ff', unique: true }
];

// Input
const keys = {};
const mouse = { x: width/2, y: height/2, wx: 0, wy: 0, left: false, right: false };

function attachInputListeners(signal) {
    window.addEventListener('resize', resize, { signal });
    window.addEventListener('keydown', e => { 
        keys[e.key.toLowerCase()] = true; 
        if(e.key.toLowerCase()==='r' && player) player.forceReload(); 
        if(e.key.toLowerCase()==='e' && player) player.fireOrb();
    }, { signal });
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false, { signal });
    window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; }, { signal });
    window.addEventListener('mousedown', e => { if(e.button === 0) mouse.left = true; if(e.button === 2) mouse.right = true; }, { signal });
    window.addEventListener('mouseup', e => { if(e.button === 0) mouse.left = false; if(e.button === 2) mouse.right = false; }, { signal });
}

const COSTS = { shoot: -0.5, barrier: -1.5, kill: -5, orb: -3 };
const RELOAD_TIME = 4.5;

// ---- Hub shell: lifecycle state + identity ----
let animFrameId = null;
let isPaused = false;
let listenerController = null;
let pendingTimers = [];
let identity = { name: 'YOU', color: '#3498db', room: 'public' };

// setTimeout/setInterval wrappers so destroy() can cancel anything still pending
// (respawn timers, the end-of-match countdown) instead of leaking callbacks.
function trackTimeout(fn, ms) {
    let id = setTimeout(() => { pendingTimers = pendingTimers.filter(t => t !== id); fn(); }, ms);
    pendingTimers.push(id);
    return id;
}
function trackInterval(fn, ms) {
    let id = setInterval(fn, ms);
    pendingTimers.push(id);
    return id;
}

// djb2-style hash, matching the hub's name-based color assignment in spirit.
// Only used as a fallback when no color is supplied — see resolveIdentity().
function nameHash(name) {
    let hash = 5381;
    for (let i = 0; i < name.length; i++) {
        hash = ((hash << 5) + hash) + name.charCodeAt(i);
        hash |= 0; // keep it a 32-bit int
    }
    return Math.abs(hash);
}

// Darkens a #rrggbb color for the arm shade. Anything else (hsl(), named colors)
// is returned unchanged, so it degrades gracefully rather than throwing.
function darken(hex, amt) {
    let m = /^#([0-9a-f]{6})$/i.exec(hex || '');
    if (!m) return hex;
    let num = parseInt(m[1], 16);
    let r = Math.max(0, Math.floor(((num >> 16) & 0xff) * (1 - amt)));
    let g = Math.max(0, Math.floor(((num >> 8) & 0xff) * (1 - amt)));
    let b = Math.max(0, Math.floor((num & 0xff) * (1 - amt)));
    return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}

// Identity comes from (in order): an explicit config object passed to
// GameInstance.init(), then URL query params (?name=&color=&room=), then a
// standalone-testing default. Color prefers whatever the hub hands us — that's
// the hub's own name-hash, computed once and shared consistently across every
// game and screen — and only falls back to a local hash if we're opened directly.
function resolveIdentity(config) {
    const params = new URLSearchParams(window.location.search);
    const name = (config && config.name) || params.get('name') || 'YOU';
    let color = (config && config.color) || params.get('color');
    if (!color) {
        const hue = nameHash(name) % 360;
        color = `hsl(${hue}, 65%, 55%)`;
    }
    const room = (config && config.room) || params.get('room') || 'public';
    return { name, color, room };
}

// Entities Lists
let blocks = [];
let bullets = [];
let particles = [];
let players = [];
let orbs = [];
let fields = [];
let ripples = [];
let player;

// -----------------------------------------------------------
// CLASSES
// -----------------------------------------------------------

class Block {
    constructor(x, y, w, h, type = 'perm', shape = 'rect') {
        this.x = x; this.y = y; this.w = w; this.h = h;
        this.type = type; // 'perm' or 'temp'
        this.shape = shape; // 'rect' or 'circle' — visual only, collision is always the x/y/w/h box
        this.hp = (type === 'temp') ? 3 : (hasCard('fragility') ? 5 : Infinity);
        this.target = {x, y, w, h};
    }
    hit() {
        if (this.hp === Infinity) return;
        this.hp--;
        if (this.hp <= 0) this.destroy();
    }
    destroy() {
        for(let i=0; i<10; i++) particles.push(new Particle(this.x + Math.random()*this.w, this.y + Math.random()*this.h, 'debris'));
        blocks = blocks.filter(b => b !== this);
    }
    update(dt) {
        this.x = lerp(this.x, this.target.x, 3*dt);
        this.y = lerp(this.y, this.target.y, 3*dt);
        this.w = lerp(this.w, this.target.w, 3*dt);
        this.h = lerp(this.h, this.target.h, 3*dt);
    }
    draw(ctx) {
        ctx.save();
        ctx.shadowColor = 'rgba(0, 0, 0, 0.2)';
        ctx.shadowBlur = 10; ctx.shadowOffsetX = 5; ctx.shadowOffsetY = 10;
        ctx.fillStyle = this.type === 'temp' ? '#e2e8f0' : '#ffffff';

        if (this.shape === 'circle') {
            ctx.beginPath();
            ctx.arc(this.x + this.w/2, this.y + this.h/2, this.w/2, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowColor = 'transparent';
            ctx.strokeStyle = this.type === 'temp' ? 'rgba(0,0,0,0.1)' : 'rgba(0,0,0,0.05)';
            ctx.lineWidth = 1; ctx.stroke();
        } else {
            ctx.fillRect(this.x, this.y, this.w, this.h);
            ctx.shadowColor = 'transparent';
            ctx.strokeStyle = this.type === 'temp' ? 'rgba(0,0,0,0.1)' : 'rgba(0,0,0,0.05)';
            ctx.lineWidth = 1; ctx.strokeRect(this.x, this.y, this.w, this.h);
            if (this.hp < (this.type==='temp'?3:5) && this.hp > 0) {
                ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.lineTo(this.x + this.w, this.y + this.h);
                ctx.strokeStyle = 'rgba(0,0,0,0.1)'; ctx.stroke();
            }
        }
        ctx.restore();
    }
}

class Bullet {
    constructor(x, y, angle, owner, type = 'bullet') {
        this.x = x; this.y = y; this.lastX = x; this.lastY = y;
        this.owner = owner;
        this.type = type; // 'bullet', 'barrier', 'void'
        
        let speed = (type === 'barrier') ? 1400 : 2000;
        
        // Stasis Logic: Enemy bullets are extremely slow
        if (type === 'bullet' && owner.isBot && hasCard('stasis')) speed *= 0.1;

        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        
        this.life = 2.0;
        this.bounces = (!owner.isBot && hasCard('ricochet', owner)) ? 1 : 0;
        this.dead = false;
    }
    update(dt) {
        this.lastX = this.x; this.lastY = this.y;
        
        // Slow field effect
        let inField = fields.some(f => dist(this, f) < f.radius);
        let speedMult = inField ? 0.2 : 1.0;

        this.x += this.vx * dt * speedMult;
        this.y += this.vy * dt * speedMult;
        this.life -= dt;
        
        this.checkCollisions();
    }
    checkCollisions() {
        if(this.dead) return;
        
        if(this.x < mapBounds.x || this.x > mapBounds.x + mapBounds.w || 
           this.y < mapBounds.y || this.y > mapBounds.y + mapBounds.h) {
            this.die(); return;
        }

        for (let b of blocks) {
            if (this.x > b.x && this.x < b.x + b.w && this.y > b.y && this.y < b.y + b.h) {
                if (this.type === 'barrier') {
                    this.die(); return;
                } else if (this.type === 'void') {
                    b.hit(); b.hit(); b.hit(); // heavy damage to blocks
                    this.die(); return;
                } else {
                    if (this.bounces > 0) {
                        this.bounces--;
                        let dx1 = Math.abs(this.x - b.x), dx2 = Math.abs(this.x - (b.x + b.w));
                        let dy1 = Math.abs(this.y - b.y), dy2 = Math.abs(this.y - (b.y + b.h));
                        let min = Math.min(dx1, dx2, dy1, dy2);
                        if (min === dx1 || min === dx2) this.vx *= -1; else this.vy *= -1;
                        this.x += this.vx * 0.02; this.y += this.vy * 0.02;
                    } else {
                        b.hit(); this.die(); return;
                    }
                }
            }
        }

        if (this.type === 'bullet') {
            for (let p of players) {
                if (p === this.owner || p.hp <= 0) continue;
                if (dist(this, p) < p.radius) {
                    p.takeDamage(this.owner);
                    this.die(); return;
                }
            }
        }
    }
    die() {
        this.dead = true; this.life = 0;
        if (this.type === 'barrier') {
            let w = 80, h = 80;
            blocks.push(new Block(this.x - w/2, this.y - h/2, w, h, 'temp'));
        } else {
            let a = Math.atan2(-this.vy, -this.vx);
            for(let i=0; i<5; i++) particles.push(new Particle(this.x, this.y, this.type==='void'?'voidspark':'spark', a));
        }
    }
    draw(ctx) {
        ctx.beginPath(); ctx.moveTo(this.lastX, this.lastY); ctx.lineTo(this.x, this.y);
        ctx.strokeStyle = this.type === 'barrier' ? 'rgba(162, 185, 188, 0.8)' : (this.type === 'void' ? '#9b59b6' : 'rgba(0,0,0,0.6)');
        ctx.lineWidth = this.type === 'barrier' ? 4 : (this.type === 'void' ? 3 : 2);
        ctx.stroke();
    }
}

// Slow Orb Projectile
class SlowOrb {
    constructor(x, y, angle) {
        this.x = x; this.y = y;
        this.vx = Math.cos(angle) * 600;
        this.vy = Math.sin(angle) * 600;
        this.life = 0.5; // flight time
    }
    update(dt) {
        this.x += this.vx * dt; this.y += this.vy * dt;
        this.life -= dt;
        if(this.life <= 0) {
            fields.push(new SlowField(this.x, this.y));
            for(let i=0; i<10; i++) particles.push(new Particle(this.x, this.y, 'voidspark', Math.random()*Math.PI*2));
        }
    }
    draw(ctx) {
        ctx.fillStyle = '#3498db';
        ctx.beginPath(); ctx.arc(this.x, this.y, 4, 0, Math.PI*2); ctx.fill();
    }
}

// Active Slow Field
class SlowField {
    constructor(x, y) {
        this.x = x; this.y = y;
        this.radius = 150;
        this.life = 4.0;
        camera.shake += 10;
    }
    update(dt) { this.life -= dt; }
    draw(ctx) {
        ctx.fillStyle = `rgba(52, 152, 219, ${this.life * 0.05})`;
        ctx.strokeStyle = `rgba(52, 152, 219, ${this.life * 0.2})`;
        ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
        ctx.fill(); ctx.stroke();
    }
}

// Expanding ripple ring left behind when a player walks through the water feature
class Ripple {
    constructor(x, y) {
        this.x = x; this.y = y;
        this.maxLife = 0.8; this.life = this.maxLife;
    }
    update(dt) { this.life -= dt; }
    draw(ctx) {
        let t = 1 - (this.life / this.maxLife);
        let r = 8 + t * 45;
        ctx.save();
        ctx.globalAlpha = (1 - t) * 0.5;
        ctx.strokeStyle = '#5dade2';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(this.x, this.y, r, 0, Math.PI*2); ctx.stroke();
        ctx.restore();
    }
}

class Particle {
    constructor(x, y, type, angle = 0) {
        this.x = x; this.y = y; this.type = type;
        this.life = 1.0;
        if (type === 'casing') {
            this.vx = Math.cos(angle) * (150 + Math.random()*50);
            this.vy = Math.sin(angle) * (150 + Math.random()*50);
            this.rot = Math.random() * Math.PI;
            this.rotSpeed = (Math.random() - 0.5) * 15;
            this.life = 0.6;
        } else if (type === 'flash') {
            this.life = 0.05;
        } else if (type === 'debris') {
            let a = Math.random() * Math.PI * 2; let s = 100 + Math.random() * 200;
            this.vx = Math.cos(a) * s; this.vy = Math.sin(a) * s;
            this.life = 0.5 + Math.random()*0.5; this.size = 3 + Math.random()*5;
        } else if (type === 'spark' || type === 'voidspark') {
            let a = angle + (Math.random()-0.5)*1.0; let s = 200 + Math.random() * 300;
            this.vx = Math.cos(a) * s; this.vy = Math.sin(a) * s;
            this.life = 0.2;
        }
    }
    update(dt) {
        if(this.type !== 'flash') {
            this.x += this.vx * dt; this.y += this.vy * dt;
            this.vx *= 0.85; this.vy *= 0.85;
            if(this.rotSpeed) this.rot += this.rotSpeed * dt;
        }
        this.life -= dt;
    }
    draw(ctx) {
        ctx.save();
        if (this.type === 'casing') {
            ctx.translate(this.x, this.y); ctx.rotate(this.rot);
            ctx.fillStyle = '#d4af37'; ctx.fillRect(-2, -1, 5, 2);
        } else if (this.type === 'flash') {
            ctx.beginPath(); ctx.arc(this.x, this.y, 14, 0, Math.PI*2);
            ctx.fillStyle = 'rgba(255, 200, 100, 0.9)'; ctx.fill();
            ctx.beginPath(); ctx.arc(this.x, this.y, 6, 0, Math.PI*2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.95)'; ctx.fill();
        } else if (this.type === 'debris') {
            ctx.globalAlpha = this.life; ctx.fillStyle = '#999';
            ctx.fillRect(this.x, this.y, this.size, this.size);
        } else if (this.type === 'spark' || this.type === 'voidspark') {
            ctx.globalAlpha = this.life * 5; ctx.fillStyle = this.type === 'voidspark' ? '#9b59b6' : '#ffaa00';
            ctx.fillRect(this.x, this.y, 2, 2);
        }
        ctx.restore();
    }
}

class Fighter {
    constructor(x, y, isBot = true, name = "BOT", color = '#3498db') {
        this.x = x; this.y = y; this.isBot = isBot; this.name = name; this.color = color;
        this.radius = 12; this.baseSpeed = 220;
        this.hp = 100; this.maxAmmo = 3; this.ammo = this.maxAmmo;
        this.score = 0; this.kills = 0; this.deaths = 0;
        
        this.angle = 0; this.recoil = 0; this.walkCycle = 0;
        this.reloadTimer = 0; this.fireCooldown = 0; this.orbCooldown = 0;
        this.hitFlash = 0; this.rippleTimer = 0;
        
        // AI State
        this.state = 'WANDER'; this.stateTimer = 0; this.avoidVec = {x:0, y:0};
    }

    takeDamage(attacker) {
        if(this.hp <= 0) return;
        this.hp = 0; // one-shot kill
        this.hitFlash = 0.1;
        this.die(attacker);
    }

    die(attacker) {
        this.deaths++;
        if (attacker) {
            attacker.kills++; attacker.score += 150;
            attacker.ammo = attacker.maxAmmo; attacker.reloadTimer = 0; // kill = instant full reload
            if(!attacker.isBot) { camera.shake += 16; modifyStability(COSTS.kill); }
        }
        if (attacker === player || this === player) hitStop = 0.06;
        for(let i=0; i<20; i++) particles.push(new Particle(this.x, this.y, 'debris'));
        
        trackTimeout(() => {
            if(gameState >= STATE.ENDING) return;
            let s = findSafeSpawn();
            this.x = s.x; this.y = s.y;
            this.hp = 100; this.ammo = this.maxAmmo; this.state = 'WANDER';
        }, 2000);
    }

    forceReload() { if (this.ammo < this.maxAmmo && this.reloadTimer <= 0) this.reloadTimer = RELOAD_TIME; }

    fireOrb() {
        if(this.orbCooldown <= 0) {
            this.orbCooldown = 10.0;
            orbs.push(new SlowOrb(this.x, this.y, this.angle));
            if(!this.isBot) modifyStability(COSTS.orb);
        }
    }

    fire(isAlt = false) {
        if (this.reloadTimer > 0) return;
        
        if (!isAlt) {
            if (this.fireCooldown > 0) return;
            if (this.ammo <= 0) { this.forceReload(); return; }
            
            this.ammo--; this.fireCooldown = 0.12; this.recoil = 11;
            let bx = this.x + Math.cos(this.angle)*15, by = this.y + Math.sin(this.angle)*15;
            
            bullets.push(new Bullet(bx, by, this.angle + (Math.random()-0.5)*0.03, this, 'bullet'));
            particles.push(new Particle(bx, by, 'flash'));
            particles.push(new Particle(this.x, this.y, 'casing', this.angle + Math.PI/2));
            
            this.x -= Math.cos(this.angle) * 6; this.y -= Math.sin(this.angle) * 6;
            
            if(!this.isBot) { camera.shake += 6; modifyStability(COSTS.shoot); }
            if (this.ammo === 0) this.forceReload();
            
        } else {
            // Alt Fire (Barrier or VoidGun)
            if (this.fireCooldown > 0) return;
            this.fireCooldown = 0.2; // faster barrier placement
            this.recoil = 8;
            
            let type = (!this.isBot && hasCard('voidgun', this)) ? 'void' : 'barrier';
            let bx = this.x + Math.cos(this.angle)*15, by = this.y + Math.sin(this.angle)*15;
            bullets.push(new Bullet(bx, by, this.angle, this, type));
            
            this.x -= Math.cos(this.angle) * 5; this.y -= Math.sin(this.angle) * 5;
            if(!this.isBot) modifyStability(COSTS.barrier);
        }
    }

    update(dt) {
        if (this.hp <= 0) return;

        if (this.fireCooldown > 0) this.fireCooldown -= dt;
        if (this.orbCooldown > 0) this.orbCooldown -= dt;
        if (this.hitFlash > 0) this.hitFlash -= dt;
        if (this.recoil > 0) this.recoil = lerp(this.recoil, 0, 15*dt);
        
        if (this.reloadTimer > 0) {
            this.reloadTimer -= dt;
            if (this.reloadTimer <= 0) this.ammo = this.maxAmmo;
        }

        let dx = 0, dy = 0;
        let inField = fields.some(f => dist(this, f) < f.radius);
        let speedMult = inField ? 0.3 : 1.0;
        let speed = this.baseSpeed * speedMult;

        // AI Logic
        if (this.isBot) {
            this.stateTimer -= dt;

            // Target the nearest living player, bot or human, so bots fight
            // each other instead of every bot dogpiling the human every time.
            let target = null, bestDist = Infinity;
            for (let p of players) {
                if (p === this || p.hp <= 0) continue;
                let d = dist(this, p);
                if (d < bestDist) { bestDist = d; target = p; }
            }

            if (target && bestDist < 600) {
                this.angle = Math.atan2(target.y - this.y, target.x - this.x);
                if (this.ammo > 0 && this.state !== 'RETREAT') {
                    if (Math.random() < 0.10) this.fire();
                }
            } else {
                this.angle += (Math.random()-0.5)*0.1;
            }

            if (this.stateTimer <= 0) {
                let states = this.hp < 50 ? ['RETREAT', 'WANDER'] : ['CHASE', 'FLANK', 'WANDER'];
                this.state = states[Math.floor(Math.random()*states.length)];
                this.stateTimer = 1 + Math.random()*2;
            }

            let idealAngle = this.angle;
            if (this.state === 'WANDER') idealAngle += (Math.random()-0.5);
            else if (this.state === 'RETREAT') idealAngle += Math.PI;
            else if (this.state === 'FLANK') idealAngle += Math.PI/4;

            dx = Math.cos(idealAngle); dy = Math.sin(idealAngle);
            
            // Wall avoidance steering
            dx += this.avoidVec.x; dy += this.avoidVec.y;
            this.avoidVec.x = lerp(this.avoidVec.x, 0, 5*dt);
            this.avoidVec.y = lerp(this.avoidVec.y, 0, 5*dt);
            
            if (this.state === 'RETREAT' && Math.random() < 0.05) this.fire(true); // drop barrier
        }

        // Player Logic
        if (!this.isBot) {
            if (keys.w) dy -= 1; if (keys.s) dy += 1;
            if (keys.a) dx -= 1; if (keys.d) dx += 1;
            
            this.angle = Math.atan2(mouse.wy - this.y, mouse.wx - this.x);
            
            if(mouse.left) { if(this.ammo > 0) this.fire(false); else if(keys.left) mouse.left = false; }
            if(mouse.right) this.fire(true);
        }

        let isMoving = (dx !== 0 || dy !== 0);
        if (isMoving) {
            let len = Math.hypot(dx, dy);
            dx = (dx / len) * speed * dt; dy = (dy / len) * speed * dt;
            this.walkCycle += 18 * dt * speedMult;
        } else this.walkCycle = 0;

        // Collision & Movement
        let nextX = this.x + dx, nextY = this.y + dy;
        
        // Bounds checking
        if (nextX < mapBounds.x + 15) { nextX = mapBounds.x + 15; if(this.isBot) this.avoidVec.x = 2; }
        if (nextX > mapBounds.x + mapBounds.w - 15) { nextX = mapBounds.x + mapBounds.w - 15; if(this.isBot) this.avoidVec.x = -2; }
        if (nextY < mapBounds.y + 15) { nextY = mapBounds.y + 15; if(this.isBot) this.avoidVec.y = 2; }
        if (nextY > mapBounds.y + mapBounds.h - 15) { nextY = mapBounds.y + mapBounds.h - 15; if(this.isBot) this.avoidVec.y = -2; }

        let hitX = false, hitY = false;
        let canPhase = (!this.isBot && hasCard('phase', this));

        if (!canPhase) {
            for(let b of blocks) {
                if (nextX + this.radius > b.x && nextX - this.radius < b.x + b.w &&
                    this.y + this.radius > b.y && this.y - this.radius < b.y + b.h) {
                    hitX = true; if(this.isBot) this.avoidVec.x = (this.x < b.x) ? -2 : 2;
                }
                if (this.x + this.radius > b.x && this.x - this.radius < b.x + b.w &&
                    nextY + this.radius > b.y && nextY - this.radius < b.y + b.h) {
                    hitY = true; if(this.isBot) this.avoidVec.y = (this.y < b.y) ? -2 : 2;
                }
            }
        }

        if (!hitX) this.x = nextX;
        if (!hitY) this.y = nextY;

        // Water feature ripples
        if (this.rippleTimer > 0) this.rippleTimer -= dt;
        if (isMoving && this.rippleTimer <= 0 && dist(this, waterFeature) < waterFeature.radius) {
            ripples.push(new Ripple(this.x, this.y));
            this.rippleTimer = 0.18;
        }
    }

    draw(ctx) {
        if(this.hp <= 0) return;
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        
        if(this.hitFlash > 0) ctx.filter = 'brightness(200%)';

        let bodyColor = this.isBot ? '#e74c3c' : this.color;
        let armColor = this.isBot ? '#c0392b' : darken(this.color, 0.25);
        
        // Gun
        ctx.fillStyle = '#333';
        let gunX = 14 - this.recoil; 
        ctx.fillRect(gunX, -3, 16, 6);

        // Arms & Reload Animation
        let lArmX = 0, lArmY = -12, rArmX = 0, rArmY = 12;
        
        if (this.reloadTimer > 0) {
            // Highly pronounced reload
            let rNorm = 1 - (this.reloadTimer / RELOAD_TIME);
            lArmX = 8 + Math.sin(rNorm * Math.PI) * 10;
            lArmY = -2 + Math.cos(rNorm * Math.PI*2) * 5;
            rArmX = gunX - 2; rArmY = 5;
            
            // Draw Magazine being inserted
            if(rNorm > 0.3 && rNorm < 0.7) {
                ctx.fillStyle = '#111';
                ctx.fillRect(lArmX+2, lArmY, 6, 8);
            }
        } else {
            rArmX = gunX - 2; rArmY = 5;
            lArmX = gunX + 6; lArmY = -4; // Hand on barrel
        }

        // Feet
        ctx.fillStyle = '#222';
        let footSway = Math.sin(this.walkCycle) * 5;
        ctx.beginPath(); ctx.arc(-3 + footSway, -7, 4, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(-3 - footSway, 7, 4, 0, Math.PI*2); ctx.fill();

        // Shoulders / Arms
        ctx.fillStyle = armColor;
        ctx.beginPath(); ctx.arc(lArmX, lArmY, 4, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(rArmX, rArmY, 4, 0, Math.PI*2); ctx.fill();

        // Head
        ctx.fillStyle = bodyColor;
        ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI*2); ctx.fill();
        
        // Eye (Visor)
        ctx.fillStyle = '#fff';
        ctx.fillRect(4, -5, 4, 10);

        ctx.restore();

        // Reload ring: bold spinning pie-wipe, drawn in world space so it doesn't rotate with aim
        if (this.reloadTimer > 0) {
            let prog = 1 - (this.reloadTimer / RELOAD_TIME);
            let spin = (RELOAD_TIME - this.reloadTimer) * 4;
            let ringR = 22;
            ctx.save();
            ctx.lineWidth = 5;
            ctx.strokeStyle = 'rgba(0,0,0,0.15)';
            ctx.beginPath(); ctx.arc(this.x, this.y, ringR, 0, Math.PI*2); ctx.stroke();
            ctx.strokeStyle = '#ff3b1f';
            ctx.beginPath(); ctx.arc(this.x, this.y, ringR, spin, spin + prog*Math.PI*2);
            ctx.stroke();
            ctx.restore();
        }
        
        if (this.isBot) {
            ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(this.x - 12, this.y - 20, 24, 4);
            ctx.fillStyle = '#e74c3c'; ctx.fillRect(this.x - 12, this.y - 20, 24 * (this.hp/100), 4);
        }
    }
}

// -----------------------------------------------------------
// SETUP & LOGIC
// -----------------------------------------------------------

// Rotates a centered rect offset (dx,dy,w,h) by 90-degree increments.
function rotateOffset(dx, dy, w, h, rot) {
    rot = ((rot % 4) + 4) % 4;
    for (let i = 0; i < rot; i++) {
        [dx, dy, w, h] = [-dy, dx, h, w];
    }
    return [dx, dy, w, h];
}

// Builds one piece (1-2 rects) centered at (mx,my), scaled to unit size u:
// a pillar, a round pillar, a straight bar, an L-corner, or a T-junction.
function makePieceRects(mx, my, u) {
    const kinds = ['pillar','pillar','pillar','round','round','bar','bar','L','L','T','T'];
    let kind = kinds[Math.floor(Math.random()*kinds.length)];
    let rot = Math.floor(Math.random()*4);
    let shape = 'rect';
    let rects;
    if (kind === 'pillar') rects = [[0,0,u,u]];
    else if (kind === 'round') { rects = [[0,0,u,u]]; shape = 'circle'; }
    else if (kind === 'bar') { rects = [[0,0,u*2.6,u*0.7]]; rot = rot % 2; }
    else if (kind === 'L') rects = [[u*0.75,u*0.2,u*1.5,u*0.55], [u*0.2,u*0.75,u*0.55,u*1.5]];
    else rects = [[0,0,u*2.3,u*0.55], [0,-u*0.85,u*0.55,u*1.5]];

    return rects.map(([dx,dy,w,h]) => {
        let [rdx,rdy,rw,rh] = rotateOffset(dx,dy,w,h,rot);
        return { x: mx+rdx-rw/2, y: my+rdy-rh/2, w: rw, h: rh, shape };
    });
}

// Recursively quarters the region down to `depth`, placing one piece at each
// leaf cell's midpoint (skipping the pool and a random 12% for breathing room).
function subdivideForPieces(x0, y0, x1, y1, depth, u, out) {
    let mx = (x0+x1)/2, my = (y0+y1)/2;
    if (depth === 0) {
        if (dist({x:mx,y:my}, waterFeature) > POOL_EXCLUSION_RADIUS && Math.random() > 0.12) {
            out.push(...makePieceRects(mx, my, u));
        }
        return;
    }
    subdivideForPieces(x0, y0, mx, my, depth-1, u, out);
    subdivideForPieces(mx, y0, x1, my, depth-1, u, out);
    subdivideForPieces(x0, my, mx, y1, depth-1, u, out);
    subdivideForPieces(mx, my, x1, y1, depth-1, u, out);
}

// Castellated border ring: one edge's alternating rhythm, rotated/mirrored onto all 4 sides.
function buildBorder() {
    let edge = [];
    const unit = 150;
    let x = 60, toggle = 0;
    while (x < mapBounds.w - 60 - 95) {
        if (toggle % 2 === 0) edge.push([x, 16, 95, 40]);
        else edge.push([x, 72, 60, 36]);
        x += unit; toggle++;
    }
    edge.forEach(([ex,ey,ew,eh]) => {
        blocks.push(new Block(ex, ey, ew, eh, 'perm'));                                  // top
        blocks.push(new Block(ex, mapBounds.h - ey - eh, ew, eh, 'perm'));               // bottom
        blocks.push(new Block(ey, ex, eh, ew, 'perm'));                                  // left
        blocks.push(new Block(mapBounds.w - ey - eh, ex, eh, ew, 'perm'));               // right
    });

    // Stepped corner clusters
    const cSizes = [95, 65, 40];
    cSizes.forEach((s, i) => {
        const off = 20 + i*45;
        [[off,off],[mapBounds.w-off-s,off],[off,mapBounds.h-off-s],[mapBounds.w-off-s,mapBounds.h-off-s]].forEach(([bx,by]) => {
            blocks.push(new Block(bx, by, s, s, 'perm'));
        });
    });
}

function buildMap() {
    blocks = [];
    const cx = mapBounds.w/2, cy = mapBounds.h/2;

    // Pool geometry set first so the recursive scatter can carve around it.
    waterFeature = { x: cx, y: cy, radius: 150 };
    poolLobes = [
        { x: cx, y: cy, rx: 85, ry: 160 },   // main elongated body
        { x: cx - 95, y: cy, rx: 60, ry: 60 }, // left lobe
        { x: cx + 95, y: cy, rx: 60, ry: 60 }  // right lobe
    ];

    buildBorder();

    // Recursive interior scatter: generate one quadrant, mirror into all 4.
    const interiorMargin = 230;
    const depth = 3;
    const cell = (cx - interiorMargin) / Math.pow(2, depth);
    const u = cell * 0.24;

    let quadrantPieces = [];
    subdivideForPieces(interiorMargin, interiorMargin, cx, cy, depth, u, quadrantPieces);
    quadrantPieces.forEach(p => {
        blocks.push(new Block(p.x, p.y, p.w, p.h, 'perm', p.shape));
        blocks.push(new Block(mapBounds.w - p.x - p.w, p.y, p.w, p.h, 'perm', p.shape));
        blocks.push(new Block(p.x, mapBounds.h - p.y - p.h, p.w, p.h, 'perm', p.shape));
        blocks.push(new Block(mapBounds.w - p.x - p.w, mapBounds.h - p.y - p.h, p.w, p.h, 'perm', p.shape));
    });

    // Small solid plinth in the center of the pool
    blocks.push(new Block(cx - 25, cy - 25, 50, 50, 'perm'));
}

// Finds a spawn point at least SPAWN_SAFE_DIST from every living player and clear of blocks.
function findSafeSpawn() {
    const pad = 60;
    for (let attempt = 0; attempt < 60; attempt++) {
        let x = mapBounds.x + pad + Math.random() * (mapBounds.w - pad*2);
        let y = mapBounds.y + pad + Math.random() * (mapBounds.h - pad*2);

        if (players.some(p => p.hp > 0 && dist({x,y}, p) < SPAWN_SAFE_DIST)) continue;
        if (blocks.some(b => x > b.x - pad && x < b.x + b.w + pad && y > b.y - pad && y < b.y + b.h + pad)) continue;

        return { x, y };
    }
    // Fallback if the map is too crowded to satisfy the full constraint: best of a few tries.
    let best = null, bestScore = -Infinity;
    for (let i = 0; i < 20; i++) {
        let x = mapBounds.x + pad + Math.random() * (mapBounds.w - pad*2);
        let y = mapBounds.y + pad + Math.random() * (mapBounds.h - pad*2);
        let living = players.filter(p => p.hp > 0);
        let minToAny = living.length ? Math.min(...living.map(p => dist({x,y}, p))) : Infinity;
        if (minToAny > bestScore) { bestScore = minToAny; best = {x, y}; }
    }
    return best || { x: mapBounds.x + mapBounds.w/2, y: mapBounds.y + mapBounds.h/2 };
}

function initGame() {
    // Full reset so this is safe to call again for a rematch, not just on first load —
    // otherwise a second start() would inherit the previous match's stability, mapBounds
    // (shrink/duplicate shifts mutate it), active cards, and leftover entities/UI state.
    gameState = STATE.PLAYING;
    gameTimer = 180.0;
    stability = 100.0;
    camera = { x: 0, y: 0, shake: 0 };
    authorTimer = 0;
    activeCards = [];
    hasDuplicated = false;
    hitStop = 0;
    mapBounds = { x: 0, y: 0, w: 3000, h: 3000 };
    bullets = []; particles = []; orbs = []; fields = []; ripples = [];

    ui.cardsContainer.innerHTML = '';
    ui.vignette.style.background = 'radial-gradient(circle at center, transparent 22%, rgba(0,0,0,0.3) 45%, rgba(0,0,0,0.9) 100%)';
    ui.modal.style.display = 'none';
    ui.overlay.style.display = 'none';
    ui.giantCount.style.display = 'none';
    ui.endRankings.style.display = 'none';

    buildMap();
    players = [];
    let spawn = findSafeSpawn();
    player = new Fighter(spawn.x, spawn.y, false, identity.name, identity.color);
    players.push(player);
    
    for(let i=1; i<=5; i++) {
        let s = findSafeSpawn();
        players.push(new Fighter(s.x, s.y, true, `BOT ${i}`));
    }
}

function hasCard(id, p = null) {
    return activeCards.some(c => c.id === id && (c.owner === p || c.type === 'global' || c.type === 'debuff'));
}

function modifyStability(amount) {
    if(gameState !== STATE.PLAYING) return;
    stability += amount;
    if(stability > 100) stability = 100;
    if(stability <= 0) { stability = 0; startAuthorPhase(); }
}

function startAuthorPhase() {
    gameState = STATE.AUTHOR_PHASE; authorTimer = 5.0;
    
    let author = players.reduce((prev, curr) => (prev.score > curr.score) ? prev : curr);
    
    // Choose 3 random shifts
    let options = [...SHIFTS].filter(s => !(s.unique && hasDuplicated && s.id === 'duplicate')).sort(() => 0.5 - Math.random()).slice(0, 3);
    
    if (author === player) {
        ui.options.innerHTML = '';
        options.forEach(shift => {
            let btn = document.createElement('div'); btn.className = 'author-option';
            btn.innerHTML = `<h3 style="color:${shift.color}">${shift.name}</h3><span>${shift.desc}</span>`;
            btn.onclick = () => executeShift(shift, player);
            ui.options.appendChild(btn);
        });
        ui.modal.style.display = 'block';
    } else {
        // AI chooses randomly
        executeShift(options[0], author);
    }
}

function executeShift(shift, author) {
    ui.modal.style.display = 'none';
    
    let card = { ...shift, owner: author };
    activeCards.push(card);
    renderCards();
    
    // Instant Global Effects
    if (shift.id === 'growth') {
        blocks.forEach(b => { if(b.type === 'perm') { b.target.w *= 2; b.target.h *= 2; } });
    } else if (shift.id === 'shrink') {
        let shrinkW = mapBounds.w * 0.25; let shrinkH = mapBounds.h * 0.25;
        mapBounds.x += shrinkW/2; mapBounds.y += shrinkH/2;
        mapBounds.w -= shrinkW; mapBounds.h -= shrinkH;
    } else if (shift.id === 'duplicate') {
        hasDuplicated = true;
        let oldW = mapBounds.w, oldH = mapBounds.h;
        mapBounds.w *= 2; mapBounds.h *= 2;
        
        let oldBlocks = [...blocks];
        oldBlocks.forEach(b => {
            blocks.push(new Block(b.x + oldW, b.y, b.w, b.h, b.type));
            blocks.push(new Block(b.x, b.y + oldH, b.w, b.h, b.type));
            blocks.push(new Block(b.x + oldW, b.y + oldH, b.w, b.h, b.type));
        });
    }

    if(author === player) player.score += 200;
    
    camera.shake = 25;
    stability = 100.0;
    gameState = STATE.PLAYING;
}

function renderCards() {
    ui.cardsContainer.innerHTML = '';
    activeCards.forEach(c => {
        let el = document.createElement('div'); el.className = 'card';
        el.style.borderLeftColor = c.color;
        el.innerText = `${c.name} ${c.owner === player ? '(YOU)' : '(ENEMY)'}`;
        ui.cardsContainer.appendChild(el);
    });
    
    // Update Vignette specifically
    if(hasCard('blind')) ui.vignette.style.background = 'radial-gradient(circle at center, transparent 10%, rgba(0,0,0,0.95) 80%)';
    else ui.vignette.style.background = 'radial-gradient(circle at center, transparent 22%, rgba(0,0,0,0.3) 45%, rgba(0,0,0,0.9) 100%)';
}

function triggerEnding() {
    gameState = STATE.ENDING;
    ui.overlay.style.display = 'flex';
    ui.giantCount.style.display = 'block';
    ui.endRankings.style.display = 'none';
    
    let cnt = 3; ui.giantCount.innerText = cnt;
    let intv = trackInterval(() => {
        cnt--;
        if(cnt > 0) ui.giantCount.innerText = cnt;
        else {
            clearInterval(intv);
            showRankings();
        }
    }, 1000);
}

function showRankings() {
    gameState = STATE.GAME_OVER;
    ui.giantCount.style.display = 'none';
    ui.endRankings.style.display = 'block';
    
    let sorted = [...players].sort((a,b) => b.score - a.score);
    let html = `<h1>FINAL STANDINGS</h1>`;
    sorted.forEach((p, i) => {
        html += `<div class="rank-row" style="color: ${p===player?'#3498db':'#333'}">
            #${i+1} ${p.name} - ${p.score} PTS (${p.kills} K / ${p.deaths} D)
        </div>`;
    });
    ui.endRankings.innerHTML = html;
}

// -----------------------------------------------------------
// UPDATE & DRAW
// -----------------------------------------------------------

function update(dt) {
    if (gameState === STATE.AUTHOR_PHASE) {
        authorTimer -= dt; ui.countdown.innerText = authorTimer.toFixed(1);
        return;
    }
    if (gameState === STATE.ENDING || gameState === STATE.GAME_OVER) return;

    // Timer
    gameTimer -= dt;
    let m = Math.floor(gameTimer / 60);
    let s = Math.floor(gameTimer % 60).toString().padStart(2, '0');
    ui.timer.innerText = `${m}:${s}`;
    
    if (gameTimer <= 3.0 && gameState === STATE.PLAYING) triggerEnding();

    let targetCX = player.x - width/2; let targetCY = player.y - height/2;
    camera.x = lerp(camera.x, targetCX, 10*dt);
    camera.y = lerp(camera.y, targetCY, 10*dt);
    if(camera.shake > 0) camera.shake = lerp(camera.shake, 0, 10*dt);
    
    mouse.wx = mouse.x + camera.x; mouse.wy = mouse.y + camera.y;

    players.forEach(p => p.update(dt));
    orbs.forEach(o => o.update(dt)); orbs = orbs.filter(o => o.life > 0);
    fields.forEach(f => f.update(dt)); fields = fields.filter(f => f.life > 0);
    ripples.forEach(r => r.update(dt)); ripples = ripples.filter(r => r.life > 0);
    bullets.forEach(b => b.update(dt)); bullets = bullets.filter(b => b.life > 0 && !b.dead);
    particles.forEach(p => p.update(dt)); particles = particles.filter(p => p.life > 0);
    blocks.forEach(b => b.update(dt));

    updateUI();
}

function updateUI() {
    ui.stabBar.style.width = `${Math.max(0, stability)}%`;
    ui.stabBar.style.backgroundColor = stability < 20 ? 'var(--critical-color)' : (stability < 50 ? 'var(--warn-color)' : 'var(--stable-color)');
    
    ui.hudHp.innerText = `HP: ${Math.max(0, player.hp)}`;
    ui.hudAmmo.innerText = player.reloadTimer > 0 ? 'RELOADING' : `AMMO: ${player.ammo}`;
    ui.hudOrb.innerText = player.orbCooldown > 0 ? `ORB: ${player.orbCooldown.toFixed(1)}s` : 'ORB [E]: RDY';
    ui.hudOrb.style.color = player.orbCooldown > 0 ? '#999' : '#3498db';
    
    ui.sbPlayer.querySelector('span.name').innerText = player.name;
    ui.sbPlayer.querySelector('span:nth-child(2)').innerText = player.score;
    ui.sbPlayer.querySelector('span:nth-child(3)').innerText = `K ${player.kills}`;
    ui.sbPlayer.querySelector('span:nth-child(4)').innerText = `D ${player.deaths}`;
    
    let botHTML = '';
    let sortedBots = [...players].filter(p => p.isBot).sort((a,b) => b.score - a.score);
    sortedBots.forEach(b => {
        botHTML += `<div class="score-row"><span class="name">${b.name}</span><span>${b.score}</span><span>K ${b.kills}</span><span>D ${b.deaths}</span></div>`;
    });
    ui.sbBots.innerHTML = botHTML;
}

function draw() {
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--bg-color');
    ctx.fillRect(0, 0, width, height);

    if (gameState === STATE.GAME_OVER) return; // Keep clear screen for ranking

    ctx.save();
    let sx = (Math.random()-0.5)*camera.shake, sy = (Math.random()-0.5)*camera.shake;
    ctx.translate(-camera.x + sx, -camera.y + sy);

    // Floor Grid
    ctx.strokeStyle = 'rgba(0,0,0,0.04)'; ctx.lineWidth = 1;
    let step = 100;
    let startX = Math.floor(camera.x / step) * step, startY = Math.floor(camera.y / step) * step;
    ctx.beginPath();
    for(let x = startX; x < camera.x + width + step; x += step) { ctx.moveTo(x, camera.y - step); ctx.lineTo(x, camera.y + height + step); }
    for(let y = startY; y < camera.y + height + step; y += step) { ctx.moveTo(camera.x - step, y); ctx.lineTo(camera.x + width + step, y); }
    ctx.stroke();

    // Map bounds
    ctx.strokeStyle = hasCard('shrink') ? 'rgba(231, 76, 60, 0.8)' : 'rgba(0,0,0,0.2)';
    ctx.lineWidth = hasCard('shrink') ? 8 : 4;
    ctx.strokeRect(mapBounds.x, mapBounds.y, mapBounds.w, mapBounds.h);

    // Courtyard: quatrefoil pool — white curb + water lobes fused by matching solid fills
    // (per-lobe strokes are skipped so the seams between lobes don't show)
    let shimmer = 0.5 + 0.5 * Math.sin(performance.now() / 600);
    const curbPad = 14;

    ctx.fillStyle = '#ffffff';
    poolLobes.forEach(l => {
        ctx.beginPath();
        ctx.ellipse(l.x, l.y, l.rx + curbPad, l.ry + curbPad, 0, 0, Math.PI*2);
        ctx.fill();
    });

    let wr = Math.round(93 + (126-93)*shimmer), wg = Math.round(173 + (200-173)*shimmer), wb = Math.round(226 + (227-226)*shimmer);
    ctx.fillStyle = `rgb(${wr},${wg},${wb})`;
    poolLobes.forEach(l => {
        ctx.beginPath();
        ctx.ellipse(l.x, l.y, l.rx, l.ry, 0, 0, Math.PI*2);
        ctx.fill();
    });

    // Baluster details flanking the pool
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    for (let side of [-1, 1]) {
        let bx = waterFeature.x + side * 175;
        for (let i = -1; i <= 1; i++) {
            ctx.beginPath();
            ctx.arc(bx, waterFeature.y + i*22, 4, 0, Math.PI*2);
            ctx.fill();
        }
    }

    fields.forEach(f => f.draw(ctx));
    ripples.forEach(r => r.draw(ctx));
    blocks.forEach(b => b.draw(ctx));
    particles.forEach(p => p.draw(ctx));
    
    let sortedPlayers = [...players].sort((a,b) => a.y - b.y);
    sortedPlayers.forEach(p => p.draw(ctx));
    
    bullets.forEach(b => b.draw(ctx));
    orbs.forEach(o => o.draw(ctx));

    // Custom crosshair
    ctx.strokeStyle = 'rgba(0,0,0,0.8)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(mouse.wx, mouse.wy, 8, 0, Math.PI*2);
    ctx.moveTo(mouse.wx - 12, mouse.wy); ctx.lineTo(mouse.wx + 12, mouse.wy);
    ctx.moveTo(mouse.wx, mouse.wy - 12); ctx.lineTo(mouse.wx, mouse.wy + 12);
    ctx.stroke();

    ctx.restore();

    if (gameState === STATE.AUTHOR_PHASE) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
        ctx.fillRect(0, 0, width, height);
    }
}

function loop(time) {
    let dt = (time - lastTime) / 1000;
    lastTime = time;
    if (dt > 0.1) dt = 0.1;

    if (hitStop > 0) {
        hitStop -= dt;
        dt *= 0.05;
    }

    update(dt); draw();
    animFrameId = requestAnimationFrame(loop);
}

// -----------------------------------------------------------
// HUB SHELL: window.GameInstance
// -----------------------------------------------------------
// Standard init/start/pause/resume/destroy/getState lifecycle per
// GAME_PROTOTYPE_INSTRUCTIONS.md. NOTE: the exact init()/getState() shapes here
// are inferred from that doc's description, not verified against the real file —
// worth truing up against it (or space-tracer.html's implementation) directly.
window.GameInstance = {
    init(config) {
        identity = resolveIdentity(config);
        if (listenerController) listenerController.abort(); // safe to call init() more than once
        listenerController = new AbortController();
        attachInputListeners(listenerController.signal);
        resize();
    },
    start() {
        if (animFrameId !== null) cancelAnimationFrame(animFrameId);
        isPaused = false;
        initGame();
        lastTime = performance.now();
        animFrameId = requestAnimationFrame(loop);
    },
    pause() {
        if (animFrameId !== null) { cancelAnimationFrame(animFrameId); animFrameId = null; }
        isPaused = true;
    },
    resume() {
        if (!isPaused) return;
        isPaused = false;
        lastTime = performance.now();
        animFrameId = requestAnimationFrame(loop);
    },
    destroy() {
        if (animFrameId !== null) { cancelAnimationFrame(animFrameId); animFrameId = null; }
        if (listenerController) { listenerController.abort(); listenerController = null; }
        pendingTimers.forEach(id => { clearTimeout(id); clearInterval(id); });
        pendingTimers = [];
        for (let k in keys) delete keys[k];
        mouse.left = false; mouse.right = false;
    },
    getState() {
        return {
            gameState: Object.keys(STATE).find(k => STATE[k] === gameState) || 'UNKNOWN',
            timeRemaining: Math.max(0, gameTimer),
            paused: isPaused,
            player: player ? {
                name: player.name, score: player.score,
                kills: player.kills, deaths: player.deaths,
                hp: Math.max(0, player.hp)
            } : null
        };
    }
};

// Opened directly rather than through the hub — boot immediately so it still
// works standalone (this is how it's been tested all along this conversation).
window.GameInstance.init();
window.GameInstance.start();

</script>
