<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">

<title>Gyro Space Trail</title>

<style>
html,body{
    margin:0;
    padding:0;
    overflow:hidden;
    background:#000;
    touch-action:none;
    font-family: Arial, sans-serif;
}

canvas{
    display:block;
    width:100vw;
    height:100vh;
}

#overlay{
    position:absolute;
    top:12px;
    left:12px;
    color:white;
    font-family:monospace;
    font-size:14px;
    line-height:1.4;
    background:rgba(0,0,0,.45);
    padding:10px;
    border-radius:8px;
    user-select:none;
    pointer-events:auto;
    display:none;
}

#overlay.hidden{
    display:none;
}

#guiToggle{
    position:absolute;
    top:12px;
    left:12px;
    width:24px;
    height:24px;
    border-radius:50%;
    background:rgba(100,200,255,0.7);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    font-weight:bold;
    color:white;
    z-index:999;
    border:2px solid rgba(100,200,255,1);
    transition:all 0.2s ease;
}

#guiToggle:hover{
    background:rgba(100,200,255,0.9);
    transform:scale(1.1);
}

#mobileDashButton{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    width:80px;
    height:80px;
    border-radius:50%;
    background:rgba(255,255,255,0.8);
    border:3px solid rgba(255,255,255,1);
    display:none;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:14px;
    color:#000;
    cursor:pointer;
    user-select:none;
    z-index:100;
    transition:all 0.1s ease;
    touch-action:none;
}

#mobileDashButton:active{
    background:rgba(100,200,255,0.9);
    border-color:rgba(100,200,255,1);
    transform:translateX(-50%) scale(0.9);
    box-shadow:0 0 20px rgba(100,200,255,0.6);
}

#menuOverlay{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.85);
    backdrop-filter:blur(4px);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:1000;
    flex-direction:column;
}

#menuOverlay.hidden{
    display:none;
}

.menu-container{
    text-align:center;
    color:white;
}

.menu-container h1{
    font-size:48px;
    margin:0 0 30px 0;
    text-shadow:0 0 20px rgba(255,100,150,0.8);
}

.menu-container p{
    font-size:18px;
    margin:0 0 40px 0;
    color:#aaa;
}

.button-group{
    display:flex;
    gap:20px;
    justify-content:center;
    flex-wrap:wrap;
}

.menu-btn{
    padding:15px 40px;
    font-size:18px;
    border:2px solid #fff;
    background:rgba(255,255,255,0.1);
    color:white;
    cursor:pointer;
    border-radius:8px;
    transition:all 0.3s ease;
    text-transform:uppercase;
    font-weight:bold;
    letter-spacing:2px;
}

.menu-btn:hover{
    background:rgba(255,100,150,0.3);
    border-color:#ff6496;
    box-shadow:0 0 15px rgba(255,100,150,0.5);
}

.menu-btn:active{
    transform:scale(0.98);
}

button{
    margin-top:8px;
    padding:8px 12px;
    font-size:14px;
}

/* ===== START SCREEN ===== */
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="guiToggle">⚙</div>

<div id="mobileDashButton">
    <span>DASH</span>
</div>

<!-- START SCREEN SYSTEM -->
<div id="startScreenContainer" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2000; background: #000;">
    
    <!-- Screen 1: Simple Click to Start -->
    <div id="screen1-title" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; cursor: pointer; background: #000;">
        <div style="text-align: center; user-select: none;">
            <h1 style="font-size: 64px; color: white; margin: 0; text-shadow: 0 0 20px rgba(100, 200, 255, 0.8); letter-spacing: 4px;">GYRO SPACE</h1>
            <div style="font-size: 32px; color: white; margin-top: 80px; animation: pulse 1s ease-in-out infinite;">CLICK TO START</div>
        </div>
    </div>
    
    <!-- Screen 2: Control Mode Selection -->
    <div id="screen2-mode" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px);">
        <div style="text-align: center; color: white; user-select: none;">
            <h2 style="font-size: 48px; margin-bottom: 40px;">SELECT CONTROL MODE</h2>
            <div style="display: flex; gap: 20px; justify-content: center;">
                <button id="screen2-mobile" style="padding: 15px 40px; font-size: 20px; border: 2px solid white; background: rgba(255, 255, 255, 0.1); color: white; cursor: pointer; border-radius: 8px; text-transform: uppercase; font-weight: bold;">MOBILE</button>
                <button id="screen2-computer" style="padding: 15px 40px; font-size: 20px; border: 2px solid white; background: rgba(255, 255, 255, 0.1); color: white; cursor: pointer; border-radius: 8px; text-transform: uppercase; font-weight: bold;">COMPUTER</button>
            </div>
        </div>
    </div>
    
    <!-- Screen 3: Player Name Input -->
    <div id="screen3-name" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px);">
        <div style="background: rgba(0, 0, 0, 0.8); padding: 40px; border-radius: 12px; border: 2px solid #64c8ff; min-width: 400px; text-align: center; user-select: none;">
            <label style="display: block; font-size: 18px; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; color: white;">ENTER YOUR NAME (Optional)</label>
            <input id="playerNameInput" type="text" placeholder="Enter name..." maxlength="20" style="width: 100%; padding: 12px; font-size: 16px; border: 1px solid #64c8ff; background: rgba(100, 200, 255, 0.1); color: white; border-radius: 6px; margin-bottom: 20px; box-sizing: border-box;">
            <button id="screen3-submit" style="width: 100%; padding: 12px; font-size: 16px; background: rgba(100, 200, 255, 0.3); border: 2px solid #64c8ff; color: white; cursor: pointer; border-radius: 6px; text-transform: uppercase; font-weight: bold;">ENTER</button>
        </div>
    </div>
    
    <!-- Screen 4: Enter Game -->
    <div id="screen4-enter" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px);">
        <button id="screen4-enter-btn" style="padding: 25px 60px; font-size: 32px; background: rgba(100, 200, 255, 0.3); border: 3px solid #64c8ff; color: white; cursor: pointer; border-radius: 12px; text-transform: uppercase; font-weight: bold; letter-spacing: 2px;">PRESS TO ENTER GAME</button>
    </div>
    
</div>

<style>
@keyframes pulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
}
</style>

<div id="menuOverlay">
    <div class="menu-container">
        <h1>GYRO SPACE</h1>
        <p>Select your control scheme</p>
        <div class="button-group">
            <button class="menu-btn" id="mobileBtn">MOBILE<br>CLASS</button>
            <div style="font-size:12px; color:#888;">OR</div>
            <button class="menu-btn" id="computerBtn">COMPUTER<br>CLASS</button>
        </div>
    </div>
</div>

<div id="overlay">
    <div><b>Gyro Space Prototype</b></div>
    <div id="status">Waiting...</div>
    <button id="gyroButton">Enable Gyroscope</button>
    <button id="recalibrateButton">Recalibrate Gyro</button>
    <button id="switchModeButton">Switch Mode</button>
    <button id="audioToggleBtn">Audio: ALL ON</button>
    <div style="margin-top:8px;">Click to fire. Hold 3 sec for charged beam.<br>Computer: Hold [SPACE] to charge Dash.</div>
</div>

<script>
// ===================================================
//                 GLOBAL VARIABLES
// ===================================================
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const statusText = document.getElementById("status");
const gyroButton = document.getElementById("gyroButton");
const recalibrateButton = document.getElementById("recalibrateButton");
const switchModeButton = document.getElementById("switchModeButton");
const audioToggleBtn = document.getElementById("audioToggleBtn");
const guiToggleBtn = document.getElementById("guiToggle");
const mobileDashButton = document.getElementById("mobileDashButton");
const menuOverlay = document.getElementById("menuOverlay");
const overlay = document.getElementById("overlay");
const mobileBtn = document.getElementById("mobileBtn");
const computerBtn = document.getElementById("computerBtn");

let width = 0;
let height = 0;
let centerX = 0;
let centerY = 0;

function resize(){
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    centerX = width/2;
    centerY = height/2;
}

window.addEventListener("resize",resize);
resize();

// ===================================================
//                  GAME STATE
// ===================================================
let paused = false;
let lastFrame = performance.now();
let frameTime = 0;
let fps = 0;
let gameStarted = false;
let controlMode = null;
let guiVisible = true;
let audioEnabled = true;

// Predefined color palette (consistent across all clients)
const COLOR_PALETTE = [
    "hsl(0, 100%, 60%)",     // Red
    "hsl(30, 100%, 60%)",    // Orange
    "hsl(60, 100%, 60%)",    // Yellow
    "hsl(120, 100%, 60%)",   // Green
    "hsl(180, 100%, 60%)",   // Cyan
    "hsl(240, 100%, 60%)",   // Blue
    "hsl(270, 100%, 60%)",   // Violet
    "hsl(300, 100%, 60%)",   // Magenta
    "hsl(15, 100%, 60%)",    // Orange-Red
    "hsl(45, 100%, 60%)"     // Yellow-Orange
];

// Assign color based on player ID (consistent across all clients)
let myColor = COLOR_PALETTE[0]; // Will be set from server after welcome message
let myPlayerId = null;

// ===================================================
//                     SHIP
// ===================================================
const ship = {
    x: 0,
    y: 0,
    angle: 0,
    baseSpeed: 3,
    speed: 3,
    size: 18,
    color: myColor,
    isAlive: true,
    deathTime: 0,
    name: playerName  // Will be set from start screen
};

// ===================================================
//               DASH MECHANICS (SPACE)
// ===================================================
let spaceHeld = false;
let spaceHoldStartTime = 0;
let dashChargeDuration = 0;
let dashTimeRemaining = 0;
let isDashing = false;

// ===================================================
//               CAMERA / WORLD POSITION
// ===================================================
const camera = {
    x: 0,
    y: 0,
    zoom: 1.0  // 1.0 = normal, <1.0 = zoomed out
};

const ZOOM_SETTINGS = {
    desktop: 1.0,
    mobile: 0.7,  // Mobile zoomed out to see more (desktop parity)
    minZoom: 0.5,
    maxZoom: 2.0
};

// ===================================================
//           SPATIAL GRID SYSTEM
// ===================================================
const GRID_SIZE = 500;
const grid = {};

function getGridKey(x, y) {
    const cellX = Math.floor(x / GRID_SIZE);
    const cellY = Math.floor(y / GRID_SIZE);
    return `${cellX},${cellY}`;
}

function getVisibleGridCells() {
    const minCellX = Math.floor(camera.x / GRID_SIZE) - 1;
    const minCellY = Math.floor(camera.y / GRID_SIZE) - 1;
    const maxCellX = Math.floor((camera.x + width) / GRID_SIZE) + 1;
    const maxCellY = Math.floor((camera.y + height) / GRID_SIZE) + 1;
    
    const cells = [];
    for (let x = minCellX; x <= maxCellX; x++) {
        for (let y = minCellY; y <= maxCellY; y++) {
            cells.push(`${x},${y}`);
        }
    }
    return cells;
}

function addToGrid(key, object) {
    if (!grid[key]) {
        grid[key] = [];
    }
    grid[key].push(object);
}

function removeFromGrid(key, object) {
    if (grid[key]) {
        const idx = grid[key].indexOf(object);
        if (idx > -1) {
            grid[key].splice(idx, 1);
        }
    }
}

// ===================================================
//              CHARGED BEAM STATE
// ===================================================
let isChargingBeam = false;
let beamChargeStartTime = 0;
let beamCooldownEnd = 0;
const MIN_CHARGE_TIME = 500; // 0.5 seconds before animation shows

// ===================================================
//                    PROJECTILES
// ===================================================
const bullets = [];
const bulletPool = [];
const MAX_BULLETS = 200;

for (let i = 0; i < MAX_BULLETS; i++) {
    bulletPool.push({
        x: 0,
        y: 0,
        vx: 0,
        vy: 0,
        life: 0,
        maxLife: 0,
        color: "#fff",
        type: "standard",
        firedAt: { x: 0, y: 0 },
        maxDistance: 500,
        size: 3,
        active: false,
        gridKey: null
    });
}

function fireLaser(x, y, angle, color, shotType = "standard") {
    if (bullets.length >= MAX_BULLETS) {
        return;
    }
    
    const maxDist = shotType === "beam" ? 1500 : 250;  // Standard shot range halved to 250
    const maxLife = shotType === "beam" ? 150 : 60;
    
    let bullet;
    if (bulletPool.length > 0) {
        bullet = bulletPool.pop();
    } else {
        bullet = { firedAt: { x: 0, y: 0 }, gridKey: null };
    }
    
    bullet.x = x;
    bullet.y = y;
    bullet.vx = Math.cos(angle) * 12;
    bullet.vy = Math.sin(angle) * 12;
    bullet.life = maxLife;
    bullet.maxLife = maxLife;
    bullet.color = color;
    bullet.type = shotType;
    bullet.firedAt.x = x;
    bullet.firedAt.y = y;
    bullet.maxDistance = maxDist;
    bullet.size = shotType === "beam" ? 6 : 3; // 2x beam size (3 * 2 = 6)
    bullet.active = true;
    bullet.gridKey = getGridKey(x, y);
    bullet.isLocalShot = true; // Mark as our shot (don't collide with us)
    
    addToGrid(bullet.gridKey, bullet);
    bullets.push(bullet);
}

// ===================================================
//                    AUDIO SYSTEM
// ===================================================
const sounds = {
    standardShot: [
        new Audio("pit-pit-pit-1.mp3"),
        new Audio("pit-pit-pit-2.mp3"),
        new Audio("pit-pit-pit-3.mp3")
    ],
    chargedBeam: new Audio("thwop.mp3"),
    chargeSound: new Audio("thwop-charge.mp3")
};

sounds.standardShot.forEach(sound => sound.preload = "auto");
sounds.chargedBeam.preload = "auto";
sounds.chargeSound.preload = "auto";

function getRandomStandardShot() {
    const index = Math.floor(Math.random() * sounds.standardShot.length);
    return sounds.standardShot[index];
}

function playLocalSound(shotType) {
    if (!audioEnabled) return;

    let sound = shotType === "standard" ? getRandomStandardShot() : sounds.chargedBeam;
    sound.currentTime = 0;
    sound.volume = 1.0;
    sound.play().catch(e => {});
}

function playRemoteShotSound(remoteX, remoteY, shotType) {
    if (!audioEnabled) return;

    const dist = Math.hypot(remoteX - ship.x, remoteY - ship.y);
    const maxHearRange = 5000;
    
    if (dist > maxHearRange) return;
    
    let sound = shotType === "standard" ? getRandomStandardShot() : sounds.chargedBeam;
    const volume = Math.max(0.1, 1 - (dist / maxHearRange));
    sound.volume = volume;
    
    sound.currentTime = 0;
    sound.play().catch(e => {});
}

function startBeamChargeAudio() {
    if (!audioEnabled) return;
    sounds.chargeSound.currentTime = 0;
    sounds.chargeSound.volume = 1.0;
    sounds.chargeSound.play().catch(e => {});
}

function updateBeamChargeAudio() {
    if (!audioEnabled || !isChargingBeam) return;
    
    // Check if we should be playing charge sound (only after 0.5s hold)
    const now = Date.now();
    const holdTime = now - beamChargeStartTime;
    
    if (holdTime < MIN_CHARGE_TIME) {
        // Don't play charge sound yet
        return;
    }
    
    // If audio is not currently playing, start it
    if (sounds.chargeSound.paused) {
        sounds.chargeSound.currentTime = 0;
        sounds.chargeSound.volume = 1.0;
        sounds.chargeSound.play().catch(e => {});
    }
    
    // Loop last 0.5s of charge sound continuously
    if (sounds.chargeSound.duration > 0.5) {
        const loopStart = sounds.chargeSound.duration - 0.5;
        // If reached end or near end, reset to loop point
        if (sounds.chargeSound.currentTime >= sounds.chargeSound.duration - 0.1) {
            sounds.chargeSound.currentTime = loopStart;
        }
    }
}

function stopBeamChargeAudio() {
    sounds.chargeSound.pause();
    sounds.chargeSound.currentTime = 0;
}

// ===================================================
//                    GYROSCOPE
// ===================================================
let gyroSupported = false;
let gyroEnabled = false;
let beta = 0;
let gamma = 0;
let neutralGamma = null;

// ===================================================
//                     INPUT
// ===================================================
const mouse = {
    x: centerX,
    y: centerY
};

window.addEventListener("mousemove", e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
});

// ===================================================
//                  STARFIELD (50,000)
// ===================================================
const STAR_COUNT = 50000;
const stars = [];

for(let i=0; i<STAR_COUNT; i++){
    stars.push({
        x: (Math.random()-0.5)*30000,
        y: (Math.random()-0.5)*30000,
        size: Math.random()*2+0.4
    });
}

// ===================================================
//                    TRAIL
// ===================================================
const trail = [];

// ===================================================
//              WORLD BOUNDS & SAFE ZONE
// ===================================================
const WORLD_BOUNDS = {
    min: -1000,
    max: 1000,
    size: 2000,
    borderThickness: 50  // Reduced from 100px to 50px
};

const SAFE_ZONE = {
    x: 0,
    y: 0,
    radius: 100  // Doubled from 50
};

function isInSafeZone(x, y) {
    const dist = Math.hypot(x - SAFE_ZONE.x, y - SAFE_ZONE.y);
    return dist <= SAFE_ZONE.radius;
}

function isOutOfBounds(x, y) {
    return x < WORLD_BOUNDS.min || x > WORLD_BOUNDS.max || 
           y < WORLD_BOUNDS.min || y > WORLD_BOUNDS.max;
}

function clampToBounds(x, y) {
    return {
        x: Math.max(WORLD_BOUNDS.min, Math.min(WORLD_BOUNDS.max, x)),
        y: Math.max(WORLD_BOUNDS.min, Math.min(WORLD_BOUNDS.max, y))
    };
}

// ===================================================
//                  EXPLOSIONS
// ===================================================
const explosions = [];
const explosionPool = [];
const MAX_EXPLOSIONS = 50;

for (let i = 0; i < MAX_EXPLOSIONS; i++) {
    explosionPool.push({
        x: 0,
        y: 0,
        vx: 0,
        vy: 0,
        life: 0,
        maxLife: 30,
        size: 2,
        color: "#fff",
        active: false
    });
}

function createExplosion(x, y, count = 12) {
    for (let i = 0; i < count; i++) {
        if (explosionPool.length === 0) break;
        
        const particle = explosionPool.pop();
        const angle = (i / count) * Math.PI * 2;
        const speed = 3 + Math.random() * 4;
        
        particle.x = x;
        particle.y = y;
        particle.vx = Math.cos(angle) * speed;
        particle.vy = Math.sin(angle) * speed;
        particle.life = 30;
        particle.maxLife = 30;
        particle.size = 2 + Math.random() * 2;
        particle.color = ship.color;
        particle.active = true;
        
        explosions.push(particle);
    }
}

function updateAndDrawExplosions() {
    for (let i = explosions.length - 1; i >= 0; i--) {
        const p = explosions[i];
        
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        
        if (p.life <= 0) {
            explosionPool.push(p);
            explosions.splice(i, 1);
            continue;
        }
        
        // Fade out
        const opacity = p.life / p.maxLife;
        
        const sx = centerX + (p.x - camera.x);
        const sy = centerY + (p.y - camera.y);
        
        if (sx < -50 || sx > width + 50 || sy < -50 || sy > height + 50) {
            continue;
        }
        
        ctx.fillStyle = p.color;
        ctx.globalAlpha = opacity;
        ctx.beginPath();
        ctx.arc(sx, sy, p.size, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1.0;
}
const socket = new WebSocket("wss://my-games-faxi.onrender.com");
const remotePlayers = {}; 

let lastSendTime = 0;
const SEND_INTERVAL = 1000 / 10; // 10 updates per sec (reduced from 20 for latency optimization)

function getColorFromId(id) {
    // Use consistent color palette based on first character of ID
    const colorIndex = id.charCodeAt(0) % COLOR_PALETTE.length;
    return COLOR_PALETTE[colorIndex];
}

socket.onmessage = event => {
    try {
        const data = JSON.parse(event.data);

        if (data.type === "welcome") {
            myPlayerId = data.id;
            // Assign color based on player ID (deterministic, same on all clients)
            const colorIndex = data.id.charCodeAt(0) % COLOR_PALETTE.length;
            myColor = COLOR_PALETTE[colorIndex];
            console.log("Connected! My ID is:", data.id, "Color:", myColor);
        } else if (data.type === "leave") {
            console.log("Player left:", data.id);
            delete remotePlayers[data.id];
        } else if (data.type === "join") {
            console.log("Player joined:", data.player?.id);
            if (data.player) {
                updateRemotePlayer(data.player.id, data.player.x, data.player.y, data.player.angle, data.player.color, null, data.player.isAlive);
            }
        } else if (data.type === "players") {
            console.log("Initial players list:", data.players?.length);
            if (Array.isArray(data.players)) {
                data.players.forEach(p => updateRemotePlayer(p.id, p.x, p.y, p.angle, p.color, null, p.isAlive));
            }
        } else if (data.type === "update" && data.player) {
            // Log update with shot info
            if (data.player.shot) {
                console.log("Received update with shot from", data.player.id, ":", data.player.shot);
            }
            updateRemotePlayer(data.player.id, data.player.x, data.player.y, data.player.angle, data.player.color, data.player.shot, data.player.isAlive);
        }
    } catch(e) {
        console.error("Error parsing server message", e);
    }
};

function updateRemotePlayer(id, x, y, angle, color, shot, isAlive) {
    let p = remotePlayers[id];
    const playerColor = color || getColorFromId(id);

    if (!p) {
        remotePlayers[id] = { 
            x: x, 
            y: y, 
            targetX: x, 
            targetY: y, 
            angle: angle, 
            color: playerColor,
            trail: [],
            isAlive: isAlive !== false,  // Default to alive if not specified
            name: ""  // Remote players start with no name (server doesn't send yet)
        };
        console.log("Remote player created:", id, "isAlive:", isAlive);
    } else {
        p.targetX = x;
        p.targetY = y;
        p.angle = angle;
        p.color = playerColor;
        
        // Handle death state change
        if (isAlive === false && p.isAlive === true) {
            // Player just died - create explosion
            console.log("Remote player DIED:", id, "at", x, y);
            createExplosion(p.x, p.y, 15);
            p.trail = []; // Clear trail immediately
        }
        
        p.isAlive = isAlive !== false;
        
        // Only add to trail if alive
        if (isAlive !== false) {
            p.trail.push({ x: x, y: y });
            if (p.trail.length > 500) p.trail.shift();
        }
    }

    if (shot) {
        console.log("Remote shot received:", shot);
        // Fire remote shot - isLocalShot will be false (undefined = false)
        fireLaser(shot.x, shot.y, shot.angle, playerColor, shot.type || "standard");
        // Clear isLocalShot flag on the last bullet (it's a remote shot)
        if (bullets.length > 0) {
            bullets[bullets.length - 1].isLocalShot = false;
        }
        playRemoteShotSound(shot.x, shot.y, shot.type || "standard");
    }
}

// ===================================================
//                   HELPERS
// ===================================================
function lerp(a,b,t){
    return a+(b-a)*t;
}

function wrapAngle(a){
    while(a>Math.PI) a-=Math.PI*2;
    while(a<-Math.PI) a+=Math.PI*2;
    return a;
}

// ===================================================
//           COORDINATE TRANSFORMATION
// ===================================================
function worldToScreen(worldX, worldY) {
    const relX = worldX - camera.x;
    const relY = worldY - camera.y;
    return {
        x: centerX + (relX * camera.zoom),
        y: centerY + (relY * camera.zoom)
    };
}

// ===================================================
//              DRAW SHIP (SOLID)
// ===================================================
function drawShip(){
    if (!ship.isAlive) return; // Don't draw if dead
    
    ctx.save();
    ctx.translate(centerX, centerY);
    ctx.scale(camera.zoom, camera.zoom);
    ctx.rotate(ship.angle);
    ctx.fillStyle = ship.color;
    ctx.beginPath();
    ctx.moveTo(ship.size,0);
    ctx.lineTo(-ship.size*.8,-ship.size*.6);
    ctx.lineTo(-ship.size*.35,0);
    ctx.lineTo(-ship.size*.8,ship.size*.6);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
    
    // Draw player name above ship
    if (ship.name) {
        ctx.save();
        ctx.fillStyle = ship.color;
        ctx.font = "12px Arial";
        ctx.textAlign = "center";
        ctx.fillText(ship.name, centerX, centerY - 35);
        ctx.restore();
    }
}

// ===================================================
//   DRAW CHARGE-UP & BEAM COOLDOWN RINGS
// ===================================================
function drawCooldownRing() {
    const now = Date.now();
    
    // 1. Draw Charge-Up Animation (Inverse white expanding arc)
    // Only show if held for at least MIN_CHARGE_TIME and cooldown is complete
    if (isChargingBeam && now >= beamCooldownEnd) {
        const chargeTime = Math.max(0, now - beamChargeStartTime - MIN_CHARGE_TIME);
        const maxChargeTime = 3000 - MIN_CHARGE_TIME;
        const chargeProgress = Math.min(1, chargeTime / maxChargeTime);
        
        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.scale(camera.zoom, camera.zoom);
        ctx.strokeStyle = `rgba(255, 255, 255, ${0.3 + chargeProgress * 0.7})`;
        ctx.lineWidth = 2 + chargeProgress * 3;
        ctx.beginPath();
        // Inverse animation: expands from center outward
        const startAngle = -Math.PI / 2 - Math.PI * chargeProgress;
        const endAngle = -Math.PI / 2 + Math.PI * chargeProgress;
        ctx.arc(0, 0, 25 + chargeProgress * 20, startAngle, endAngle);
        ctx.stroke();
        ctx.restore();
    }

    // 2. Cooldown Ring After Beam Shot (red, fills clockwise)
    if (now < beamCooldownEnd) {
        const remainingMs = beamCooldownEnd - now;
        const progress = 1 - (remainingMs / 5000);
        
        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.scale(camera.zoom, camera.zoom);
        ctx.strokeStyle = "rgba(255, 100, 100, 0.6)";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, 35, -Math.PI / 2, -Math.PI / 2 + (Math.PI * 2 * progress));
        ctx.stroke();
        ctx.restore();
    }
}

// ===================================================

// ===================================================
async function enableGyroscope(){
    if(gyroEnabled) return true;

    try{
        if(
            typeof DeviceOrientationEvent !== "undefined" &&
            typeof DeviceOrientationEvent.requestPermission === "function"
        ){
            const result = await DeviceOrientationEvent.requestPermission();
            if(result !== "granted") return false;
        }

        window.addEventListener("deviceorientation", onOrientation, true);
        gyroSupported = true;
        gyroEnabled = true;
        gyroButton.style.display = "none";
        return true;
    }catch(err){
        console.error("Gyroscope error:", err);
        return false;
    }
}

// ===================================================
//                  SHIP MOVEMENT
// ===================================================
function updateShip(dt){
    // Handle respawn
    if (!ship.isAlive) {
        const now = Date.now();
        const timeSinceDeath = now - ship.deathTime;
        
        if (timeSinceDeath >= 2000) {
            // Respawn at origin
            ship.x = 0;
            ship.y = 0;
            ship.angle = 0;
            ship.isAlive = true;
            trail = []; // Clear trail on respawn
            
            // Broadcast respawn to other players
            pendingShot = null; // Clear any pending shots
        } else {
            // Dead, don't move
            return;
        }
    }
    
    let desiredAngle;

    if(controlMode === "mobile" && gyroEnabled){
        if (neutralGamma !== null) {
            const gammaDelta = gamma - neutralGamma;
            const turnStrength = 0.08;
            ship.angle += (gammaDelta * Math.PI / 180) * turnStrength;
        }
        
        // Mobile dash handling (from button)
        if (spaceHeld && !isDashing) {
            dashChargeDuration = Math.min(10, (performance.now() - spaceHoldStartTime) / 1000);
            ship.speed = ship.baseSpeed * 0.6;
        } else if (!isDashing) {
            ship.speed = ship.baseSpeed;
        }

        if (isDashing) {
            dashTimeRemaining -= dt;
            if (dashTimeRemaining <= 0) {
                dashTimeRemaining = 0;
                isDashing = false;
                ship.speed = ship.baseSpeed;
            }
        }
    }else if(controlMode === "computer"){
        desiredAngle = Math.atan2(mouse.y-centerY, mouse.x-centerX);
        let difference = wrapAngle(desiredAngle-ship.angle);
        ship.angle += difference*0.06;

        if (spaceHeld && !isDashing) {
            dashChargeDuration = Math.min(10, (performance.now() - spaceHoldStartTime) / 1000);
            ship.speed = ship.baseSpeed * 0.6;
        } else if (!isDashing) {
            ship.speed = ship.baseSpeed;
        }

        if (isDashing) {
            dashTimeRemaining -= dt;
            if (dashTimeRemaining <= 0) {
                dashTimeRemaining = 0;
                isDashing = false;
                ship.speed = ship.baseSpeed;
            }
        }
    }

    if(!paused){
        ship.x += Math.cos(ship.angle) * ship.speed;
        ship.y += Math.sin(ship.angle) * ship.speed;
    }

    // Check border collision - bounce back and explode if hitting border
    if (isOutOfBounds(ship.x, ship.y) && !isInSafeZone(ship.x, ship.y)) {
        // Only explode if we just crossed the border
        const prevX = ship.x - Math.cos(ship.angle) * ship.speed;
        const prevY = ship.y - Math.sin(ship.angle) * ship.speed;
        
        if (!isOutOfBounds(prevX, prevY)) {
            // Just hit the border - kill player
            createExplosion(ship.x, ship.y, 15);
            ship.isAlive = false;
            ship.deathTime = Date.now();
            trail = []; // Clear trail immediately
        } else {
            // Clamp position to bounds
            const clamped = clampToBounds(ship.x, ship.y);
            ship.x = clamped.x;
            ship.y = clamped.y;
        }
    }

    camera.x = ship.x;
    camera.y = ship.y;
}

// ===================================================
//                  UPDATE TRAIL
// ===================================================
let trailAccumulator = 0;

function updateTrail(dt){
    if(paused) return;

    trailAccumulator += dt;
    if(trailAccumulator < 0.03) return;
    trailAccumulator = 0;

    trail.push({
        x: ship.x,
        y: ship.y
    });

    if (trail.length > 1000) {
        trail.shift();
    }
}

// ===================================================
//                  DRAW TRAIL
// ===================================================
function drawTrail(){
    if(trail.length < 2) return;

    ctx.strokeStyle = ship.color;
    ctx.lineWidth = 2;
    ctx.beginPath();

    for(let i=0;i<trail.length;i++){
        const p = trail[i];
        const sx = centerX + (p.x-camera.x);
        const sy = centerY + (p.y-camera.y);

        if(i===0) ctx.moveTo(sx,sy);
        else ctx.lineTo(sx,sy);
    }
    ctx.stroke();
}

// ===================================================
//            BATCH RENDER BULLETS BY TYPE
// ===================================================
function updateAndDrawBullets() {
    const visibleCells = getVisibleGridCells();
    
    const standardBullets = [];
    const beamBullets = [];

    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        
        b.x += b.vx;
        b.y += b.vy;
        b.life--;

        // Check collision with world border (only if bullet still visible)
        if (isOutOfBounds(b.x, b.y)) {
            // Only explode if bullet hasn't faded out yet
            const distTraveled = Math.hypot(b.x - b.firedAt.x, b.y - b.firedAt.y);
            let opacity = 1.0;
            if (distTraveled > b.maxDistance) {
                opacity = Math.max(0, 1 - (distTraveled - b.maxDistance) / 100);
            }
            
            // Only create explosion if bullet is still visible
            if (opacity > 0) {
                createExplosion(b.x, b.y, 8);
            }
            
            removeFromGrid(b.gridKey, b);
            bulletPool.push(b);
            bullets.splice(i, 1);
            continue;
        }

        // Check collision with player ship (only from remote shots, not in safe zone)
        if (ship.isAlive && !b.isLocalShot && !isInSafeZone(ship.x, ship.y)) {
            const dist = Math.hypot(b.x - ship.x, b.y - ship.y);
            if (dist < ship.size + b.size) {
                // Hit! Create explosion and kill player
                createExplosion(ship.x, ship.y, 15);
                ship.isAlive = false;
                ship.deathTime = Date.now();
                trail = []; // Clear trail immediately on death
                
                removeFromGrid(b.gridKey, b);
                bulletPool.push(b);
                bullets.splice(i, 1);
                continue;
            }
        }

        if (b.life <= 0) {
            removeFromGrid(b.gridKey, b);
            bulletPool.push(b);
            bullets.splice(i, 1);
            continue;
        }

        const newGridKey = getGridKey(b.x, b.y);
        if (newGridKey !== b.gridKey) {
            removeFromGrid(b.gridKey, b);
            b.gridKey = newGridKey;
            addToGrid(newGridKey, b);
        }

        if (b.type === "beam") {
            beamBullets.push(b);
        } else {
            standardBullets.push(b);
        }
    }

    if (standardBullets.length > 0) {
        renderBulletBatch(standardBullets, false);
    }

    if (beamBullets.length > 0) {
        renderBulletBatch(beamBullets, true);
    }
}

function renderBulletBatch(bulletArray, isBeam) {
    const byColor = {};
    
    for (const b of bulletArray) {
        if (!byColor[b.color]) {
            byColor[b.color] = [];
        }
        byColor[b.color].push(b);
    }

    for (const color in byColor) {
        const bullets = byColor[color];
        ctx.fillStyle = color;

        for (const b of bullets) {
            const distTraveled = Math.hypot(b.x - b.firedAt.x, b.y - b.firedAt.y);
            
            let opacity = 1.0;
            if (distTraveled > b.maxDistance) {
                opacity = Math.max(0, 1 - (distTraveled - b.maxDistance) / 100);
            }

            const sx = centerX + (b.x - camera.x);
            const sy = centerY + (b.y - camera.y);

            if (sx < -50 || sx > width + 50 || sy < -50 || sy > height + 50) {
                continue;
            }

            ctx.globalAlpha = opacity;
            ctx.beginPath();
            ctx.arc(sx, sy, b.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    ctx.globalAlpha = 1.0;
}

// ===================================================
//            DRAW OTHER MULTIPLAYER SHIPS & TRAILS
// ===================================================
function drawRemotePlayers(){
    for (const id in remotePlayers) {
        const p = remotePlayers[id];

        // Skip dead players
        if (!p.isAlive) {
            continue;
        }

        if (p.targetX !== undefined) {
            p.x = lerp(p.x, p.targetX, 0.2);
            p.y = lerp(p.y, p.targetY, 0.2);
        }

        if (p.trail && p.trail.length > 1) {
            ctx.strokeStyle = p.color;
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let i = 0; i < p.trail.length; i++) {
                const pt = p.trail[i];
                const tsx = centerX + (pt.x - camera.x);
                const tsy = centerY + (pt.y - camera.y);
                
                if (i === 0) ctx.moveTo(tsx, tsy);
                else ctx.lineTo(tsx, tsy);
            }
            ctx.stroke();
        }
        
        const sx = centerX + (p.x - camera.x);
        const sy = centerY + (p.y - camera.y);
        
        ctx.save();
        ctx.translate(sx, sy);
        ctx.rotate(p.angle);
        
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.moveTo(ship.size, 0);
        ctx.lineTo(-ship.size*.8, -ship.size*.6);
        ctx.lineTo(-ship.size*.35, 0);
        ctx.lineTo(-ship.size*.8, ship.size*.6);
        ctx.closePath();
        ctx.fill();
        
        ctx.restore();
        
        // Draw remote player name above ship
        if (p.name) {
            ctx.save();
            ctx.fillStyle = p.color;
            ctx.font = "12px Arial";
            ctx.textAlign = "center";
            ctx.fillText(p.name, sx, sy - 35);
            ctx.restore();
        }
    }
}

// ===================================================
//          DRAW WORLD BORDER & SAFE ZONE
// ===================================================
function drawWorldBorder() {
    const outerX = centerX + (WORLD_BOUNDS.min - camera.x);
    const outerY = centerY + (WORLD_BOUNDS.min - camera.y);
    const outerSize = (WORLD_BOUNDS.max - WORLD_BOUNDS.min);
    
    // Draw solid white border on OUTSIDE edge (flipped direction)
    const outerMin = WORLD_BOUNDS.min - WORLD_BOUNDS.borderThickness;
    const outerMax = WORLD_BOUNDS.max + WORLD_BOUNDS.borderThickness;
    
    const borderX = centerX + (outerMin - camera.x);
    const borderY = centerY + (outerMin - camera.y);
    const borderSize = outerMax - outerMin;
    
    ctx.fillStyle = "rgba(255, 255, 255, 1)";
    
    // Top border (outside)
    ctx.fillRect(borderX, borderY, borderSize, WORLD_BOUNDS.borderThickness);
    
    // Bottom border (outside)
    ctx.fillRect(borderX, borderY + borderSize - WORLD_BOUNDS.borderThickness, borderSize, WORLD_BOUNDS.borderThickness);
    
    // Left border (outside)
    ctx.fillRect(borderX, borderY, WORLD_BOUNDS.borderThickness, borderSize);
    
    // Right border (outside)
    ctx.fillRect(borderX + borderSize - WORLD_BOUNDS.borderThickness, borderY, WORLD_BOUNDS.borderThickness, borderSize);
}

function drawSafeZone() {
    const sx = centerX + (SAFE_ZONE.x - camera.x);
    const sy = centerY + (SAFE_ZONE.y - camera.y);
    
    // Draw safe zone circle with 20% opaque white fill
    ctx.fillStyle = "rgba(255, 255, 255, 0.2)";
    ctx.beginPath();
    ctx.arc(sx, sy, SAFE_ZONE.radius, 0, Math.PI * 2);
    ctx.fill();
    
    // Draw circle outline
    ctx.strokeStyle = "rgba(255, 255, 255, 0.6)";
    ctx.lineWidth = 2;
    ctx.stroke();
}

// ===================================================
//               DRAW ENTIRE SCENE
// ===================================================
function drawScene(){
    ctx.fillStyle="black";
    ctx.fillRect(0, 0, width, height);

    drawStars();
    drawWorldBorder();     // Draw world border
    drawSafeZone();        // Draw safe zone
    drawTrail();           // Draw trail first (behind)
    drawRemotePlayers();   // Draw remote players on top of trail
    drawCooldownRing();
    drawShip();            // Draw your ship on top
    updateAndDrawBullets();
    updateAndDrawExplosions(); // Draw explosions on top of everything
}

// ===================================================
//               AUTO DETECT GYRO
// ===================================================
if ("DeviceOrientationEvent" in window) {
    gyroSupported = true;
}

// ===================================================
//          KEYBOARD CONTROL FOR COMPUTER DASH
// ===================================================
window.addEventListener("keydown", e => {
    if (e.code === "Space" && controlMode === "computer" && !spaceHeld && !e.repeat) {
        spaceHeld = true;
        spaceHoldStartTime = performance.now();
    }
});

window.addEventListener("keyup", e => {
    if (e.code === "Space" && controlMode === "computer" && spaceHeld) {
        spaceHeld = false;
        const holdDurationSec = Math.min(10, (performance.now() - spaceHoldStartTime) / 1000);
        if (holdDurationSec > 0.1) {
            dashTimeRemaining = (holdDurationSec / 10) * 5;
            isDashing = true;
            ship.speed = ship.baseSpeed * 3;
        } else {
            ship.speed = ship.baseSpeed;
        }
        dashChargeDuration = 0;
    }
});

// ===================================================
//               MAIN ANIMATION LOOP
// ===================================================
function animate(now){
    requestAnimationFrame(animate);

    const frameStartTime = performance.now();

    const dt = Math.min((now - lastFrame) / 1000, 0.05);
    lastFrame = now;

    fps = lerp(fps, 1 / Math.max(dt, 0.0001), 0.08);

    if(gameStarted){
        updateShip(dt);
        updateTrail(dt);
        updateBeamChargeAudio();

        if (now - lastSendTime >= SEND_INTERVAL) {
            if (socket.readyState === WebSocket.OPEN) {
                const payload = {
                    type: "update",
                    x: Number(ship.x.toFixed(1)),
                    y: Number(ship.y.toFixed(1)),
                    angle: Number(ship.angle.toFixed(2)),
                    color: ship.color,
                    isAlive: ship.isAlive  // ✅ ADD THIS LINE to broadcast alive state
                };

                if (pendingShot) {
                    payload.shot = pendingShot;
                    console.log("Sending payload with shot:", payload);
                    pendingShot = null;
                } else {
                    console.log("Sending payload (no shot):", payload);
                }

                socket.send(JSON.stringify(payload));
            }
            lastSendTime = now;
        }
    }

    drawScene();
    
    frameTime = performance.now() - frameStartTime;
    updateOverlay();
}

requestAnimationFrame(animate);

// ===================================================
//            INITIAL SHIP/TRAIL SETUP
// ===================================================
trail.push({
    x: ship.x,
    y: ship.y
});

// ===================================================
//               PREVENT PAGE SCROLL
// ===================================================
document.body.addEventListener("touchmove", function(e){
    e.preventDefault();
}, { passive:false });

// ===================================================
//             DOUBLE TAP ZOOM DISABLE
// ===================================================
let lastTouch = 0;
document.body.addEventListener("touchend", function(e){
    const now = Date.now();
    if(now-lastTouch<300){
        e.preventDefault();
    }
    lastTouch = now;
}, {passive:false});

// ===================================================
//              INITIAL OVERLAY TEXT
// ===================================================
updateOverlay();
console.log("Gyro Space - Updated");
</script>
