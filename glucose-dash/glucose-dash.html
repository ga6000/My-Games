    r.z = f * FLOOR_H;
    r.vx *= 0.25; r.vy *= 0.25;
    r.speed = Math.sqrt(r.vx * r.vx + r.vy * r.vy);
    r.stun = 0.7;
    if (r.isPlayer) { shake(15); tone(160, 60, "square", 0.18, 0.08); }

    var side = r.x < 0 ? -1 : 1;
    var lim = walkLimit(side, f, r.y);
    if (Math.abs(r.x) > lim + EDGE_GRACE) {
        if (f > 0) startFall(r);      // still over the void -- keep going down
        else r.x = side * lim;        // ground floor has walls to stop you
    }
}

function stepRunner(r, inp, dt) {
    if (r.fall) {
        r.fall.t += dt;
        var u = Math.min(1, r.fall.t / r.fall.dur);
        r.z = r.fall.fromZ + (r.fall.toZ - r.fall.fromZ) * (u * u);   // accelerating
        r.x += r.vx * dt * 0.45;
        r.y += r.vy * dt * 0.45;
        r.vx *= 0.94; r.vy *= 0.94;
        r.speed = Math.sqrt(r.vx * r.vx + r.vy * r.vy);
        stepGlucose(r, dt);
        if (u >= 1) land(r);
        return;
    }

    if (r.stun > 0) {
        r.stun -= dt;
        // picking yourself up: you can still steer, you just cannot drive
        inp = { throttle: false, brake: false, steer: (inp.steer || 0) * 0.5, sprint: false, eat: inp.eat };
    }

    if (r.finished || r.dnf) {
        r.speed *= 0.90;
        r.x += r.vx * dt; r.y += r.vy * dt;
        r.vx *= 0.90; r.vy *= 0.90;
        return;
    }

    /* --- sprint timers --- */
    if (r.sprintT > 0) { r.sprintT -= dt; if (r.sprintT <= 0) r.sprintCd = TUNE.sprintCd; }
    else if (r.sprintCd > 0) r.sprintCd -= dt;

    if (inp.sprint && r.sprintT <= 0 && r.sprintCd <= 0 && !r.eating && r.speed > 4) {
        r.sprintT = TUNE.sprintDur;
    }

    /* --- eating: throttle cap drops, steering is untouched, and there
           is no cancel. The committed window IS the mechanic. --- */
    if (r.eating) {
        r.eatT += dt;
        if (r.eatT >= FOODS[r.eating].eat) {
            r.boluses.push(makeBolus(r.eating));
            if (r.isPlayer) toast("ATE " + FOODS[r.eating].name.toUpperCase(), GI_COLOR[FOODS[r.eating].gi]);
            r.eating = null; r.eatT = 0;
        }
    } else if (inp.eat && r.inventory.length) {
        r.eating = r.inventory.shift();       // FIFO, per the concept decision
        r.eatT = 0;
    }

    /* --- speed cap for the situation --- */
    var cap = TUNE.maxSpeed * glucoseSpeedMult(r.glucose);
    var accel = TUNE.accel;
    if (r.sprintT > 0) { cap *= TUNE.sprintMult; accel *= TUNE.sprintAccel; }
    if (r.eating) cap *= TUNE.eatSpeedMult;

    r.onRamp = rampAt(r);
    if (r.onRamp) {
        cap *= (r.onRamp.to > r.onRamp.from) ? TUNE.rampUpMult : TUNE.rampDownMult;
    }
    if (!r.isPlayer) cap *= r.npcSpeed || 1;

    /* --- longitudinal --- */
    var dir = { x: Math.sin(r.heading), y: Math.cos(r.heading) };
    var rgt = { x: Math.cos(r.heading), y: -Math.sin(r.heading) };
    var fwd = r.vx * dir.x + r.vy * dir.y;
    var lat = r.vx * rgt.x + r.vy * rgt.y;

    if (inp.throttle) {
        if (fwd < cap) fwd += accel * dt;
    }
    if (inp.brake) {
        fwd -= TUNE.brake * dt;
        if (fwd < -TUNE.reverseMax) fwd = -TUNE.reverseMax;
    }
    if (fwd > cap) fwd -= (fwd - cap) * Math.min(1, 3.2 * dt);   // ease down off sprint

    fwd *= Math.max(0, 1 - TUNE.drag * dt);
    lat *= Math.exp(-TUNE.grip * dt);

    /* --- steering: proportional to speed, so you cannot pivot in
           place. This is the car-style handling the concept asked for
           and it is what makes the bays a real cost. --- */
    var sp = Math.abs(fwd);
    if (inp.steer) {
        var authority = Math.min(1, sp / TUNE.turnSpeedRef);
        r.heading += inp.steer * TUNE.turnRate * dt * authority * (fwd < 0 ? -1 : 1);
    }
    r.lean += (((inp.steer || 0) * Math.min(1, sp / TUNE.turnSpeedRef)) - r.lean) * Math.min(1, 8 * dt);

    dir = { x: Math.sin(r.heading), y: Math.cos(r.heading) };
    rgt = { x: Math.cos(r.heading), y: -Math.sin(r.heading) };
    r.vx = dir.x * fwd + rgt.x * lat;
    r.vy = dir.y * fwd + rgt.y * lat;
    r.speed = Math.sqrt(r.vx * r.vx + r.vy * r.vy);

    r.x += r.vx * dt;
    r.y += r.vy * dt;
    r.stride += r.speed * dt * 0.55;

    /* --- ramp: soft auto-align, so a car-style turning radius never
           has to negotiate a narrow staircase --- */
    if (r.onRamp) {
        // A full-width bank doesn't need to grab your line -- there's
        // nowhere else to be. A narrow staircase does.
        if (!r.onRamp.full) {
            var tx = r.onRamp.side * RAMP_X;
            r.x += (tx - r.x) * Math.min(1, TUNE.rampAlign * dt);
        } else if (Math.abs(r.x) > hallHalf(r.onRamp.from)) {
            r.x = (r.x < 0 ? -1 : 1) * hallHalf(r.onRamp.from);
        }
        var wrapped = Math.atan2(Math.sin(-r.heading), Math.cos(-r.heading));
        r.heading += wrapped * Math.min(1, TUNE.rampAlign * 0.55 * dt);

        var t = (r.y - r.onRamp.y0) / (r.onRamp.y1 - r.onRamp.y0);
        t = Math.max(0, Math.min(1, t));
        r.rampT = t;
        r.z = (r.onRamp.from + (r.onRamp.to - r.onRamp.from) * t) * FLOOR_H;

        if (r.y > r.onRamp.y1) { r.floor = r.onRamp.to; r.onRamp = null; }
        else if (r.y < r.onRamp.y0) { r.floor = r.onRamp.from; r.onRamp = null; }
    } else {
        r.z = r.floor * FLOOR_H;

        /* --- the edge ---
           Ground floor: a wall, you scrape it. Upstairs: nothing, you
           fall. Same test, completely different consequence, and that
           difference is the entire reason to think twice about the oat
           bowl on floor 3. */
        var side = r.x < 0 ? -1 : 1;
        var lim = walkLimit(side, r.floor, r.y);
        if (Math.abs(r.x) > lim + EDGE_GRACE && r.floor > 0) {
            startFall(r);
        } else if (Math.abs(r.x) > lim && r.floor === 0) {
            r.x = side * lim;
            var outward = r.vx * side;
            if (outward > 0) {
                // The wall absorbs the normal component -- it's a wall,
                // not a trampoline.
                r.vx -= outward * side;

                /* Tangential friction has to scale with HOW HARD you hit
                   it. A flat per-frame fraction compounds sixty times a
                   second, so anything that so much as leans on a wall
                   gets pinned to a standstill -- which is exactly what
                   was happening to the NPCs (one of them spent half a
                   race scraping the storefronts at 17 u/s). Now a
                   glancing scrape costs a few percent and a head-on
                   costs half your speed. */
                var fric = Math.min(0.55, (outward / TUNE.maxSpeed) * TUNE.wallLoss * 3.2);
                r.vy *= (1 - fric);
                r.speed = Math.sqrt(r.vx * r.vx + r.vy * r.vy);
                if (r.isPlayer && outward > 8) shake(Math.min(9, outward * 0.5));
            }
        }
        if (r.y < 0) { r.y = 0; if (r.vy < 0) r.vy = 0; }
        // Backstop only. The full-width banks above are what actually
        // stop anyone reaching this.
        if (r.y > MALL_END) { r.y = MALL_END; if (r.vy > 0) r.vy = 0; }
    }

    stepGlucose(r, dt);
    tryPickup(r);

    if (!r.finished && !r.dnf && r.floor === 0 && r.y >= COURSE_LEN) finishRunner(r);
}

/* Pickup. Third item is BLOCKED, not swapped -- the item stays on the
   floor. Concept decision; SCOPE.md Q2 flags the failure case where
   you're at 60 holding two oat bowls and run over the soda that would
   have saved you. */
var fullWarnAt = -1e9;
function tryPickup(r) {
    if (r.dnf || r.finished) return;
    for (var i = 0; i < items.length; i++) {
        var it = items[i];
        if (it.taken || it.floor !== r.floor) continue;
        if (Math.abs(it.y - r.y) > TUNE.pickupR + 1) continue;
        var dx = it.x - r.x, dy = it.y - r.y;
        if (dx * dx + dy * dy > TUNE.pickupR * TUNE.pickupR) continue;

        if (r.inventory.length >= TUNE.invSize) {
            if (r.isPlayer && raceTime - fullWarnAt > 1.4) {
                fullWarnAt = raceTime;
                toast("HANDS FULL", "#ff6b6b");
            }
            continue;
        }
        it.taken = true;
        r.inventory.push(it.food);
        if (r.isPlayer) {
            toast("+ " + FOODS[it.food].name.toUpperCase(), GI_COLOR[FOODS[it.food].gi]);
            beep(it.food);
        }
        return;
    }
}

function finishRunner(r) {
    r.finished = true;
    r.finishMs = raceTime * 1000;
    finishOrder.push({ name: r.name, color: r.color, ms: r.finishMs, self: !!r.isPlayer, dnf: false });
    if (r.isPlayer) endRace("finish");
}


/* ===================================================
     NPC AI — deliberately easy
   ===================================================
   Concept decision: NPCs contest scarce items like a player would, but
   slower and without sprint spam. They exist to give sprint a reason to
   exist before multiplayer arrives -- if nothing ever races you for the
   centre-aisle shake, the double-tap is decoration.

   "Easy" is three specific things, not a difficulty multiplier:
     1. they decide at 2Hz, so they commit late and overshoot bays;
     2. their steering carries a jitter term, so they don't drive the
        perfect line;
     3. they only sprint when something is genuinely contesting them.

   SCOPE.md §6d: when real players are in the room these should probably
   just be removed rather than synced. They've done their job by then. */

/* Widened for the doubled course. These are how far an NPC can even SEE
   food, and on a 3300-unit course a 112-unit horizon meant they were
   reacting to shops that were already almost past them. */
var NPC_SCAN_AHEAD = 145;
var NPC_SCAN_SIDE  = 34;

function npcThink(r, dt) {
    r.think -= dt;
    if (r.think > 0) return;
    r.think = 0.42 + Math.random() * 0.22;

    /* Will I even get there? Distance left, at my burn rate, against
       what I'm carrying. An NPC that jogs serenely into a hypo crash
       reads as broken rather than as easy. */
    var secsLeft = Math.max(0, COURSE_LEN - r.y) / Math.max(8, r.speed);
    var carried = 0;
    for (var c = 0; c < r.inventory.length; c++) {
        var cf = FOODS[r.inventory[c]];
        carried += cf.peak - (cf.crash || 0) + (cf.hold ? cf.hold * TUNE.baseDecay * (1 - cf.holdX) : 0);
    }
    /* Judge starvation over a PLANNING HORIZON, not the whole remaining
       race. Against the full distance, a 126s course means every NPC
       thinks it is starving from the starting gun -- which tripled every
       item score, dropped their detour threshold to nothing, and had them
       careening across the mall after food they didn't need while
       actually starving. Food keeps appearing; you only have to survive
       as far as the next few shops. */
    var horizon = Math.min(28, secsLeft);
    var starving = (r.glucose + carried) < horizon * TUNE.baseDecay * 1.05;

    /* Eat first -- an NPC that dies holding two donuts looks broken. */
    if (!r.eating && r.inventory.length) {
        /* Eat sooner. Food in hand does nothing -- and with two slots
           you cannot bank much anyway, so sitting on a sandwich at 118
           while sliding toward a bonk is just a slower death. */
        var hungry = r.glucose < (124 + r.aggression * 10);
        var projected = r.glucose + r.glucoseRate * 4;
        if (hungry || projected < 95 || starving) { r.wantEat = true; }
    }

    /* Look for something worth leaving the line for. */
    r.target = null;
    if (r.inventory.length < TUNE.invSize) {
        var best = null, bestScore = 0;
        for (var i = 0; i < items.length; i++) {
            var it = items[i];
            if (it.taken || it.floor !== r.floor) continue;
            var ahead = it.y - r.y;
            if (ahead < 3 || ahead > NPC_SCAN_AHEAD) continue;
            if (Math.abs(it.x - r.x) > NPC_SCAN_SIDE + 7) continue;

            var f = FOODS[it.food];
            /* Value is "how much of my problem does this solve", not
               raw sugar: a crash-y food is worth less unless I'm
               actually in trouble right now, and a food that suppresses
               the burn for 30s is worth far more than its peak says. */
            /* Weight the crash at nearly its full size. At 0.55 an NPC
               rated a cake as +35 and happily ate the ground floor's
               sugar minefield all race -- 59% of everything they ate was
               high-GI, which is net NEGATIVE, so they were eating
               themselves into the floor. The desperation clause is also
               tighter (was 80): reaching for sugar at 78 starts the exact
               spike-crash-spike spiral the food model is designed to
               punish. Below 62 it really is the right call. */
            var value = f.peak - (f.crash || 0) * 0.82 + (f.hold ? 45 : 0);
            if (r.glucose < 62) value += (f.crash || 0) * 0.9;   // genuinely desperate
            var detour = Math.abs(it.x - r.x) * 0.9 + f.eat * 7;
            var score = value / (1 + detour * 0.05);
            if (starving) score *= 3;
            // A platform hanging over a drop is worth less than the same
            // food on solid ground. They are easy, not suicidal.
            if (it.bay && r.floor > 0) score *= (r.floor === 2 ? 0.45 : 0.65);
            if (score > bestScore) { bestScore = score; best = it; }
        }
        if (best && bestScore > (starving ? 2 : 4)) r.target = best;
    }

    /* Some NPCs believe in the upper floors. Gives the field variety
       and makes the ramps look used. */
    if (!r.target && r.wantsUp && r.floor < 2) {
        for (var j = 0; j < RAMPS.length; j++) {
            var ra = RAMPS[j];
            if (ra.from !== r.floor || ra.to <= ra.from) continue;
            if (ra.y0 < r.y + 8 || ra.y0 > r.y + 190) continue;
            r.target = { x: ra.side * RAMP_X, y: (ra.y0 + ra.y1) / 2, ramp: true };
            break;
        }
    }

    /* Late in the race, get back to the ground floor or you can't
       finish. Same bail-out logic a player has to work out themselves. */
    if (r.floor > 0 && r.y > COURSE_LEN - 420) {
        for (var k = 0; k < RAMPS.length; k++) {
            var rd = RAMPS[k];
            if (rd.from !== r.floor || rd.to >= rd.from) continue;
            if (rd.y0 < r.y + 4) continue;
            r.target = { x: rd.side * RAMP_X, y: (rd.y0 + rd.y1) / 2, ramp: true };
            break;
        }
    }
}

function npcInput(r, dt) {
    npcThink(r, dt);

    /* Between 2Hz decisions an item can be taken by someone else or slip
       behind you. Without this an NPC keeps steering at a pickup that
       isn't there any more, straight into the storefront wall. */
    if (r.target && !r.target.ramp && (r.target.taken || r.target.y < r.y - 1)) r.target = null;

    var tx, ty;
    if (r.target) { tx = r.target.x; ty = r.target.y; }
    else { tx = r.lane; ty = r.y + 60; }

    /* Reaching for a pickup on a balcony platform: aim SHORT of it.
       The pickup radius is 2.7, so aiming ~1.8 inside the item still
       collects it while leaving the runner most of a lane closer to
       safety. Aiming at the item itself put them right on the lip with
       nothing left to correct with -- once they started climbing more,
       that alone doubled their fall rate. */
    if (r.target && r.target.bay && r.floor > 0) {
        tx -= (tx < 0 ? -1 : 1) * 1.8;
    }

    /* Do not wander off a balcony while thinking about something else.
       Only a target they have actually committed to gets to pull them
       past the safe band. */
    if (r.floor > 0) {
        var safe = hallHalf(r.floor) * 0.82;
        if (!r.target || !r.target.bay) {
            tx = Math.max(-safe, Math.min(safe, tx));
            /* Cut back HARD, aiming past the centre line. Coming off a
               storefront platform there is very little y left before the
               floor simply stops, and a gentle correction at 25 units/sec
               does not arrive in time. */
            if (Math.abs(r.x) > hallHalf(r.floor) * 0.8) {
                tx = -(r.x < 0 ? -1 : 1) * hallHalf(r.floor) * 0.35;
            }
        }
    }

    var want = Math.atan2(tx - r.x, Math.max(2, ty - r.y));
    /* jitter: an NPC that drives the exact optimal line reads as a
       machine, and reads as unfair when it beats you to a shake */
    want += Math.sin(raceTime * 1.7 + r.jitter) * 0.055;

    var diff = Math.atan2(Math.sin(want - r.heading), Math.cos(want - r.heading));
    var steer = Math.max(-1, Math.min(1, diff * 3.1));

    /* Sprint only when actually contested: someone else is near the
       same item and close enough to take it. */
    var sprint = false;
    // never sprint into a platform hanging over a drop
    var sprintSafe = !(r.target && r.target.bay && r.floor > 0);
    if (sprintSafe && r.target && !r.target.ramp && r.glucose > 112 && r.sprintCd <= 0) {
        var dToItem = Math.hypot(r.target.x - r.x, r.target.y - r.y);
        if (dToItem < 34) {
            for (var i = 0; i < runners.length; i++) {
                var o = runners[i];
                if (o === r || o.finished || o.dnf || o.floor !== r.floor) continue;
                if (Math.hypot(r.target.x - o.x, r.target.y - o.y) < dToItem + 9) { sprint = true; break; }
            }
        }
    }

    var eat = !!r.wantEat && !r.onRamp;
    if (eat) r.wantEat = false;

    return {
        throttle: true,
        brake: Math.abs(diff) > 1.15 && r.speed > 16,
        steer: steer,
        sprint: sprint,
        eat: eat
    };
}

/* ===================================================
     CAMERA — orthographic top-down
   ===================================================
   v5 threw out the perspective renderer. Every graphical bug this
   project hit came from the projection: near-plane clipping, depth
   sorting across draw categories, billboarded-vs-wall-plane text,
   white-on-white silhouettes, and a duplicate quad() that hid inside a
   2600-line file for a whole revision. None of those failure modes
   exist here. There is no projection, so nothing can be clipped wrong;
   there is no depth, so draw order is just source order and is
   trivially correct by construction.

   Still FIXED TO THE COURSE AXIS, as decided: forward is up the screen
   and the camera never rotates. The mall winds across the frame because
   centerX(y) genuinely moves, which is the clearest possible reading of
   the curve.

   The course is 35 units wide and we show 136 units of it along, so on
   a wide window the playfield is a ribbon with room either side. That
   space is deliberate: it reads as a floor plan, and the HUD sits in it
   without ever covering the course. */

/* VIEW_BEHIND is not really about seeing behind you -- it sets where the
   runner sits on screen. anchorY = ahead/(ahead+behind), so at 110/26 the
   player sat at 81% down, directly underneath the glucose monitor. 105/40
   puts them at 72%, clear of the HUD on any sensible window, and you get
   to see rivals coming up behind you as a bonus. */
var VIEW_AHEAD = 105, VIEW_BEHIND = 40;
var cam = { y: 0, wx: 0, shake: 0, shakeX: 0, shakeY: 0 };
var VP = { scale: 6, anchorY: 0, cx: 0 };

function updateCamera(dt) {
    cam.y = player.y;
    // Follow the centreline fully and the player's lateral position only
    // partly, so you can feel where you are across the corridor while the
    // hall stays framed.
    var targetWX = centerX(player.y) + player.x * 0.6;
    cam.wx += (targetWX - cam.wx) * Math.min(1, 9 * dt);

    if (cam.shake > 0.05) {
        cam.shake *= Math.max(0, 1 - 7 * dt);
        cam.shakeX = (Math.random() - 0.5) * cam.shake;
        cam.shakeY = (Math.random() - 0.5) * cam.shake;
    } else { cam.shake = 0; cam.shakeX = 0; cam.shakeY = 0; }

    VP.scale = VIEW.h / (VIEW_AHEAD + VIEW_BEHIND);
    VP.anchorY = VIEW.h * (VIEW_AHEAD / (VIEW_AHEAD + VIEW_BEHIND));

    /* Where the corridor sits horizontally. Centred when there's room,
       but slid left when the window is too narrow for both the ribbon and
       the bottom-right HUD cluster -- otherwise the runner ends up behind
       the glucose monitor, which is the one thing that must never happen
       in a game about reading the glucose monitor. */
    var halfW = (bayOut(0) + 6) * VP.scale;
    var minC = halfW + 34;                        // clear of the progress rail
    var maxC = VIEW.w - 300 - halfW;              // clear of the HUD cluster
    VP.cx = Math.max(minC, Math.min(VIEW.w * 0.5, Math.max(minC, maxC)));
}

function shake(a) { cam.shake = Math.min(26, cam.shake + a); }

/* Track space -> screen. SX needs the y as well as the x because the
   centreline moves: that one term is the entire curvature implementation
   on the render side. */
function SX(tx, ty) { return VP.cx + ((tx + centerX(ty)) - cam.wx) * VP.scale + cam.shakeX; }
function SY(ty)     { return VP.anchorY - (ty - cam.y) * VP.scale + cam.shakeY; }


/* ===================================================
     RENDER — top-down floor plan
   =================================================== */

var C = {
    outside:   "#e8ebf0",
    shell:     "#d3d8e0",
    shellEdge: "#b9c0cc",
    tile:      ["#f8f7f4", "#f4f7f9", "#f6f9fb"],
    tileAlt:   ["#e6e2da", "#dfe6ec", "#e2ebef"],
    wall:      "#8d95a6",
    aisle:     "#e3ded4",
    below1:    "#c7ccd6",
    below2:    "#b4bac6",
    belowEdge: "#a4abb9",
    hazDark:   "#2c3242",
    hazLight:  "#fcbc2a",
    rampUp:    "#12b886",
    rampDown:  "#f59f00",
    ink:       "#39415a"
};

var PATH_STEP = 4;      // world units between points when tracing a curved edge
var TILE = 4.0;         // floor tile size, world units

function rgb(c) { return "rgb(" + (c[0] | 0) + "," + (c[1] | 0) + "," + (c[2] | 0) + ")"; }
function mixc(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
var _hexCache = {};
function hexRgb(h) {
    if (_hexCache[h]) return _hexCache[h];
    var v = [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
    _hexCache[h] = v;
    return v;
}
function hexA(hex, a) {
    var c = hexRgb(hex);
    return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a + ")";
}

function viewY0() { return cam.y - VIEW_BEHIND - 8; }
function viewY1() { return cam.y + VIEW_AHEAD + 10; }

/* One closed path per rectangular strip, always wound the same way
   (up the smaller-x edge, back down the larger-x edge) so that several
   subpaths union cleanly under the nonzero fill rule instead of
   cancelling each other out. */
function stripSubpath(xa, xb, y0, y1) {
    var lo = Math.min(xa, xb), hi = Math.max(xa, xb), y;
    ctx.moveTo(SX(lo, y0), SY(y0));
    for (y = y0; y < y1; y += PATH_STEP) ctx.lineTo(SX(lo, y), SY(y));
    ctx.lineTo(SX(lo, y1), SY(y1));
    ctx.lineTo(SX(hi, y1), SY(y1));
    for (y = y1; y > y0; y -= PATH_STEP) ctx.lineTo(SX(hi, y), SY(y));
    ctx.lineTo(SX(hi, y0), SY(y0));
    ctx.closePath();
}

/* The complete walkable region of a floor: corridor + storefront
   platforms + stair aprons. Everything else -- filling it, clipping the
   checkerboard to it, stroking its outline as either a wall or a
   hazard-striped cliff edge -- is done from this one path, so the floor
   you can see and the floor you can stand on cannot disagree. */
function pathWalkable(f, y0, y1) {
    ctx.beginPath();
    var hh = hallHalf(f);
    stripSubpath(-hh, hh, y0, y1);

    var i, st;
    for (i = 0; i < stores.length; i++) {
        st = stores[i];
        if (st.floor !== f) continue;
        if (st.y1 < y0 || st.y0 > y1) continue;
        var run = (f === 0) ? 0 : BAY_RUNOFF;
        stripSubpath(st.side * hh, st.side * bayOut(f),
                     Math.max(y0, st.y0 - run), Math.min(y1, st.y1 + run));
    }

    if (f > 0) {
        for (i = 0; i < RAMPS.length; i++) {
            var ra = RAMPS[i];
            if (ra.full || (ra.from !== f && ra.to !== f)) continue;
            var a = ra.y0 - APRON_IN, b = ra.y1 + APRON_OUT;
            if (b < y0 || a > y1) continue;
            stripSubpath(ra.side * hh, ra.side * (RAMP_X + RAMP_HALF + 0.6),
                         Math.max(y0, a), Math.min(y1, b));
        }
    }
}

function drawChecker(f, y0, y1) {
    var lo = Math.floor(y0 / TILE) * TILE;
    var xr = bayOut(f) + TILE;
    var c0 = Math.floor(-xr / TILE), c1 = Math.ceil(xr / TILE);
    ctx.fillStyle = C.tileAlt[Math.min(2, f)];
    for (var y = lo; y < y1; y += TILE) {
        var row = Math.floor(y / TILE);
        for (var c = c0; c < c1; c++) {
            if (((row + c) & 1) === 0) continue;      // base fill is the other colour
            var xa = c * TILE, xb = xa + TILE;
            ctx.beginPath();
            ctx.moveTo(SX(xa, y), SY(y));
            ctx.lineTo(SX(xb, y), SY(y));
            ctx.lineTo(SX(xb, y + TILE), SY(y + TILE));
            ctx.lineTo(SX(xa, y + TILE), SY(y + TILE));
            ctx.closePath();
            ctx.fill();
        }
    }
}

/* Every level beneath you, drawn first and then covered by your own
   floor. Whatever is left showing IS the drop -- so the hole you can
   fall through is exactly the hole you can see, with no separate
   "void" geometry to get out of step with the collision test. */
function drawFloorsBelow(f, y0, y1) {
    for (var lo = f - 1; lo >= 0; lo--) {
        pathWalkable(lo, y0, y1);
        ctx.fillStyle = (lo === f - 1) ? C.below1 : C.below2;
        ctx.fill();
        ctx.lineWidth = Math.max(1, VP.scale * 0.25);
        ctx.strokeStyle = C.belowEdge;
        ctx.stroke();
    }
}

function drawFloorPlate(f, y0, y1) {
    pathWalkable(f, y0, y1);
    ctx.fillStyle = C.tile[Math.min(2, f)];
    ctx.fill();
    ctx.save();
    ctx.clip();
    drawChecker(f, y0, y1);
    drawFloorMarkings(f, y0, y1);
    ctx.restore();
}

function drawFloorMarkings(f, y0, y1) {
    // centre aisle: dashed, and only where there's room for one
    if (hallHalf(f) >= 4) {
        ctx.fillStyle = "rgba(120,128,145,0.28)";
        for (var ly = Math.floor(y0 / 16) * 16; ly < y1; ly += 16) {
            ctx.beginPath();
            ctx.moveTo(SX(-0.35, ly), SY(ly));
            ctx.lineTo(SX(0.35, ly), SY(ly));
            ctx.lineTo(SX(0.35, ly + 7), SY(ly + 7));
            ctx.lineTo(SX(-0.35, ly + 7), SY(ly + 7));
            ctx.closePath();
            ctx.fill();
        }
    }
    // light spilling from each lit storefront
    for (var i = 0; i < stores.length; i++) {
        var st = stores[i];
        if (st.floor !== f || st.y1 < y0 || st.y0 > y1) continue;
        var hh = hallHalf(f);
        ctx.fillStyle = hexA(st.def.sign, (0.085 * st.lit).toFixed(3));
        ctx.beginPath();
        ctx.moveTo(SX(st.side * hh, st.y0), SY(st.y0));
        ctx.lineTo(SX(st.side * Math.max(0.5, hh - 3.0), st.y0), SY(st.y0));
        ctx.lineTo(SX(st.side * Math.max(0.5, hh - 3.0), st.y1), SY(st.y1));
        ctx.lineTo(SX(st.side * hh, st.y1), SY(st.y1));
        ctx.closePath();
        ctx.fill();
    }
    if (f === 0) drawStartFinish2D(y0, y1);
}

function drawStartFinish2D(y0, y1) {
    var hh = hallHalf(0), i, k;
    if (y0 < 6) {
        for (i = -6; i < 6; i++) {
            ctx.fillStyle = (i % 2) ? "rgba(44,50,66,0.55)" : "rgba(255,255,255,0.85)";
            band(i * 2.2, i * 2.2 + 2.2, 0, 2.6);
        }
    }
    if (COURSE_LEN > y0 - 6 && COURSE_LEN < y1 + 6) {
        for (i = -6; i < 6; i++) {
            for (k = 0; k < 2; k++) {
                ctx.fillStyle = ((i + k) % 2) ? "#ffffff" : "#20232e";
                band(i * 2.2, i * 2.2 + 2.2, COURSE_LEN + k * 2.2, COURSE_LEN + k * 2.2 + 2.2);
            }
        }
    }
    function band(xa, xb, ya, yb) {
        ctx.beginPath();
        ctx.moveTo(SX(xa, ya), SY(ya));
        ctx.lineTo(SX(xb, ya), SY(ya));
        ctx.lineTo(SX(xb, yb), SY(yb));
        ctx.lineTo(SX(xa, yb), SY(yb));
        ctx.closePath();
        ctx.fill();
    }
}

/* Ground floor gets a wall. Upper floors get a hazard-striped cliff
   edge, drawn as a dark stroke with a dashed amber stroke over it. */
function drawEdges(f, y0, y1) {
    pathWalkable(f, y0, y1);
    if (f === 0) {
        ctx.lineWidth = Math.max(2.5, VP.scale * 0.95);
        ctx.strokeStyle = C.wall;
        ctx.lineJoin = "round";
        ctx.stroke();
    } else {
        ctx.lineJoin = "round";
        ctx.lineWidth = Math.max(3, VP.scale * 1.25);
        ctx.strokeStyle = C.hazDark;
        ctx.setLineDash([]);
        ctx.stroke();
        ctx.strokeStyle = C.hazLight;
        ctx.setLineDash([VP.scale * 2.2, VP.scale * 2.2]);
        ctx.stroke();
        ctx.setLineDash([]);
    }
}

function drawStores2D(f, y0, y1) {
    var bo = bayOut(f);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (var i = 0; i < stores.length; i++) {
        var st = stores[i];
        if (st.floor !== f || st.y1 < y0 || st.y0 > y1) continue;
        var xi = st.side * bo, xo = st.side * (bo + 3.2);

        ctx.beginPath();
        ctx.moveTo(SX(xi, st.y0), SY(st.y0));
        ctx.lineTo(SX(xo, st.y0), SY(st.y0));
        ctx.lineTo(SX(xo, st.y1), SY(st.y1));
        ctx.lineTo(SX(xi, st.y1), SY(st.y1));
        ctx.closePath();
        ctx.fillStyle = st.def.sign;
        ctx.fill();

        // name, running along the shopfront the way a floor-plan label does
        var lenPx = Math.abs(SY(st.y1) - SY(st.y0));
        var size = Math.min(VP.scale * 1.9, lenPx / (st.name.length * 0.62));
        if (size >= 6) {
            var mid = (st.y0 + st.y1) / 2;
            ctx.save();
            ctx.translate(SX(st.side * (bo + 1.6), mid), SY(mid));
            ctx.rotate(-Math.PI / 2);
            ctx.font = "800 " + size.toFixed(1) + "px Segoe UI, sans-serif";
            ctx.fillStyle = "rgba(255,255,255,0.97)";
            ctx.fillText(st.name, 0, 0);
            ctx.restore();
        }
    }
}

function drawRamps2D(f, y0, y1) {
    for (var i = 0; i < RAMPS.length; i++) {
        var r = RAMPS[i];
        if (r.from !== f && r.to !== f) continue;
        if (r.y1 < y0 || r.y0 > y1) continue;

        var up = r.to > r.from;
        var mine = (r.from === f);
        var x = r.full ? 0 : r.side * RAMP_X;
        var half = r.full ? hallHalf(r.from) : RAMP_HALF;
        var xa = x - half, xb = x + half;

        ctx.beginPath();
        ctx.moveTo(SX(xa, r.y0), SY(r.y0));
        ctx.lineTo(SX(xb, r.y0), SY(r.y0));
        ctx.lineTo(SX(xb, r.y1), SY(r.y1));
        ctx.lineTo(SX(xa, r.y1), SY(r.y1));
        ctx.closePath();
        ctx.fillStyle = mine ? "#eef0f4" : "#dce0e8";
        ctx.fill();
        ctx.lineWidth = Math.max(1.5, VP.scale * 0.35);
        ctx.strokeStyle = up ? C.rampUp : C.rampDown;
        ctx.stroke();

        // treads
        ctx.strokeStyle = "rgba(90,98,118,0.35)";
        ctx.lineWidth = Math.max(1, VP.scale * 0.16);
        for (var t = r.y0 + 4; t < r.y1; t += 4.5) {
            ctx.beginPath();
            ctx.moveTo(SX(xa, t), SY(t));
            ctx.lineTo(SX(xb, t), SY(t));
            ctx.stroke();
        }

        if (!mine) continue;

        // direction chevrons at the mouth
        ctx.fillStyle = up ? C.rampUp : C.rampDown;
        for (var ch = 0; ch < 3; ch++) {
            var cy = r.y0 - 8 + ch * 3.0;
            ctx.beginPath();
            ctx.moveTo(SX(x, cy + 2.2), SY(cy + 2.2));
            ctx.lineTo(SX(x - half * 0.65, cy), SY(cy));
            ctx.lineTo(SX(x + half * 0.65, cy), SY(cy));
            ctx.closePath();
            ctx.fill();
        }
        var lbl = (up ? "▲ " : "▼ ") + (r.to + 1);
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.font = "900 " + Math.max(9, VP.scale * 1.7).toFixed(1) + "px Segoe UI, sans-serif";
        ctx.lineWidth = 3; ctx.strokeStyle = "rgba(255,255,255,0.92)"; ctx.lineJoin = "round";
        ctx.strokeText(lbl, SX(x, r.y0 + 6), SY(r.y0 + 6));
        ctx.fillStyle = up ? C.rampUp : C.rampDown;
        ctx.fillText(lbl, SX(x, r.y0 + 6), SY(r.y0 + 6));
    }
}

function drawItems2D(f, y0, y1) {
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    for (var i = 0; i < items.length; i++) {
        var it = items[i];
        if (it.taken || it.floor !== f) continue;
        if (it.y < y0 || it.y > y1) continue;
        var px = SX(it.x, it.y), py = SY(it.y);
        var food = FOODS[it.food];
        var col = GI_COLOR[food.gi];
        var rad = VP.scale * 2.1;
        var pulse = 1 + Math.sin(raceTime * 3 + it.bob) * 0.06;

        ctx.beginPath();
        ctx.arc(px, py, rad * pulse, 0, 6.284);
        ctx.fillStyle = hexA(col, "0.20");
        ctx.fill();
        ctx.lineWidth = Math.max(1.5, VP.scale * 0.3);
        ctx.strokeStyle = col;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(px, py, rad * 0.68, 0, 6.284);
        ctx.fillStyle = "rgba(255,255,255,0.92)";
        ctx.fill();

        ctx.font = (rad * 1.05).toFixed(1) + "px Segoe UI Emoji, Apple Color Emoji, serif";
        ctx.fillText(food.icon, px, py);
    }
}

/* Runners seen from directly above: a coloured shoulder disc with the
   white top of the head inside it, and a nose wedge for heading -- which
   matters, because with car-style physics you are often not travelling
   the way you are pointing. Falling shrinks the runner toward a landing
   ring on the floor below, which is the top-down reading of "going
   down". */
function drawRunners2D(f, y0, y1) {
    for (var i = 0; i < runners.length; i++) {
        var r = runners[i];
        if (Math.abs(r.z - player.z) > FLOOR_H * 0.8 && !r.fall) continue;
        if (r.y < y0 - 6 || r.y > y1 + 6) continue;

        var px = SX(r.x, r.y), py = SY(r.y);
        var fallT = r.fall ? Math.min(1, r.fall.t / r.fall.dur) : 0;
        var shrink = 1 - fallT * 0.45;
        var rad = VP.scale * 1.95 * shrink;

        if (r.fall) {
            ctx.beginPath();
            ctx.arc(px, py, VP.scale * 2.6, 0, 6.284);
            ctx.strokeStyle = "rgba(244,69,63," + (0.75 * (1 - fallT)).toFixed(2) + ")";
            ctx.lineWidth = Math.max(1.5, VP.scale * 0.3);
            ctx.stroke();
        }

        ctx.save();
        ctx.globalAlpha = r.dnf ? 0.45 : (r.fall ? 1 - fallT * 0.35 : 1);

        /* Heading wedge. With car-style physics you are frequently not
           travelling the way you are pointing, and from directly above a
           disc has no facing at all -- so this is the only cue for which
           way you'll go when you next touch the throttle. It has to be
           solid, not a hint. */
        if (!r.fall) {
            var hx = Math.sin(r.heading), hy = Math.cos(r.heading);
            ctx.beginPath();
            ctx.moveTo(px + hx * rad * 2.4, py - hy * rad * 2.4);
            ctx.lineTo(px + hy * rad * 0.95, py + hx * rad * 0.95);
            ctx.lineTo(px - hy * rad * 0.95, py - hx * rad * 0.95);
            ctx.closePath();
            ctx.fillStyle = hexA(r.color, "0.75");
            ctx.fill();
        }

        // soft contact shadow so runners sit ON the floor plan, not in it
        ctx.beginPath();
        ctx.arc(px + rad * 0.16, py + rad * 0.22, rad, 0, 6.284);
        ctx.fillStyle = "rgba(40,48,68,0.16)";
        ctx.fill();

        // shoulders
        ctx.beginPath();
        ctx.arc(px, py, rad, 0, 6.284);
        ctx.fillStyle = r.color;
        ctx.fill();
        ctx.lineWidth = Math.max(1, rad * 0.16);
        ctx.strokeStyle = "rgba(40,46,64,0.35)";
        ctx.stroke();

        // top of the head
        ctx.beginPath();
        ctx.arc(px, py, rad * 0.44, 0, 6.284);
        ctx.fillStyle = "#ffffff";
        ctx.fill();

        if (r.sprintT > 0 && !r.fall) {
            ctx.beginPath();
            ctx.arc(px, py, rad * 1.9, 0, 6.284);
            ctx.strokeStyle = "rgba(18,184,134,0.8)";
            ctx.lineWidth = Math.max(1.5, rad * 0.22);
            ctx.stroke();
        }
        ctx.restore();

        if (r.eating) {
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.font = (rad * 1.5).toFixed(1) + "px Segoe UI Emoji, serif";
            ctx.fillText(FOODS[r.eating].icon, px + rad * 2.0, py - rad * 1.6);
        }

        if (!r.isPlayer) {
            ctx.textAlign = "center"; ctx.textBaseline = "bottom";
            ctx.font = "700 " + Math.max(9, VP.scale * 1.5).toFixed(1) + "px Segoe UI, sans-serif";
            ctx.lineWidth = 3; ctx.strokeStyle = "rgba(255,255,255,0.9)"; ctx.lineJoin = "round";
            ctx.strokeText(r.name, px, py - rad * 1.9);
            ctx.fillStyle = C.ink;
            ctx.fillText(r.name, px, py - rad * 1.9);
        }
    }
}

function render() {
    var f = player.floor;
    var y0 = viewY0(), y1 = viewY1();

    ctx.setTransform(VIEW.dpr, 0, 0, VIEW.dpr, 0, 0);
    ctx.fillStyle = C.outside;
    ctx.fillRect(0, 0, VIEW.w, VIEW.h);

    // the building footprint, so the mall reads as a building on a plan
    ctx.beginPath();
    stripSubpath(-(bayOut(0) + 5), bayOut(0) + 5, y0, y1);
    ctx.fillStyle = C.shell;
    ctx.fill();
    ctx.lineWidth = Math.max(1.5, VP.scale * 0.4);
    ctx.strokeStyle = C.shellEdge;
    ctx.stroke();

    // Draw order is just source order -- there is no depth to get wrong.
    if (f > 0) drawFloorsBelow(f, y0, y1);
    drawFloorPlate(f, y0, y1);
    drawRamps2D(f, y0, y1);
    drawEdges(f, y0, y1);
    drawStores2D(f, y0, y1);
    drawItems2D(f, y0, y1);
    drawRunners2D(f, y0, y1);
}


/* ===================================================
     HUD
   ===================================================
   The exposure effects deliberately stop at the canvas. When you're at
   38 mg/dL the world should be a grey tunnel -- but the monitor telling
   you WHY has to stay legible, or the mechanic reads as the game
   breaking rather than as your body failing. */

var WAVE_N = 300, WAVE_HZ = 10;         // 30 seconds of history
var waveBuf = new Float32Array(WAVE_N);
var waveHead = 0, waveFill = 0, waveAcc = 0;
var railPips = [];

function pushWave(v) {
    waveBuf[waveHead] = v;
    waveHead = (waveHead + 1) % WAVE_N;
    if (waveFill < WAVE_N) waveFill++;
}

function drawWave() {
    var w = waveCanvas.width, h = waveCanvas.height, d = VIEW.dpr;
    waveCtx.setTransform(1, 0, 0, 1, 0, 0);
    waveCtx.clearRect(0, 0, w, h);

    var LO = 30, HI = 300;
    function ty(v) { return h - ((Math.max(LO, Math.min(HI, v)) - LO) / (HI - LO)) * h; }

    waveCtx.fillStyle = "rgba(255,255,255,0.03)";
    waveCtx.fillRect(0, 0, w, h);

    // the three zones, drawn as the background rather than as lines --
    // you read this at a glance while steering, not by inspecting it
    waveCtx.fillStyle = "rgba(255,107,107,0.16)";
    waveCtx.fillRect(0, ty(TUNE.hypo), w, h - ty(TUNE.hypo));
    waveCtx.fillStyle = "rgba(255,196,84,0.14)";
    waveCtx.fillRect(0, 0, w, ty(TUNE.hyper));
    waveCtx.fillStyle = "rgba(108,231,168,0.10)";
    waveCtx.fillRect(0, ty(TUNE.hyper), w, ty(TUNE.hypo) - ty(TUNE.hyper));

    waveCtx.strokeStyle = "rgba(255,255,255,0.22)";
    waveCtx.lineWidth = 1 * d;
    [TUNE.hypo, TUNE.hyper].forEach(function (v) {
        waveCtx.beginPath();
        waveCtx.moveTo(0, ty(v) + 0.5); waveCtx.lineTo(w, ty(v) + 0.5);
        waveCtx.stroke();
    });

    if (waveFill < 2) return;
    waveCtx.beginPath();
    for (var i = 0; i < waveFill; i++) {
        var idx = (waveHead - waveFill + i + WAVE_N * 2) % WAVE_N;
        var x = (i / (WAVE_N - 1)) * w;
        var yy = ty(waveBuf[idx]);
        if (i === 0) waveCtx.moveTo(x, yy); else waveCtx.lineTo(x, yy);
    }
    waveCtx.strokeStyle = zoneColor(player.glucose);
    waveCtx.lineWidth = 2.2 * d;
    waveCtx.lineJoin = "round";
    waveCtx.stroke();

    var hx = ((waveFill - 1) / (WAVE_N - 1)) * w;
    waveCtx.beginPath();
    waveCtx.arc(hx, ty(player.glucose), 3.2 * d, 0, 6.284);
    waveCtx.fillStyle = zoneColor(player.glucose);
    waveCtx.fill();
}

function zoneColor(g) {
    if (g < TUNE.hypo) return "#ff6b6b";
    if (g > TUNE.hyper) return "#ffc454";
    return "#6ce7a8";
}

function progressOf(r) {
    if (r.finished) return 1e9 - r.finishMs;
    if (r.dnf) return -1;
    return r.y;
}

function placeOf(r) {
    var better = 1;
    for (var i = 0; i < runners.length; i++) {
        if (runners[i] !== r && progressOf(runners[i]) > progressOf(r)) better++;
    }
    return better;
}

function updateHUD(dt) {
    var g = player.glucose;

    el.place.textContent = placeOf(player) + "/" + runners.length;
    el.dist.textContent = player.finished ? "0m" :
        Math.max(0, Math.round((COURSE_LEN - player.y) * 0.5)) + "m";
    el.time.textContent = raceTime.toFixed(1);
    el.floor.innerHTML = "FLOOR <b>" + (Math.round(player.z / FLOOR_H) + 1) + "</b>";

    var sp = player.sprintT > 0 ? player.sprintT / TUNE.sprintDur
        : (player.sprintCd > 0 ? 1 - player.sprintCd / TUNE.sprintCd : 1);
    el.sprint.style.width = (sp * 100).toFixed(1) + "%";
    el.sprint.className = player.sprintT > 0 ? "hot" : "";

    el.monVal.textContent = Math.round(g);
    el.monVal.style.color = zoneColor(g);
    el.monZone.style.color = zoneColor(g);
    el.monZone.textContent = g < TUNE.hypo ? "HYPO — EAT NOW"
        : g > TUNE.hyper ? "SPIKED" : "IN RANGE";

    /* Inventory. The item being eaten has already been shifted OUT of
       player.inventory, so slot 0 shows it while it's in your mouth and
       everything else slides up behind it. Rebuilt only when the
       rendered content actually changes -- innerHTML at 60Hz for a
       two-slot panel is a lot of garbage for no reason. */
    var display = player.eating ? [player.eating].concat(player.inventory) : player.inventory;
    for (var i = 0; i < 2; i++) {
        var slot = el.slots[i];
        var key = display[i];

        if (!key) {
            if (slot.dataset.sig !== "empty") {
                slot.dataset.sig = "empty";
                slot.className = "gd-slot empty";
                slot.innerHTML = '<span class="key">' + (i === 0 ? "SPACE" : "NEXT") + '</span>';
            }
            continue;
        }
        var fd = FOODS[key];
        var eating = (i === 0 && player.eating === key);
        var pct = eating ? Math.min(100, (player.eatT / fd.eat) * 100) : 0;
        var sig = key + (eating ? "|e" : "");
        if (slot.dataset.sig !== sig) {
            slot.dataset.sig = sig;
            slot.className = "gd-slot gi-" + fd.gi;
            slot.innerHTML =
                '<span class="ic">' + fd.icon + '</span>' +
                '<span class="tx"><span class="nm">' + fd.name + '</span>' +
                '<span class="gi" style="color:' + GI_COLOR[fd.gi] + '">' +
                (eating ? "EATING…" : fd.gi.toUpperCase() + " GI") + '</span></span>' +
                '<span class="key">' + (i === 0 ? "SPACE" : "NEXT") + '</span>' +
                '<span class="eatbar"></span>';
        }
        if (eating) {
            var bar = slot.querySelector(".eatbar");
            if (bar) bar.style.width = pct.toFixed(0) + "%";
        }
    }

    // warnings
    var wtxt = "", wcol = "";
    if (player.dnf) { wtxt = "CRASHED"; wcol = "#ff6b6b"; }
    else if (g < 40) { wtxt = "CRITICAL — EAT"; wcol = "#ff6b6b"; }
    else if (g < TUNE.hypo) { wtxt = "LOW · SLOWING"; wcol = "#ff6b6b"; }
    else if (g > 280) { wtxt = "WAY TOO HIGH"; wcol = "#ffc454"; }
    else if (g > TUNE.hyper) { wtxt = "SPIKED"; wcol = "#ffc454"; }
    el.warn.textContent = wtxt;
    el.warn.style.color = wcol;
    el.warn.className = wtxt ? (g < 45 || player.dnf ? "on pulse" : "on") : "";

    /* --- the exposure mechanic ---
       Below 70: saturation and light drain out and the world closes in.
       Above 200: the sensor blows out and you lose the course. Highs
       are visual-only by design -- no DNF above range. */
    var hypoT = Math.max(0, Math.min(1, (TUNE.hypo - g) / TUNE.hypo));
    var hyperT = Math.max(0, Math.min(1, (g - TUNE.hyper) / 130));
    /* Retuned for the light mall. The old values assumed a dark scene:
       a white overlay at 0.55 on an already-white corridor is an instant
       featureless whiteout with no information left in it. The blowout
       now comes mostly from saturation and contrast -- the colourful
       storefronts go neon and smear -- with only a light wash of white
       on top. Hypo is the opposite: draining a BRIGHT scene to grey and
       closing a dark vignette over it reads far harder than it did on
       black, so it can afford to be gentler. */
    var sat = (1 - 0.90 * hypoT) * (1 + 1.15 * hyperT);
    var bri = (1 - 0.55 * hypoT) * (1 + 0.26 * hyperT);
    var con = 1 - 0.30 * hypoT + 0.20 * hyperT;
    canvas.style.filter = "saturate(" + sat.toFixed(3) + ") brightness(" + bri.toFixed(3) +
        ") contrast(" + con.toFixed(3) + ")";
    el.blowout.style.opacity = (hyperT * 0.30).toFixed(3);
    el.vignette.style.opacity = (hypoT * 0.95).toFixed(3);

    // wave sampling
    waveAcc += dt;
    while (waveAcc >= 1 / WAVE_HZ) { waveAcc -= 1 / WAVE_HZ; pushWave(g); }
    drawWave();

    updateRail();
}

function updateRail() {
    for (var i = 0; i < runners.length; i++) {
        var r = runners[i];
        var pip = railPips[i];
        if (!pip) continue;
        var t = Math.max(0, Math.min(1, r.y / COURSE_LEN));
        pip.style.top = ((1 - t) * 100).toFixed(2) + "%";
        pip.style.background = r.color;
        pip.className = "gd-pip" + (r.isPlayer ? " self" : "") +
            (Math.abs(r.z - player.z) > FLOOR_H * 0.75 ? " other-floor" : "");
        pip.style.opacity = r.dnf ? 0.25 : "";
    }
}

function toast(text, color) {
    el.toast.textContent = text;
    el.toast.style.color = color || "#eef2f7";
    el.toast.className = "on";
    if (toastTimer) clearTracked(toastTimer);
    toastTimer = trackTimeout(function () { el.toast.className = ""; }, 1000);
}


/* ===================================================
     AUDIO — tiny, gesture-gated
   ===================================================
   Mobile browsers refuse audio without a user gesture, and
   PROJECT_MEMORY records a still-open mobile audio-freeze bug in Gyro
   Space. So: context created on the Start click, nothing autoplays,
   every call is wrapped. */
var audioCtx = null;

function initAudio() {
    if (audioCtx) return;
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { audioCtx = null; }
}

function tone(f0, f1, type, dur, vol) {
    if (!audioCtx) return;
    try {
        var o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = type; o.connect(g); g.connect(audioCtx.destination);
        o.frequency.setValueAtTime(f0, audioCtx.currentTime);
        o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), audioCtx.currentTime + dur);
        g.gain.setValueAtTime(vol, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        o.start(); o.stop(audioCtx.currentTime + dur);
    } catch (e) { /* audio is never worth breaking a frame over */ }
}

function beep(foodKey) {
    var gi = FOODS[foodKey].gi;
    if (gi === "high") tone(680, 1180, "square", 0.10, 0.05);
    else if (gi === "med") tone(520, 760, "triangle", 0.12, 0.05);
    else tone(380, 620, "sine", 0.16, 0.06);
}


/* ===================================================
     INPUT
   ===================================================
   Arrow keys, per the concept. WASD aliased because it costs one line
   and half the group will reach for it.

   Double-tap forward = sprint. Tracked as an edge, not a held state:
   the second press ARMS one sprint, it doesn't hold one open. */

var keys = {};
var lastFwdTap = -1e9;
var sprintArmed = false;
var eatEdge = false;

function isFwd(c) { return c === "ArrowUp" || c === "KeyW"; }

function onKeyDown(e) {
    var c = e.code;
    if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].indexOf(c) >= 0) e.preventDefault();

    if (phase === "menu" && (c === "Enter" || c === "Space")) { startRace(); return; }
    if (phase === "done" && (c === "Enter" || c === "KeyR")) { startRace(); return; }
    if (c === "KeyP") { togglePause(); return; }
    if (c === "KeyR" && phase === "racing") { startRace(); return; }

    if (keys[c]) return;                     // ignore auto-repeat
    keys[c] = true;

    if (isFwd(c)) {
        var now = performance.now();
        if (now - lastFwdTap < TUNE.dblTapMs) sprintArmed = true;
        lastFwdTap = now;
    }
    if (c === "Space") eatEdge = true;
}

function onKeyUp(e) { keys[e.code] = false; }

function playerInput() {
    var steer = 0;
    if (keys.ArrowLeft || keys.KeyA) steer -= 1;
    if (keys.ArrowRight || keys.KeyD) steer += 1;
    var inp = {
        throttle: !!(keys.ArrowUp || keys.KeyW),
        brake: !!(keys.ArrowDown || keys.KeyS),
        steer: steer,
        sprint: sprintArmed,
        eat: eatEdge
    };
    sprintArmed = false;
    eatEdge = false;
    return inp;
}


/* ===================================================
     RACE FLOW
   =================================================== */

var NPC_NAMES = ["RICO", "MABEL", "DEX"];

function setupRunners() {
    runners = [];
    var myName = (MP.selfName || MP.identity().name || "YOU").toUpperCase().slice(0, 12);
    player = makeRunner(myName, MP.selfColor || RUNNER_COLORS[0], true);
    player.x = 0;
    runners.push(player);

    /* Easy, per the concept: a shade slower than you, jittery steering,
       and they only sprint when genuinely contested. */
    var lanes = [-6.5, 6.5, -3.2];
    for (var i = 0; i < NPC_NAMES.length; i++) {
        var n = makeRunner(NPC_NAMES[i], RUNNER_COLORS[i + 1], false);
        n.x = lanes[i];
        n.y = -1.5 - i * 0.6;
        n.lane = lanes[i] * 0.5;
        n.jitter = i * 2.1;
        n.npcSpeed = 0.95 + i * 0.02;
        n.aggression = 0.8 + i * 0.25;
        /* Two of the three head upstairs. The ground floor is a sugar
           minefield by design, so an NPC that never climbs is choosing
           between crash-y foods all race -- and it also means the player
           never sees the upper floors being used. */
        n.wantsUp = (i !== 0);
        runners.push(n);
    }

    // rail pips, one per runner, created once per race
    el.rail.innerHTML = "";
    railPips = runners.map(function (r) {
        var d = document.createElement("div");
        d.className = "gd-pip";
        d.style.background = r.color;
        el.rail.appendChild(d);
        return d;
    });
}

var raceId = 0;

function startRace() {
    initAudio();
    raceId++;
    buildCourse();
    setupRunners();
    finishOrder = [];
    raceTime = 0;
    countdownLeft = 3.1;
    waveHead = 0; waveFill = 0; waveAcc = 0;
    fullWarnAt = -1e9;
    cam.y = 0; cam.wx = centerX(0); cam.shake = 0; cam.shakeX = 0; cam.shakeY = 0;
    phase = "countdown";
    el.screen.dataset.count = "";
    hideScreen();
    for (var i = 0; i < 8; i++) pushWave(TUNE.glucoseStart);
}

/* The results delay is what lets a crash land before the board covers
   it. Keyed to raceId so restarting during that window doesn't drop a
   results screen on top of the new race. */
function endRace(reason) {
    if (phase === "done") return;
    var id = raceId;
    trackTimeout(function () {
        if (phase === "done" || id !== raceId) return;
        phase = "done";
        showResults(reason);
    }, reason === "dnf" ? 1500 : 900);
}

function togglePause() {
    if (phase === "racing") { phase = "paused"; showPause(); }
    else if (phase === "paused") { phase = "racing"; hideScreen(); }
}

function update(dt) {
    if (phase === "countdown") {
        countdownLeft -= dt;
        showCountdown();
        if (countdownLeft <= 0) { phase = "racing"; hideScreen(); tone(880, 1320, "square", 0.2, 0.08); }
        // runners hold at the line but the camera settles
        updateCamera(dt);
        return;
    }
    if (phase !== "racing") { updateCamera(dt); return; }

    raceTime += dt;

    stepRunner(player, playerInput(), dt);
    for (var i = 1; i < runners.length; i++) {
        stepRunner(runners[i], npcInput(runners[i], dt), dt);
    }
    updateCamera(dt);
}

function loop(ts) {
    gdRAF = requestAnimationFrame(loop);
    if (!lastFrame) lastFrame = ts;
    var dt = Math.min(0.05, (ts - lastFrame) / 1000);   // clamp: a tab-switch
    lastFrame = ts;                                     // must not teleport anyone

    // The menu sits over a live course rather than a black screen, so
    // the game is legible before you've pressed anything.
    update(dt);
    render();
    updateHUD(dt);
}


/* ===================================================
     SCREENS
   =================================================== */

function hideScreen() { el.screen.className = "hidden"; }

function showScreen(html) {
    el.screen.className = "";
    el.screen.innerHTML = html;
}

function showMenu() {
    showScreen(
        '<h1>Glucose Dash</h1>' +
        '<p>An ultramarathon through a three-storey mall. The clock is not your problem — ' +
        '<b>your blood sugar is</b>. It falls the whole way, faster when you sprint. ' +
        'Under 70 the world greys out. Over 200 the light blows out and you can\'t read the course. ' +
        'Hit zero and you\'re done.</p>' +
        '<p style="color:#7f8ea6">Cake gets you out of a hole right now and drops you through the floor twelve seconds later. ' +
        'The balanced shake in the centre aisle barely registers — and then holds you steady for half a minute. ' +
        'Climbing costs you speed and buys you better food.</p>' +
        '<div class="keys">' +
            '<span><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> <b>drive</b></span>' +
            '<span>double-tap <kbd>↑</kbd> <b>sprint</b> (2× burn)</span>' +
            '<span><kbd>space</kbd> <b>eat slot 1</b></span>' +
            '<span><kbd>P</kbd> pause · <kbd>R</kbd> restart</span>' +
        '</div>' +
        '<button class="gd-btn" id="gd-start">START RACE</button>'
    );
    var b = document.getElementById("gd-start");
    if (b) b.addEventListener("click", startRace, { signal: gdAbort.signal });
}

function showCountdown() {
    var n = Math.ceil(countdownLeft);
    var txt = n > 0 ? String(n) : "GO";
    if (el.screen.dataset.count === txt) return;
    el.screen.dataset.count = txt;
    showScreen('<div id="gd-count">' + txt + '</div>');
    tone(n > 0 ? 440 : 880, n > 0 ? 440 : 1320, "square", 0.12, 0.05);
}

function showPause() {
    showScreen('<h2>PAUSED</h2><div class="keys"><span><kbd>P</kbd> resume · <kbd>R</kbd> restart</span></div>');
}

function showResults(reason) {
    /* Everyone who hasn't finished gets slotted in by how far they got,
       so the board is complete the moment the player's race ends rather
       than making them watch the NPCs jog home. */
    var rest = runners.filter(function (r) { return !r.finished && !r.dnf; })
        .sort(function (a, b) { return b.y - a.y; });
    var rows = finishOrder.slice().sort(function (a, b) {
        if (a.dnf !== b.dnf) return a.dnf ? 1 : -1;
        return (a.ms || 0) - (b.ms || 0);
    });
    var board = rows.filter(function (r) { return !r.dnf; })
        .concat(rest.map(function (r) { return { name: r.name, color: r.color, ms: null, self: r.isPlayer, dnf: false, unfinished: true }; }))
        .concat(rows.filter(function (r) { return r.dnf; }));

    var tir = player.timeTotal > 0 ? Math.round(100 * player.timeInRange / player.timeTotal) : 0;
    var head = reason === "dnf"
        ? '<h2 style="color:#ff6b6b">HYPOGLYCEMIC CRASH</h2><p>You ran out of glucose at ' +
          Math.round(player.y * 0.5) + 'm of ' + Math.round(COURSE_LEN * 0.5) + 'm. Did not finish.</p>'
        : '<h2 style="color:#7af5c8">FINISHED — ' + (raceTime).toFixed(2) + 's</h2>' +
          '<p>Time in range: <b style="color:' + (tir > 70 ? "#6ce7a8" : "#ffc454") + '">' + tir + '%</b></p>';

    var html = head + '<div id="gd-results">';
    for (var i = 0; i < board.length; i++) {
        var b = board[i];
        html += '<div class="gd-row' + (b.self ? " self" : "") + (b.dnf ? " dnf" : "") + '">' +
            '<span class="pos">' + (b.dnf ? "—" : (i + 1)) + '</span>' +
            '<span class="dot" style="background:' + b.color + '"></span>' +
            '<span class="nm">' + b.name + '</span>' +
            '<span class="tm">' + (b.dnf ? "DNF" : b.ms != null ? (b.ms / 1000).toFixed(2) + "s" : "—") + '</span>' +
            '</div>';
    }
    html += '</div><button class="gd-btn" id="gd-again">RACE AGAIN</button>';
    showScreen(html);
    var again = document.getElementById("gd-again");
    if (again) again.addEventListener("click", startRace, { signal: gdAbort.signal });
}


/* ===================================================
     SIZING
   =================================================== */

function resize() {
    var r = canvas.parentNode.getBoundingClientRect();
    VIEW.dpr = Math.min(2, window.devicePixelRatio || 1);
    VIEW.w = Math.max(320, r.width);
    VIEW.h = Math.max(240, r.height);
    canvas.width = Math.round(VIEW.w * VIEW.dpr);
    canvas.height = Math.round(VIEW.h * VIEW.dpr);

    var wr = waveCanvas.getBoundingClientRect();
    waveCanvas.width = Math.round(Math.max(80, wr.width) * VIEW.dpr);
    waveCanvas.height = Math.round(Math.max(40, wr.height) * VIEW.dpr);
}


/* ===================================================
     GameInstance
   ===================================================
   The contract from GAME_PROTOTYPE_INSTRUCTIONS.md, implemented in
   full. No other game in this repo implements it and the hub links
   full pages rather than embedding -- see SCOPE.md §7. */

window.GameInstance = {
    init: function (containerId) {
        var root = document.getElementById(containerId || "gd-root");
        if (!root) return false;
        root.innerHTML = LAYOUT_HTML;
        gdAbort = new AbortController();

        canvas = root.querySelector("#gd-canvas");
        ctx = canvas.getContext("2d");
        waveCanvas = root.querySelector("#gd-wave");
        waveCtx = waveCanvas.getContext("2d");

        el = {
            stage: root.querySelector("#gd-stage"),
            blowout: root.querySelector("#gd-blowout"),
            vignette: root.querySelector("#gd-vignette"),
            place: root.querySelector("#gd-place"),
            dist: root.querySelector("#gd-dist"),
            time: root.querySelector("#gd-time"),
            warn: root.querySelector("#gd-warn"),
            toast: root.querySelector("#gd-toast"),
            rail: root.querySelector("#gd-rail"),
            floor: root.querySelector("#gd-floor"),
            sprint: root.querySelector("#gd-sprint"),
            slots: [root.querySelector("#gd-slot0"), root.querySelector("#gd-slot1")],
            monVal: root.querySelector("#gd-mon-val"),
            monZone: root.querySelector("#gd-mon-zone"),
            screen: root.querySelector("#gd-screen"),
            net: root.querySelector("#gd-net")
        };

        window.addEventListener("keydown", onKeyDown, { signal: gdAbort.signal });
        window.addEventListener("keyup", onKeyUp, { signal: gdAbort.signal });
        window.addEventListener("resize", resize, { signal: gdAbort.signal });
        window.addEventListener("blur", function () {
            if (phase === "racing") togglePause();
        }, { signal: gdAbort.signal });

        resize();

        /* Multiplayer today is exactly this much: identity, colour, and
           the ROOM SEED that decides which candidate slots are stocked.
           Nothing is broadcast yet -- see SCOPE.md §6 for the ghost /
           contested-pickup work, which needs no server change. */
        MP.connect({
            game: "glucose-dash",
            onReady: function (info) {
                mpSeed = info.seed;
                netOnline = !info.solo;
                el.net.textContent = info.solo ? "SOLO" : "ROOM " + (MP.room || "PUBLIC");
                // If the seed landed after the player already hit start,
                // re-pick the stocked slots so a room races one course.
                if (phase === "countdown") buildItems();
            },
            onStatus: function (s) {
                netOnline = (s === "online");
                el.net.textContent = netOnline ? "ROOM " + (MP.room || "PUBLIC") : "SOLO";
            }
        });

        // A course exists before Start so the menu isn't sitting on nothing.
        buildCourse();
        setupRunners();
        return true;
    },

    start: function () {
        phase = "menu";
        showMenu();
        lastFrame = 0;
        if (!gdRAF) gdRAF = requestAnimationFrame(loop);
        return true;
    },

    pause: function () { if (phase === "racing") { phase = "paused"; showPause(); } },
    resume: function () { if (phase === "paused") { phase = "racing"; hideScreen(); } },

    getState: function () {
        return {
            phase: phase,
            time: raceTime,
            glucose: player ? Math.round(player.glucose) : null,
            floor: player ? Math.round(player.z / FLOOR_H) + 1 : null,
            place: player ? placeOf(player) : null,
            runners: runners.length,
            inventory: player ? player.inventory.slice() : [],
            eating: player ? player.eating : null,
            metresLeft: player ? Math.max(0, Math.round((COURSE_LEN - player.y) * 0.5)) : null,
            timeInRangePct: player && player.timeTotal ? Math.round(100 * player.timeInRange / player.timeTotal) : null,
            finished: player ? player.finished : false,
            dnf: player ? player.dnf : false,
            online: netOnline,
            seed: mpSeed
        };
    },

    destroy: function () {
        if (gdRAF) { cancelAnimationFrame(gdRAF); gdRAF = 0; }
        GD_TIMEOUTS.forEach(clearTimeout); GD_TIMEOUTS.clear();
        GD_INTERVALS.forEach(clearInterval); GD_INTERVALS.clear();
        if (gdAbort) { gdAbort.abort(); gdAbort = null; }
        try { MP.destroy(); } catch (e) { /* never connected */ }
        if (audioCtx) { try { audioCtx.close(); } catch (e) {} audioCtx = null; }
        runners = []; items = []; stores = []; railPips = [];
        player = null; phase = "menu";
        var root = document.getElementById("gd-root");
        if (root) root.innerHTML = "";
        return true;
    }
};

if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", function () {
        window.GameInstance.init("gd-root");
        window.GameInstance.start();
    });
} else {
    window.GameInstance.init("gd-root");
    window.GameInstance.start();
}

</script>
