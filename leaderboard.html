<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboards</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        background: #000;
        color: #e0e0e0;
        font-family: 'Courier New', Courier, monospace;
        min-height: 100vh;
        padding: 30px 20px;
    }
    .container { max-width: 700px; margin: 0 auto; }
    h1 {
        color: #64c8ff;
        font-size: 28px;
        text-align: center;
        margin-bottom: 6px;
        letter-spacing: 2px;
    }
    .subtitle {
        text-align: center;
        color: #888;
        font-size: 12px;
        margin-bottom: 30px;
    }
    .filters {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        flex-wrap: wrap;
        justify-content: center;
    }
    .filters select, .filters input {
        background: rgba(100, 200, 255, 0.1);
        border: 1px solid #64c8ff;
        color: #e0e0e0;
        padding: 8px 12px;
        border-radius: 6px;
        font-family: inherit;
        font-size: 13px;
    }
    .filters input {
        text-transform: uppercase;
        letter-spacing: 1px;
    }
    table {
        width: 100%;
        border-collapse: collapse;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(100, 200, 255, 0.15);
        border-radius: 8px;
        overflow: hidden;
    }
    th {
        background: rgba(100, 200, 255, 0.1);
        color: #64c8ff;
        text-align: left;
        padding: 10px 14px;
        font-size: 12px;
        letter-spacing: 1px;
        text-transform: uppercase;
    }
    td {
        padding: 10px 14px;
        border-top: 1px solid rgba(100, 200, 255, 0.08);
        font-size: 14px;
    }
    tr:hover td { background: rgba(100, 200, 255, 0.04); }
    .rank { color: #64c8ff; font-weight: bold; width: 40px; }
    .rank.gold { color: #ffd700; }
    .rank.silver { color: #c0c0c0; }
    .rank.bronze { color: #cd7f32; }
    .score { text-align: right; font-weight: bold; }
    .empty, .loading {
        text-align: center;
        color: #666;
        padding: 40px;
    }
    .room-tag {
        display: inline-block;
        background: rgba(100, 200, 255, 0.15);
        color: #64c8ff;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 11px;
        margin-left: 6px;
    }
</style>
</head>
<body>
<div class="container">
    <h1>LEADERBOARDS</h1>
    <div class="subtitle">Best single-life survival time, in seconds</div>

    <div class="filters">
        <select id="game-filter">
            <option value="space-tracer">Space Tracer</option>
            <!-- Zombie and other games get added here once they submit
                 to the same "scores" collection with their own game id -->
        </select>
        <select id="room-filter">
            <option value="all">All rooms (global)</option>
            <option value="public">Public room only</option>
            <option value="custom">Specific room code…</option>
        </select>
        <input id="room-code-filter" type="text" placeholder="ROOM CODE" maxlength="8" style="display:none;">
    </div>

    <table>
        <thead>
            <tr>
                <th class="rank">#</th>
                <th>Player</th>
                <th>Room</th>
                <th class="score">Score</th>
            </tr>
        </thead>
        <tbody id="rows">
            <tr><td colspan="4" class="loading">Loading…</td></tr>
        </tbody>
    </table>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getFirestore, collection, query, where, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
    // Same shared config as space-tracer.html -- see firebase-config.js.
    // One file, filled in once, both pages (and future ones) import it.
    import { firebaseConfig } from "./firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    signInAnonymously(auth).catch(err => console.error("Auth failed:", err));

    const gameFilter = document.getElementById("game-filter");
    const roomFilter = document.getElementById("room-filter");
    const roomCodeFilter = document.getElementById("room-code-filter");
    const rowsEl = document.getElementById("rows");

    roomFilter.addEventListener("change", () => {
        roomCodeFilter.style.display = roomFilter.value === "custom" ? "inline-block" : "none";
        if (roomFilter.value !== "custom") loadLeaderboard();
    });
    roomCodeFilter.addEventListener("keypress", (e) => {
        if (e.key === "Enter") loadLeaderboard();
    });
    gameFilter.addEventListener("change", loadLeaderboard);

    // Firestore doesn't do "best score per player" server-side without a
    // more involved data model (a separate "best_scores" doc per player,
    // updated transactionally on write, instead of an append-only log).
    // For a 3-10 person friend group, querying the raw log and folding
    // to best-per-player client-side is simpler and fast enough — this
    // is the kind of thing worth revisiting only if the scores
    // collection grows into the thousands.
    async function loadLeaderboard() {
        rowsEl.innerHTML = '<tr><td colspan="4" class="loading">Loading…</td></tr>';

        try {
            const game = gameFilter.value;
            let constraints = [where("game", "==", game)];

            if (roomFilter.value === "public") {
                constraints.push(where("room", "==", "public"));
            } else if (roomFilter.value === "custom" && roomCodeFilter.value.trim()) {
                constraints.push(where("room", "==", roomCodeFilter.value.trim().toUpperCase()));
            }
            // "all" adds no room constraint — every score, any room.

            const q = query(
                collection(db, "scores"),
                ...constraints,
                orderBy("score", "desc"),
                limit(200) // Generous cap for the raw log; final table is folded down to one row per player below
            );

            const snap = await getDocs(q);
            const best = new Map(); // player name -> {score, room}

            snap.forEach(doc => {
                const d = doc.data();
                const existing = best.get(d.player);
                if (!existing || d.score > existing.score) {
                    best.set(d.player, { score: d.score, room: d.room });
                }
            });

            const rows = Array.from(best.entries())
                .map(([player, v]) => ({ player, score: v.score, room: v.room }))
                .sort((a, b) => b.score - a.score)
                .slice(0, 50);

            renderRows(rows);
        } catch (err) {
            console.error("Leaderboard load failed:", err);
            rowsEl.innerHTML = '<tr><td colspan="4" class="empty">Couldn\'t load scores. Check the console for details.</td></tr>';
        }
    }

    function renderRows(rows) {
        if (!rows.length) {
            rowsEl.innerHTML = '<tr><td colspan="4" class="empty">No scores yet — be the first.</td></tr>';
            return;
        }

        rowsEl.innerHTML = rows.map((r, i) => {
            let rankClass = "rank";
            if (i === 0) rankClass += " gold";
            else if (i === 1) rankClass += " silver";
            else if (i === 2) rankClass += " bronze";

            return `
                <tr>
                    <td class="${rankClass}">${i + 1}</td>
                    <td>${escapeHtml(r.player)}</td>
                    <td><span class="room-tag">${escapeHtml(r.room)}</span></td>
                    <td class="score">${r.score}</td>
                </tr>
            `;
        }).join("");
    }

    function escapeHtml(s) {
        const div = document.createElement("div");
        div.textContent = String(s);
        return div.innerHTML;
    }

    loadLeaderboard();
</script>
</body>
</html>
