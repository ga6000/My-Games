<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboards</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
        --accent: #64c8ff;
        --panel: #0d1418;
        --tab-idle: #06090b;
        --edge: rgba(100, 200, 255, 0.25);
    }
    body {
        background: #000;
        color: #e0e0e0;
        font-family: 'Courier New', Courier, monospace;
        min-height: 100vh;
        padding: 30px 16px;
    }
    .container { max-width: 700px; margin: 0 auto; }
    h1 {
        color: var(--accent);
        font-size: 28px;
        text-align: center;
        margin-bottom: 24px;
        letter-spacing: 2px;
    }

    /* Browser-style tabs: the active tab shares the panel's background and
       sits one pixel over the panel's top border, so the two read as a
       single surface. Inactive tabs are darker and sit behind it. */
    .tabs {
        display: flex;
        gap: 2px;
        padding: 0 10px;
        position: relative;
        z-index: 1;
        overflow-x: auto;
        scrollbar-width: none;
    }
    .tab {
        flex: 0 1 200px;
        min-width: 0;
        background: var(--tab-idle);
        color: #888;
        border: 1px solid var(--edge);
        border-bottom: none;
        border-radius: 10px 10px 0 0;
        padding: 10px 18px;
        font-family: inherit;
        font-size: 14px;
        letter-spacing: 1px;
        text-align: left;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        cursor: pointer;
        margin-bottom: -1px;
    }
    .tab:hover { color: #ccc; background: #0a1014; }
    .tab[aria-selected="true"] {
        background: var(--panel);
        color: var(--accent);
        border-color: var(--accent);
        border-bottom: 1px solid var(--panel);
    }
    .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -4px; }

    .panel {
        background: var(--panel);
        border: 1px solid var(--accent);
        border-radius: 0 10px 10px 10px;
        padding: 18px 16px 16px;
    }
    .subtitle {
        color: #888;
        font-size: 12px;
        margin-bottom: 14px;
    }
    table { width: 100%; border-collapse: collapse; }
    th {
        color: var(--accent);
        text-align: left;
        padding: 8px 10px;
        font-size: 12px;
        letter-spacing: 1px;
        text-transform: uppercase;
        border-bottom: 1px solid var(--edge);
    }
    td {
        padding: 10px;
        border-top: 1px solid rgba(100, 200, 255, 0.08);
        font-size: 14px;
    }
    tr:hover td { background: rgba(100, 200, 255, 0.04); }
    .rank { color: var(--accent); font-weight: bold; width: 40px; }
    .rank.gold { color: #ffd700; }
    .rank.silver { color: #c0c0c0; }
    .rank.bronze { color: #cd7f32; }
    .num { text-align: right; }
    .score { font-weight: bold; }
    .muted { color: #777; }
    .empty, .loading { text-align: center; color: #666; padding: 40px; }
</style>
</head>
<body>
<div class="container">
    <h1>LEADERBOARDS</h1>

    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="panel" id="panel" role="tabpanel">
        <div class="subtitle" id="subtitle"></div>
        <table>
            <thead>
                <tr>
                    <th class="rank">#</th>
                    <th>Player</th>
                    <th class="num" id="score-head">Best</th>
                    <th class="num">Runs</th>
                    <th class="num">Set</th>
                </tr>
            </thead>
            <tbody id="rows">
                <tr><td colspan="5" class="loading">Loading…</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- A module script, unlike every game page: this page exists only to read
     Firestore, so it has no file:// mode to preserve. -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getFirestore, collection, query, where, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
    import { firebaseConfig } from "./firebase-config.js";

    // One tab per game. `id` is the `game` field the game writes — Gyro Space
    // still submits as "space-tracer", its old name, so that is what matches.
    // Add a game here once it calls LB.submit (or writes to "scores" itself).
    const GAMES = [
        // Zombie's score is a run score since 2026-09-19 (kills, revives,
        // round reached, silos filled; a win adds a bonus and doubles it) --
        // see runScoreFor() in zombie/zombie-game.js.
        { id: "zombie", title: "Zombie", subtitle: "Best run score: kills, revives, rounds and silos. Escaping doubles it",
          scoreHead: "Score", fmt: s => s.toLocaleString("en-US") },
        { id: "space-tracer", title: "Gyro Space", subtitle: "Best single-life survival time, one row per player",
          scoreHead: "Time", fmt: s => s + "s" },
    ];

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    // Awaited before the first read, in case the rules require auth for
    // reads. A failed sign-in still lets the read try.
    const authReady = signInAnonymously(getAuth(app)).catch(err => console.error("Auth failed:", err));

    const tabsEl = document.getElementById("tabs");
    const subtitleEl = document.getElementById("subtitle");
    const scoreHeadEl = document.getElementById("score-head");
    const rowsEl = document.getElementById("rows");

    const cache = new Map();   // game id -> Promise<rows>
    let active = null;

    for (const g of GAMES) {
        const b = document.createElement("button");
        b.className = "tab";
        b.id = "tab-" + g.id;
        b.setAttribute("role", "tab");
        b.textContent = g.title;
        b.title = g.title;
        b.addEventListener("click", () => select(g.id));
        tabsEl.appendChild(b);
    }
    tabsEl.addEventListener("keydown", e => {
        if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
        const i = GAMES.findIndex(g => g.id === active);
        const next = GAMES[(i + (e.key === "ArrowRight" ? 1 : GAMES.length - 1)) % GAMES.length];
        select(next.id);
        document.getElementById("tab-" + next.id).focus();
    });

    // The selected tab lives in the URL hash, so leaderboard.html#space-tracer
    // opens straight onto that game and a reload keeps your place.
    function select(id) {
        const game = GAMES.find(g => g.id === id) || GAMES[0];
        active = game.id;
        for (const g of GAMES) {
            const b = document.getElementById("tab-" + g.id);
            const on = g.id === game.id;
            b.setAttribute("aria-selected", String(on));
            b.tabIndex = on ? 0 : -1;
        }
        document.getElementById("panel").setAttribute("aria-labelledby", "tab-" + game.id);
        if (location.hash.slice(1) !== game.id) history.replaceState(null, "", "#" + game.id);
        subtitleEl.textContent = game.subtitle;
        scoreHeadEl.textContent = game.scoreHead;
        load(game);
    }

    async function load(game) {
        rowsEl.innerHTML = '<tr><td colspan="5" class="loading">Loading…</td></tr>';
        if (!cache.has(game.id)) cache.set(game.id, fetchBest(game.id));
        try {
            const rows = await cache.get(game.id);
            if (active === game.id) renderRows(game, rows);
        } catch (err) {
            cache.delete(game.id);   // let the next click retry
            console.error("Leaderboard load failed:", err);
            if (active === game.id) {
                rowsEl.innerHTML = '<tr><td colspan="5" class="empty">Couldn\'t load scores. Check the console for details.</td></tr>';
            }
        }
    }

    // Every run is its own document (an append-only log). This reads the
    // game's whole log and folds it to one row per player client-side, which
    // is also what makes the run count possible. Rooms are deliberately
    // ignored: public, private and hub rooms all count toward one board.
    //
    // Only an equality filter, no orderBy, so this needs no composite index.
    // The cap is a runaway guard — a friend group will not get near it.
    async function fetchBest(gameId) {
        await authReady;
        const snap = await getDocs(query(collection(db, "scores"), where("game", "==", gameId), limit(5000)));
        const best = new Map();   // player -> { score, runs, at }
        snap.forEach(doc => {
            const d = doc.data();
            const score = Number(d.score);
            if (!isFinite(score)) return;
            const player = String(d.player || "Anonymous");
            const at = d.timestamp && d.timestamp.toDate ? d.timestamp.toDate() : null;
            const cur = best.get(player);
            if (!cur) {
                best.set(player, { score, runs: 1, at });
            } else {
                cur.runs++;
                if (score > cur.score) { cur.score = score; cur.at = at; }
            }
        });
        return Array.from(best, ([player, v]) => ({ player, ...v }))
            // Ties go to whoever got there first.
            .sort((a, b) => (b.score - a.score) || ((a.at ? a.at.getTime() : Infinity) - (b.at ? b.at.getTime() : Infinity)))
            .slice(0, 50);
    }

    function renderRows(game, rows) {
        if (!rows.length) {
            rowsEl.innerHTML = '<tr><td colspan="5" class="empty">No scores yet — be the first.</td></tr>';
            return;
        }
        rowsEl.innerHTML = rows.map((r, i) => {
            const medal = ["gold", "silver", "bronze"][i] || "";
            return `
                <tr>
                    <td class="rank ${medal}">${i + 1}</td>
                    <td>${escapeHtml(r.player)}</td>
                    <td class="num score">${escapeHtml(game.fmt(r.score))}</td>
                    <td class="num muted">${r.runs}</td>
                    <td class="num muted">${r.at ? r.at.toLocaleDateString(undefined, { month: "short", day: "numeric" }) : "—"}</td>
                </tr>
            `;
        }).join("");
    }

    function escapeHtml(s) {
        const div = document.createElement("div");
        div.textContent = String(s);
        return div.innerHTML;
    }

    window.addEventListener("hashchange", () => {
        const id = location.hash.slice(1);
        if (id && id !== active) select(id);
    });
    select(location.hash.slice(1));
</script>
</body>
</html>
