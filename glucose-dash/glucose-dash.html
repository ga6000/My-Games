<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Glucose Dash</title>
<style>
    /* ===================================================
         GLUCOSE DASH — styles
       ===================================================
       The exposure/desaturation filter is applied to #gd-canvas ONLY,
       never to the HUD. Blowing out the whole screen reads better for
       about two seconds and then becomes unfair -- you must always be
       able to read your own glucose, especially when it's the reason
       you can't see anything else. */

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
        width: 100%; height: 100%;
        background: #08090d;
        overflow: hidden;
        font-family: "Segoe UI", Tahoma, sans-serif;
        color: #eef2f7;
        -webkit-user-select: none; user-select: none;
    }

    #gd-root { position: fixed; inset: 0; }

    #gd-stage { position: absolute; inset: 0; overflow: hidden; }

    #gd-canvas {
        position: absolute; inset: 0;
        width: 100%; height: 100%;
        display: block;
        /* driven per-frame from the glucose value */
        filter: saturate(1) brightness(1) contrast(1);
    }

    /* Hyper: light floods the sensor. Hypo: the world greys out and
       closes in. Two overlays rather than one so they can run at the
       same time during a fast swing without fighting each other. */
    #gd-blowout {
        position: absolute; inset: 0; pointer-events: none;
        background: #fffdf4; opacity: 0; mix-blend-mode: screen;
    }
    #gd-vignette {
        position: absolute; inset: 0; pointer-events: none; opacity: 0;
        background: radial-gradient(ellipse at 50% 58%,
            rgba(0,0,0,0) 28%, rgba(4,6,10,0.55) 62%, rgba(2,3,6,0.94) 100%);
    }

    /* ---- top bar ---- */
    #gd-top {
        position: absolute; top: 0; left: 0; right: 0;
        display: flex; justify-content: center; gap: 34px;
        padding: 12px 18px calc(12px + env(safe-area-inset-top, 0px));
        pointer-events: none;
        background: linear-gradient(180deg, rgba(255,255,255,0.92), rgba(255,255,255,0));
    }
    .gd-stat { text-align: center; min-width: 96px; }
    .gd-stat .k {
        font-size: 10px; letter-spacing: 2.4px; text-transform: uppercase;
        color: #6a7690; font-weight: 800;
    }
    .gd-stat .v {
        font-size: 26px; font-weight: 800; line-height: 1.15;
        font-variant-numeric: tabular-nums;
        color: #1d2534;
        text-shadow: 0 1px 0 rgba(255,255,255,0.9);
    }

    /* ---- centre warning ---- */
    #gd-warn {
        position: absolute; top: 20%; left: 0; right: 0;
        text-align: center; pointer-events: none;
        font-size: 30px; font-weight: 900; letter-spacing: 4px;
        opacity: 0; transition: opacity 160ms linear;
        text-shadow: 0 0 26px currentColor, 0 3px 12px rgba(0,0,0,0.85);
    }
    #gd-warn.on { opacity: 1; }
    #gd-warn { -webkit-text-stroke: 3px rgba(255,255,255,0.85); paint-order: stroke fill; }
    @keyframes gdPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    #gd-warn.pulse { animation: gdPulse 720ms ease-in-out infinite; }

    /* ---- bottom-left: floor + sprint ---- */
    #gd-left {
        position: absolute; left: 18px; bottom: calc(18px + env(safe-area-inset-bottom, 0px));
        pointer-events: none; display: flex; flex-direction: column; gap: 10px;
    }
    #gd-floor {
        font-size: 12px; font-weight: 800; letter-spacing: 2px;
        color: #2f3a52;
        text-shadow: 0 1px 0 rgba(255,255,255,0.85), 0 0 10px rgba(255,255,255,0.9);
    }
    #gd-floor b { color: #b5651d; font-size: 17px; }
    #gd-sprint-wrap {
        width: 150px; height: 9px; border-radius: 5px;
        background: rgba(28,34,48,0.18);
        border: 1px solid rgba(28,34,48,0.26); overflow: hidden;
        box-shadow: 0 0 0 1px rgba(255,255,255,0.5);
    }
    #gd-sprint {
        height: 100%; width: 100%;
        background: linear-gradient(90deg, #12b886, #38d6ff);
        transition: background 140ms linear;
    }
    #gd-sprint.hot { background: linear-gradient(90deg, #f4453f, #f59f00); }
    #gd-sprint-label {
        font-size: 9px; letter-spacing: 2px; color: #46536e; font-weight: 800;
        text-shadow: 0 1px 0 rgba(255,255,255,0.8);
    }

    /* ---- progress rail (left edge) ---- */
    #gd-rail {
        position: absolute; left: 18px; top: 22%; bottom: 22%;
        width: 8px; border-radius: 4px; pointer-events: none;
        background: rgba(28,34,48,0.16);
        border: 1px solid rgba(28,34,48,0.24);
        box-shadow: 0 0 0 1px rgba(255,255,255,0.5);
    }
    .gd-pip {
        position: absolute; left: 50%; width: 16px; height: 16px;
        margin-left: -8px; margin-top: -8px; border-radius: 50%;
        border: 2px solid rgba(0,0,0,0.55);
        box-shadow: 0 0 8px rgba(0,0,0,0.6);
    }
    .gd-pip.self { width: 20px; height: 20px; margin-left: -10px; margin-top: -10px;
        border-color: #fff; z-index: 3; }
    .gd-pip.other-floor { opacity: 0.45; }

    /* ---- bottom-right: inventory over the monitor ---- */
    #gd-corner {
        position: absolute; right: 18px;
        bottom: calc(18px + env(safe-area-inset-bottom, 0px));
        display: flex; flex-direction: column; align-items: stretch; gap: 8px;
        pointer-events: none;
    }

    #gd-inv { display: flex; gap: 8px; }
    .gd-slot {
        flex: 1; height: 62px; border-radius: 10px; position: relative;
        background: rgba(16,20,30,0.86);
        border: 1px solid rgba(255,255,255,0.18);
        box-shadow: 0 4px 16px rgba(30,36,50,0.28);
        display: flex; align-items: center; gap: 8px; padding: 0 10px;
        overflow: hidden;
    }
    .gd-slot.empty { border-style: dashed; opacity: 0.42; }
    .gd-slot .ic { font-size: 24px; line-height: 1; flex: none; }
    .gd-slot .tx {
        min-width: 0; flex: 1; display: flex; flex-direction: column;
        justify-content: center; gap: 2px; overflow: hidden;
    }
    .gd-slot .nm {
        font-size: 10.5px; font-weight: 700; white-space: nowrap;
        overflow: hidden; text-overflow: ellipsis; line-height: 1.2;
    }
    .gd-slot .gi {
        font-size: 8.5px; letter-spacing: 1.4px; font-weight: 800;
        white-space: nowrap; line-height: 1.2;
    }
    .gd-slot .key {
        position: absolute; top: 4px; right: 6px; font-size: 8px;
        letter-spacing: 1px; color: #6f8098; font-weight: 800;
    }
    .gd-slot .eatbar {
        position: absolute; left: 0; bottom: 0; height: 4px; width: 0%;
        background: #7af5c8;
    }
    .gd-slot.gi-high { border-color: rgba(255,107,107,0.55); }
    .gd-slot.gi-med  { border-color: rgba(255,196,84,0.55); }
    .gd-slot.gi-low  { border-color: rgba(108,231,168,0.55); }

    #gd-monitor {
        width: 268px; border-radius: 12px; padding: 9px 11px 8px;
        background: rgba(14,18,28,0.90);
        border: 1px solid rgba(255,255,255,0.18);
        box-shadow: 0 10px 30px rgba(30,36,50,0.35);
    }
    #gd-mon-head {
        display: flex; align-items: baseline; justify-content: space-between;
        margin-bottom: 5px;
    }
    #gd-mon-title {
        font-size: 9px; letter-spacing: 2.2px; color: #7f8ea6; font-weight: 800;
    }
    #gd-mon-val {
        font-size: 27px; font-weight: 900; line-height: 1;
        font-variant-numeric: tabular-nums;
    }
    #gd-mon-unit { font-size: 9px; color: #7f8ea6; font-weight: 700; margin-left: 3px; }
    #gd-wave { display: block; width: 100%; height: 74px; border-radius: 6px; }
    #gd-mon-zone {
        margin-top: 4px; font-size: 9px; letter-spacing: 2px; font-weight: 800;
        text-align: right;
    }

    /* ---- full-screen panels ---- */
    #gd-screen {
        position: absolute; inset: 0; display: flex;
        flex-direction: column; align-items: center; justify-content: center;
        gap: 16px; text-align: center; padding: 24px;
        background: radial-gradient(ellipse at 50% 40%, rgba(18,24,38,0.90), rgba(4,6,11,0.97));
        backdrop-filter: blur(2px);
    }
    #gd-screen.hidden { display: none; }
    #gd-screen h1 {
        font-size: clamp(34px, 7vw, 62px); font-weight: 900; letter-spacing: -1px;
        background: linear-gradient(92deg, #ff8fa3, #ffd166 45%, #7af5c8);
        -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    #gd-screen h2 { font-size: 22px; font-weight: 800; letter-spacing: 1px; }
    #gd-screen p { max-width: 620px; color: #a9b8ce; font-size: 14px; line-height: 1.65; }
    #gd-screen .keys {
        display: flex; flex-wrap: wrap; gap: 10px 20px; justify-content: center;
        font-size: 12.5px; color: #94a5bd;
    }
    #gd-screen .keys b { color: #ffd479; }
    kbd {
        display: inline-block; padding: 2px 7px; border-radius: 5px;
        background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.20);
        border-bottom-width: 2px; font-family: inherit; font-size: 11px; font-weight: 700;
    }
    .gd-btn {
        pointer-events: auto; cursor: pointer;
        padding: 13px 34px; border-radius: 10px; border: none;
        font-family: inherit; font-size: 15px; font-weight: 800; letter-spacing: 1.5px;
        color: #08090d; background: linear-gradient(92deg, #ffd166, #7af5c8);
        box-shadow: 0 8px 26px rgba(122,245,200,0.24);
    }
    .gd-btn:hover { filter: brightness(1.08); }
    .gd-btn.ghost {
        background: transparent; color: #a9b8ce;
        border: 1px solid rgba(255,255,255,0.22); box-shadow: none;
    }

    #gd-count {
        font-size: clamp(72px, 18vw, 190px); font-weight: 900; line-height: 1;
        color: #ffd166; text-shadow: 0 0 60px rgba(255,209,102,0.45);
    }

    #gd-results { width: min(560px, 92vw); display: flex; flex-direction: column; gap: 5px; }
    .gd-row {
        display: flex; align-items: center; gap: 12px;
        padding: 9px 13px; border-radius: 9px;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.09);
        font-size: 14px;
    }
    .gd-row.self { background: rgba(122,245,200,0.11); border-color: rgba(122,245,200,0.42); }
    .gd-row .pos { width: 30px; font-weight: 900; color: #ffd479; }
    .gd-row .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
    .gd-row .nm { flex: 1; text-align: left; font-weight: 700; }
    .gd-row .tm { font-variant-numeric: tabular-nums; color: #a9b8ce; }
    .gd-row.dnf .tm { color: #ff6b6b; font-weight: 800; }

    #gd-net {
        position: absolute; top: 10px; right: 14px; font-size: 9px;
        letter-spacing: 1.8px; font-weight: 800; color: #8b97ab; pointer-events: none;
    }

    #gd-toast {
        position: absolute; left: 50%; bottom: 24%; transform: translateX(-50%);
        font-size: 15px; font-weight: 800; letter-spacing: 2px;
        opacity: 0; transition: opacity 200ms linear; pointer-events: none;
        -webkit-text-stroke: 3px rgba(255,255,255,0.85); paint-order: stroke fill;
        text-shadow: 0 2px 12px rgba(255,255,255,0.7);
    }
    #gd-toast.on { opacity: 1; }

    @media (max-width: 720px) {
        #gd-monitor { width: 210px; }
        .gd-slot { height: 52px; }
        .gd-slot .nm { font-size: 9.5px; }
        #gd-top { gap: 16px; }
        .gd-stat .v { font-size: 20px; }
        .gd-stat { min-width: 64px; }
    }
</style>
</head>
<body>

<div id="gd-root"></div>

<script src="../shared/mp-core.js"></script>
<script>
"use strict";
/* ===================================================
     GLUCOSE DASH
   ===================================================
   An ultramarathon footrace through a three-storey mall where the
   resource you're managing is blood glucose, not stamina.

   Read glucose-dash/SCOPE.md before retuning anything -- it records
   which numbers were decided in the concept conversation and which
   ones I picked to make the thing playable.

   Everything below lives inside one IIFE-free top-level scope on
   purpose (matching every other game in this repo), but every name is
   prefixed or generic enough to survive scripts/check-global-collisions.js
   alongside shared/mp-core.js, which exposes exactly one global (MP).
*/


/* ===================================================
     BOOT & LIFECYCLE
   ===================================================
   Root CLAUDE.md hard constraint: every timer goes through
   trackTimeout/trackInterval and every listener through ONE
   AbortController, so destroy() can actually tear an instance down.

   This is also the only game in the repo that implements
   window.GameInstance. PROJECT_MEMORY.md records that whether the hub
   will ever embed games is UNDECIDED -- the hub links full pages today.
   This is here because it was cheap while the code was fresh, not
   because embedding is assumed. */

var GD_TIMEOUTS = new Set();
var GD_INTERVALS = new Set();
var gdAbort = null;
var gdRAF = 0;

function trackTimeout(fn, ms) {
    var id = setTimeout(function () { GD_TIMEOUTS.delete(id); fn(); }, ms);
    GD_TIMEOUTS.add(id);
    return id;
}
function trackInterval(fn, ms) {
    var id = setInterval(fn, ms);
    GD_INTERVALS.add(id);
    return id;
}
function clearTracked(id) {
    clearTimeout(id); clearInterval(id);
    GD_TIMEOUTS.delete(id); GD_INTERVALS.delete(id);
}

/* The whole UI is built from this template rather than sitting in the
   body, so init(containerId) can put a working instance into any
   element. Standalone, #gd-root is that element. */
var LAYOUT_HTML =
'<div id="gd-stage">' +
    '<canvas id="gd-canvas"></canvas>' +
    '<div id="gd-blowout"></div>' +
    '<div id="gd-vignette"></div>' +
'</div>' +
'<div id="gd-net">SOLO</div>' +
'<div id="gd-top">' +
    '<div class="gd-stat"><div class="k">Place</div><div class="v" id="gd-place">—</div></div>' +
    '<div class="gd-stat"><div class="k">To Finish</div><div class="v" id="gd-dist">—</div></div>' +
    '<div class="gd-stat"><div class="k">Time</div><div class="v" id="gd-time">0.0</div></div>' +
'</div>' +
'<div id="gd-warn"></div>' +
'<div id="gd-toast"></div>' +
'<div id="gd-rail"></div>' +
'<div id="gd-left">' +
    '<div id="gd-floor">FLOOR <b>1</b></div>' +
    '<div id="gd-sprint-label">SPRINT</div>' +
    '<div id="gd-sprint-wrap"><div id="gd-sprint"></div></div>' +
'</div>' +
'<div id="gd-corner">' +
    '<div id="gd-inv">' +
        '<div class="gd-slot empty" id="gd-slot0"><span class="key">SPACE</span></div>' +
        '<div class="gd-slot empty" id="gd-slot1"><span class="key">NEXT</span></div>' +
    '</div>' +
    '<div id="gd-monitor">' +
        '<div id="gd-mon-head">' +
            '<span id="gd-mon-title">BLOOD GLUCOSE</span>' +
            '<span><span id="gd-mon-val">135</span><span id="gd-mon-unit">mg/dL</span></span>' +
        '</div>' +
        '<canvas id="gd-wave"></canvas>' +
        '<div id="gd-mon-zone">IN RANGE</div>' +
    '</div>' +
'</div>' +
'<div id="gd-screen"></div>';


/* ===================================================
     TUNING — every balance number lives here
   =================================================== */

var TUNE = {
    /* --- movement: car-style, momentum-carrying --- */
    maxSpeed:      27,     // units/sec on the flat, no sprint
    accel:         34,
    brake:         48,
    reverseMax:     8,
    drag:          0.55,   // proportional, per second
    turnRate:      2.55,   // rad/sec at or above turnSpeedRef
    turnSpeedRef:  11,     // below this you steer proportionally worse
    grip:          6.2,    // how fast velocity realigns to heading (lower = slidier)
    wallLoss:      0.45,   // fraction of speed shed on a wall scrape

    /* --- sprint: a burst, not a new cap (concept decision) --- */
    sprintMult:    1.36,
    sprintAccel:   1.55,
    sprintDur:     2.5,
    sprintCd:      3.2,
    dblTapMs:      280,

    /* --- eating: throttle cap drops, steering untouched --- */
    eatSpeedMult:  0.55,

    /* --- ramps: slow up, slightly quick down --- */
    rampUpMult:    0.60,
    rampDownMult:  1.06,
    rampAlign:     7.0,    // how hard you're auto-aligned onto the stairs

    /* --- glucose --- */
    glucoseStart:  145,
    /* Swept against the doubled course. The pair that matters is this
       and the food density in buildItems -- raising density alone made
       every route safe and killed the gamble, lowering it alone
       collapsed the NPC field. 2.0 with two-candidate chunks is where
       ignoring food still always kills you, the ground-floor route is a
       real 3-in-8 gamble, and climbing is both faster and safer. */
    baseDecay:     2.0,    // mg/dL per second while running
    sprintDecayX:  2.0,    // concept decision: sprint burns 2x
    hypo:          70,
    hyper:         200,
    glucoseMax:    420,
    bonkFloor:     0.40,   // top-speed multiplier at glucose 0
    bonkCurve:     1.4,    // >1 makes the last stretch of a bonk a cliff, not a slope
    rangeBonus:    0.12,   // top-speed bonus for being comfortably fuelled

    /* --- pickups --- */
    pickupR:       2.7,
    invSize:       2
};

/* Food curves.
   peak/rise  : total mg/dL delivered, and over how many seconds
   crash/crashDur : insulin overshoot AFTER absorption (high-GI only)
   hold/holdX : low-GI only -- multiplies baseline decay for `hold` sec
   eat        : seconds locked into the slow-down while eating

   The eat times are the balance lever that makes high-GI worth taking
   at all: candy is a 0.7s window, an oat bowl is 3.1s. Without that,
   high-GI food is strictly dominated. See SCOPE.md §3.2. */
var FOODS = {
    candy:    { icon: "🍬", name: "Candy Bag",     gi: "high", peak: 78, rise: 1.5, crash: 88,  crashDur: 7.5, eat: 0.7 },
    soda:     { icon: "🥤", name: "Big Soda",      gi: "high", peak: 98, rise: 1.8, crash: 114, crashDur: 8.0, eat: 0.9 },
    choc:     { icon: "🍫", name: "Chocolate Bar", gi: "high", peak: 82, rise: 2.0, crash: 86,  crashDur: 8.0, eat: 1.0 },
    donut:    { icon: "🍩", name: "Donut",         gi: "high", peak: 86, rise: 2.2, crash: 96,  crashDur: 8.5, eat: 1.1 },
    cake:     { icon: "🍰", name: "Cake Slice",    gi: "high", peak: 92, rise: 2.4, crash: 104, crashDur: 9.0, eat: 1.3 },

    sandwich: { icon: "🥪", name: "Sandwich",      gi: "med",  peak: 44, rise: 4.2, eat: 1.9 },
    pizza:    { icon: "🍕", name: "Pizza Slice",   gi: "med",  peak: 48, rise: 4.6, eat: 2.1 },
    noodles:  { icon: "🍜", name: "Noodle Bowl",   gi: "med",  peak: 46, rise: 4.8, eat: 2.2 },
    burrito:  { icon: "🌯", name: "Burrito",       gi: "med",  peak: 52, rise: 5.0, eat: 2.3 },

    nuts:     { icon: "🥜", name: "Trail Mix",     gi: "low",  peak: 22, rise: 5.5, hold: 26, holdX: 0.55, eat: 1.6 },
    salad:    { icon: "🥗", name: "Grain Salad",   gi: "low",  peak: 26, rise: 6.4, hold: 30, holdX: 0.42, eat: 2.6 },
    shake:    { icon: "🧋", name: "Balanced Shake",gi: "low",  peak: 32, rise: 7.0, hold: 34, holdX: 0.38, eat: 2.9 },
    oats:     { icon: "🥣", name: "Oat Bowl",      gi: "low",  peak: 30, rise: 7.5, hold: 36, holdX: 0.40, eat: 3.1 }
};

var GI_COLOR = { high: "#f4453f", med: "#f59f00", low: "#12b886" };

/* Storefronts. `food` null = scenery, nothing to grab.
   Signage telegraphs GI: a returning player should be able to read the
   course off the shop names without slowing down to look. */
var STORE_KINDS = {
    bakery:   { food: "cake",     sign: "#ff5c9d", names: ["SUGAR & CRUMB", "FROSTED", "CAKEWALK", "THE ICING"] },
    donuts:   { food: "donut",    sign: "#ff77b4", names: ["HOLE IN ONE", "GLAZED", "DOZEN"] },
    candy:    { food: "candy",    sign: "#f4453f", names: ["SUGAR RUSH", "PENNY SWEETS", "GUMMY CO"] },
    soda:     { food: "soda",     sign: "#e8342f", names: ["FIZZ 32oz", "BIG GULP", "SODA WORKS"] },
    chocolate:{ food: "choc",     sign: "#b5651d", names: ["COCOA BAR", "TRUFFLE", "70%"] },

    pizzeria: { food: "pizza",    sign: "#f59f00", names: ["SLICE HOUSE", "NAPOLI", "BIG SLICE"] },
    deli:     { food: "sandwich", sign: "#e8a33d", names: ["THE DELI", "STACKED", "ON RYE"] },
    ramen:    { food: "noodles",  sign: "#d98b1f", names: ["NOODLE BAR", "BROTH", "SLURP"] },
    burritos: { food: "burrito",  sign: "#ef8a2b", names: ["ROLLED", "CANTINA", "EL WRAP"] },

    smoothie: { food: "shake",    sign: "#12b886", names: ["BALANCE BAR", "GREEN CO", "THE BLEND"] },
    salads:   { food: "salad",    sign: "#2fb35c", names: ["LEAF & GRAIN", "TOSSED", "GARDEN"] },
    oatbar:   { food: "oats",     sign: "#57a848", names: ["SLOW OATS", "STEEL CUT", "MORNING"] },
    nuts:     { food: "nuts",     sign: "#8bbf3f", names: ["NUT HOUSE", "TRAIL CO", "ROASTED"] },

    // Non-food shops still get colour -- a white mall with grey gaps
    // reads as unfinished. They just don't get FOOD colour.
    shoes:    { food: null, sign: "#4a6ea8", names: ["SOLE", "RUNNERS", "LACED", "STRIDE"] },
    phones:   { food: null, sign: "#3f8ec4", names: ["CELL HUT", "SCREENS", "PLAN B"] },
    books:    { food: null, sign: "#7a5cc4", names: ["CHAPTERS", "SPINE", "PAGE 1"] },
    clothes:  { food: null, sign: "#a355b8", names: ["DENIM CO", "OUTFIT", "RACK"] },
    plants:   { food: null, sign: "#4f9e7a", names: ["FERN", "POTTED", "GREENERY"] }
};

/* What each floor stocks. Ground floor is a sugar minefield; climbing
   is how you reach food that actually holds. */
var FLOOR_STOCK = [
    ["candy","bakery","soda","donuts","candy","chocolate","soda","pizzeria","bakery",
     "shoes","phones","donuts","candy","deli","clothes","soda"],
    ["pizzeria","deli","ramen","burritos","pizzeria","nuts","books","deli","salads",
