<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4D Pong</title>
    <!--
      Shared token layer (AESTHETIC_GUIDE.md 2/3), loaded BEFORE this game's
      own <style> so anything below can override a token without fighting
      specificity.

      data-cabinet="raster" is what SWITCHES THE SCANLINES ON: 4.6 makes them
      raster-only and shared/retro.css gates the rule on this attribute, so
      .retro-scanlines does nothing without it. This is the guide's one Raster
      reference cabinet ( 6.6, anchor: Pong 1972).

      data-game="four-d-pong" resolves --world-hue to #FFFFFF ( 2.5). It is
      already in shared/retro.css -- the hue was decided for every shelved game
      too, which is exactly what makes promoting one cheap.

      WHAT THIS FILE DELIBERATELY NO LONGER LOADS (2026-09-06):
      cdn.tailwindcss.com, cdnjs .../Tone.js, and an @import of Google Fonts.
      All three were dead on a double-clicked page, which is this repo's FIRST
      hard constraint, and this file had been violating it since 2026-08-24.
      Tone.js is replaced by shared/sfx.js + fp-audio.js; the fonts are embedded
      as data: URIs inside shared/retro.css ( 3.2); Tailwind's handful of
      utility classes are written out below.
    -->
    <link rel="stylesheet" href="../shared/retro.css">
    <style>
        :root {
            /*
             * The playfield was #e5e7eb on a #f3f4f6 page -- a modern
             * minimalist skin over literally the ur-arcade game. 2.1: pure
             * black, no exceptions outside the Gel cabinet, and this is a
             * Raster one.
             */
            --field-ink:   var(--phos-hot);   /* paddles, ball, walls */
            --field-chrome: var(--phos-dim);  /* centre line, arena rule */
            --panel:       rgba(0, 0, 0, 0.82);
        }

        * { box-sizing: border-box; }

        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: var(--ground);
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .cabinet {
            width: 100%;
            height: 100%;
            padding: 14px 18px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        /* 3.1 -- Press Start 2P for the marquee, used sparingly. */
        .marquee {
            flex-shrink: 0;
            font-family: var(--font-display);
            font-size: clamp(0.9rem, 2.6vmin, 1.7rem);
            color: var(--phos-hot);
            letter-spacing: 6px;
            margin: 0;
        }
        .marquee .sub {
            display: block;
            font-family: var(--font-ui);
            font-size: clamp(0.7rem, 1.6vmin, 1rem);
            letter-spacing: 3px;
            color: var(--sig-cyan);
            margin-top: 4px;
        }

        /* ===================================================
           THE SINGLE SCALE  (1P / 2P)
           The brief keeps the existing tug-o-war bar for every version of the
           game; in the four-paddle modes it is replaced by the two barbells on
           #fpBack, so this is hidden rather than restyled. See fp-tug.js.
           =================================================== */
        #tugBar {
            position: relative;
            flex-shrink: 0;
            width: min(96%, 1200px);
            height: 26px;
            overflow: hidden;
            border: 2px solid var(--sig-cyan);
            background: var(--ground);
        }
        /* Was a rounded grey pill with a CSS transition on width. Hard edges,
         * no radius: this is a Raster cabinet and a plate is a plate. */
        /* --phos-mid, not --phos-dim: at #2E3A34 the filled half and the empty
           half were the same shade at a glance, which is a scale that does not
           scale. This is the only readout in the two-paddle modes. */
        #tugFill {
            height: 100%;
            width: 50%;
            background: var(--phos-mid);
            opacity: 0.55;
        }
        #tugDivider {
            position: absolute;
            top: 0;
            left: 50%;
            width: 4px;
            height: 100%;
            background: var(--sig-cyan);
            transform: translateX(-50%);
        }
        #tugNet {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: var(--font-display);
            font-size: 11px;
            font-variant-numeric: tabular-nums;
            color: var(--phos-hot);
            letter-spacing: 2px;
        }
        #tugBar[hidden] { display: none; }

        /* ===================================================
           THE STAGE -- two stacked canvases
           #fpBack sits BEHIND #fpField at a lower z-index and #fpField paints
           no ground of its own, so the barbells are literally drawn behind the
           canvas, which is what the brief asks for. It also earns its keep:
           the back layer only redraws while a barbell is sliding.
           =================================================== */
        .stage {
            position: relative;
            width: 100%;
            flex-grow: 1;
            min-height: 0;
        }
        .stage canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }
        #fpBack  { z-index: 0; }
        #fpField { z-index: 1; }

        /* 4.6 -- permitted here and nowhere on a Vector cabinet. */
        .retro-scanlines { z-index: 2; }

        /* ===================================================
           MENU / OVERLAY
           =================================================== */
        .overlay {
            position: absolute;
            inset: 0;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            background: var(--panel);
            text-align: center;
            padding: 20px;
        }
        .overlay[hidden] { display: none; }

        /*
           4.8 -- attract mode. The overlay stays up (it is what INSERT COIN
           lives on) but thins out and drops everything else, so what you see
           from across the room is the cabinet playing itself. Any keypress or
           mouse move ends the demo and brings the menu back; see exitAttract().
        */
        .overlay.demo { background: rgba(0, 0, 0, 0.34); }
        .overlay.demo .row,
        .overlay.demo .row-label,
        .overlay.demo .keys,
        .overlay.demo #startBtn { display: none; }

        .overlay h2 {
            font-family: var(--font-display);
            font-size: clamp(0.8rem, 2.2vmin, 1.3rem);
            color: var(--sig-amber);
            letter-spacing: 4px;
            margin: 0;
        }

        .row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }
        .row[hidden] { display: none; }

        .row-label {
            font-family: var(--font-ui);
            font-size: clamp(0.85rem, 1.8vmin, 1.15rem);
            letter-spacing: 3px;
            color: var(--phos-mid);
            text-transform: uppercase;
        }

        /*
         * Buttons, not divs: four people share this keyboard and Tab has to
         * reach every option. steps() on the focus ring for the same reason
         * 3.4 gives -- nothing in an arcade cabinet eases.
         */
        .btn {
            font-family: var(--font-display);
            font-size: clamp(0.6rem, 1.5vmin, 0.85rem);
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--phos-hot);
            background: var(--ground);
            border: 2px solid var(--phos-dim);
            padding: 12px 16px;
            cursor: pointer;
            min-width: 96px;
        }
        .btn:hover,
        .btn:focus-visible {
            border-color: var(--sig-cyan);
            color: var(--sig-cyan);
            outline: none;
        }
        .btn[aria-pressed="true"] {
            border-color: var(--sig-amber);
            color: var(--sig-amber);
        }
        .btn .k {
            display: block;
            font-family: var(--font-ui);
            font-size: 0.95rem;
            letter-spacing: 1px;
            color: var(--phos-mid);
            margin-top: 6px;
            text-transform: none;
        }

        /* Cyan is 2.2's system/navigable signal, and a room code is exactly
           that -- the same colour the hub gives it. */
        .net-status {
            font-family: var(--font-ui);
            font-size: clamp(0.8rem, 1.7vmin, 1.05rem);
            letter-spacing: 2px;
            color: var(--sig-cyan);
            text-transform: uppercase;
            min-height: 1.2em;
        }
        .net-status.warn { color: var(--sig-amber); }

        .row.locked .btn {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .keys {
            font-family: var(--font-ui);
            font-size: clamp(0.8rem, 1.7vmin, 1.05rem);
            letter-spacing: 2px;
            color: var(--phos-mid);
            line-height: 1.5;
            max-width: 62ch;
        }
        .keys b { color: var(--phos-hot); font-weight: normal; }

        /* 4.8 -- the attract-mode idiom. .retro-insert-coin owns the pulse. */
        #insertCoin { font-size: clamp(0.7rem, 1.9vmin, 1.1rem); }
        #insertCoin[hidden] { display: none; }

        .hint {
            flex-shrink: 0;
            font-family: var(--font-ui);
            font-size: clamp(0.75rem, 1.5vmin, 1rem);
            letter-spacing: 2px;
            color: var(--phos-dim);
            text-transform: uppercase;
        }

        /*
         * SCOPE_PULLBACK_PLAN.md 1: mobile support is switched off across the
         * active games. This game is four people at one keyboard and has no
         * touch scheme at all, so it says so rather than rendering a field
         * nobody can play. Not a media-query skin -- a statement.
         */
        #tooSmall {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9;
            background: var(--ground);
            color: var(--phos-mid);
            font-family: var(--font-ui);
            font-size: 1.1rem;
            letter-spacing: 2px;
            text-align: center;
            padding: 30px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
        }
        @media (pointer: coarse) and (max-width: 820px) {
            #tooSmall { display: flex; }
        }
    </style>
</head>
<body class="retro-surface" data-game="four-d-pong" data-cabinet="raster">

    <div class="cabinet">
        <h1 class="marquee">PONG<span class="sub" id="modeLabel">4D &middot; 1-4 PLAYERS</span></h1>

        <!-- The single scale. Hidden by fp-tug.js in the four-paddle modes. -->
        <div id="tugBar">
            <div id="tugFill"></div>
            <div id="tugDivider"></div>
            <span id="tugNet">0</span>
        </div>

        <div class="stage" id="stage">
            <canvas id="fpBack"></canvas>
            <canvas id="fpField"></canvas>
            <div class="retro-scanlines"></div>

            <div class="overlay" id="menu">
                <h2 id="menuTitle">SELECT PLAYERS</h2>

                <div class="row" id="modeRow">
                    <button class="btn" data-mode="1" aria-pressed="false">1P<span class="k">vs CPU</span></button>
                    <button class="btn" data-mode="2" aria-pressed="false">2P<span class="k">left / right</span></button>
                    <button class="btn" data-mode="3" aria-pressed="false">3P<span class="k">+ 1 CPU</span></button>
                    <button class="btn" data-mode="4" aria-pressed="false">4P<span class="k">all four sides</span></button>
                </div>

                <!--
                   Online status. When two or more people are in the room the
                   game engages online play by itself and the mode buttons above
                   are disabled -- seats are assigned by the host, so letting one
                   player pick "2P" while the room holds three is a desync with a
                   button attached to it. See fp-net.js.
                -->
                <div class="net-status" id="netStatus"></div>

                <div class="row-label" id="diffLabel" hidden>DIFFICULTY</div>
                <div class="row" id="diffRow" hidden>
                    <button class="btn" data-diff="easy" aria-pressed="false">EASY</button>
                    <button class="btn" data-diff="medium" aria-pressed="true">MEDIUM</button>
                    <button class="btn" data-diff="hard" aria-pressed="false">HARD</button>
                </div>

                <div class="keys" id="menuKeys"></div>

                <button class="btn" id="startBtn">START</button>
                <div class="retro-insert-coin" id="insertCoin" hidden>INSERT COIN</div>
            </div>
        </div>

        <div class="hint" id="hint">SPACE PAUSE &middot; ESC MENU &middot; M MUTE</div>
    </div>

    <div id="tooSmall">
        <div>4D&nbsp;PONG IS A KEYBOARD GAME</div>
        <div>2 TO 4 PLAYERS AT ONE DESK. OPEN IT ON A COMPUTER.</div>
    </div>

<!--
  identity.js must load BEFORE mp-core: mp-core falls back to it when solo, and
  a double-clicked page has no server to ask. Neither is load-bearing for
  gameplay here -- this game is couch multiplayer and syncs nothing -- but the
  hub passes ?name= and ?room=, so joining identity-only is what puts a player
  in the hub's presence roster while they are inside a game, and what makes the
  local paddle's cap the SAME colour it is on the board.

  retro.js and sfx.js only define globals (RETRO, SFX), so they need only
  precede this game's own files.

  THESE TAGS MUST STAY AT THE END OF <body>. fp-core.js resolves the canvases
  from the DOM and calls resize() at load time, so the markup has to exist
  first. That is also why the split preserved source order.
-->
<script src="../shared/identity.js"></script>
<script src="../shared/mp-core.js"></script>
<script src="../shared/retro.js"></script>
<script src="../shared/sfx.js"></script>
<!-- The L+G dev panel. BEFORE this game's own files: its error capture only
     sees throws that happen after it installs, and its keydown listener has
     to be attached before fp-input.js's so a combo press can be stopped from
     also reaching a paddle. Registration is fp-dev.js, at the very end --
     and read its header before touching the combo, because SEAT_KEYS gives
     KeyG and KeyL to the TOP and BOTTOM seats in the couch modes. -->
<script src="../shared/devtools.js"></script>
<script src="fp-core.js"></script>
<script src="fp-entities.js"></script>
<script src="fp-tug.js"></script>
<script src="fp-ai.js"></script>
<script src="fp-net.js"></script>
<script src="fp-audio.js"></script>
<script src="fp-render.js"></script>
<script src="fp-input.js"></script>
<script src="fp-boot.js"></script>
<!-- LAST: it reads names every file above declares, and registers only. -->
<script src="fp-dev.js"></script>
</body>
</html>
