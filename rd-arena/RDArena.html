<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reaction-Diffusion Arena (Shockwave Physics)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: #d1d5db;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            background-color: #000;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
            cursor: crosshair;
        }
        #ui {
            position: absolute;
            top: 20px;
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }
        h1 { margin: 0 0 5px 0; font-size: 24px; text-transform: uppercase; letter-spacing: 2px;}
        p { margin: 0; font-size: 14px; opacity: 0.7;}
    </style>
</head>
<body>

    <div id="ui">
        <h1>RD-Arena</h1>
        <p>WASD to Move | Mouse to Aim | Hold & Release 'E' to Dash</p>
    </div>

    <canvas id="gameCanvas" width="800" height="800"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Cache: skip over glide audio now

    // --- World & Camera Setup ---
    const worldWidth = 2400;  
    const worldHeight = 2400; 
    let cameraX = 0;
    let cameraY = 0;
    let screenShake = 0;

    // --- Layer Setup ---
    const bloodCanvas = document.createElement('canvas');
    bloodCanvas.width = worldWidth;
    bloodCanvas.height = worldHeight;
    const bloodCtx = bloodCanvas.getContext('2d');
    let bloodParticles = [];
    let shockwaves = [];
    let explosionParticles = [];

    // --- Reaction-Diffusion Setup ---
    const gridCols = 400;
    const gridRows = 400;
    const cellSize = worldWidth / gridCols; 
    const gridSize = gridCols * gridRows;
    
    let gridA = new Float32Array(gridSize).fill(1);
    let gridB = new Float32Array(gridSize).fill(0);
    let nextGridA = new Float32Array(gridSize).fill(1);
    let nextGridB = new Float32Array(gridSize).fill(0);
    
    const dA = 1.0;
    const dB = 0.5;
    const feed = 0.055;
    const k = 0.062;

    for (let i = 0; i < 200; i++) {
        let cx = Math.floor(Math.random() * gridCols);
        let cy = Math.floor(Math.random() * gridRows);
        for (let x = cx - 3; x <= cx + 3; x++) {
            for (let y = cy - 3; y <= cy + 3; y++) {
                if (x >= 0 && x < gridCols && y >= 0 && y < gridRows) {
                    gridB[x + y * gridCols] = 1;
                }
            }
        }
    }

    function updateRD() {
        for (let x = 1; x < gridCols - 1; x++) {
            for (let y = 1; y < gridRows - 1; y++) {
                let i = x + y * gridCols;
                let a = gridA[i];
                let b = gridB[i];

                let laplaceA = 
                    gridA[i - gridCols] * 0.2 + gridA[i + gridCols] * 0.2 + 
                    gridA[i - 1] * 0.2 + gridA[i + 1] * 0.2 + 
                    gridA[i - gridCols - 1] * 0.05 + gridA[i - gridCols + 1] * 0.05 + 
                    gridA[i + gridCols - 1] * 0.05 + gridA[i + gridCols + 1] * 0.05 - 
                    a;
                    
                let laplaceB = 
                    gridB[i - gridCols] * 0.2 + gridB[i + gridCols] * 0.2 + 
                    gridB[i - 1] * 0.2 + gridB[i + 1] * 0.2 + 
                    gridB[i - gridCols - 1] * 0.05 + gridB[i - gridCols + 1] * 0.05 + 
                    gridB[i + gridCols - 1] * 0.05 + gridB[i + gridCols + 1] * 0.05 - 
                    b;

                nextGridA[i] = Math.max(0, Math.min(1, a + (dA * laplaceA - a * b * b + feed * (1 - a))));
                nextGridB[i] = Math.max(0, Math.min(1, b + (dB * laplaceB + a * b * b - (k + feed) * b)));
            }
        }
        let tempA = gridA; gridA = nextGridA; nextGridA = tempA;
        let tempB = gridB; gridB = nextGridB; nextGridB = tempB;
    }

    function isSolid(x, y) {
        let gx = Math.floor(x / cellSize);
        let gy = Math.floor(y / cellSize);
        if (gx < 0 || gx >= gridCols || gy < 0 || gy >= gridRows) return true;
        return gridB[gx + gy * gridCols] > 0.3; 
    }

    function spawnWallExplosion(x, y) {
        if (Math.random() > 0.4) return;
        explosionParticles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 12,
            vy: (Math.random() - 0.5) * 12,
            size: Math.random() * 4 + 2,
            life: 1.0
        });
    }

    function clearRadius(cx, cy, radius) {
        let gx = Math.floor(cx / cellSize);
        let gy = Math.floor(cy / cellSize);
        let r = Math.ceil(radius / cellSize);
        for(let x = gx - r; x <= gx + r; x++) {
            for(let y = gy - r; y <= gy + r; y++) {
                if (x >= 0 && x < gridCols && y >= 0 && y < gridRows) {
                    let i = x + y * gridCols;
                    if (gridB[i] > 0.3) {
                        spawnWallExplosion(x * cellSize, y * cellSize);
                    }
                    gridB[i] = 0;
                    gridA[i] = 1;
                }
            }
        }
    }

    function spawnShockwave(x, y, angle, spread, maxRadius, speed, isDash = false) {
        shockwaves.push({
            x: x, y: y, angle: angle, spread: spread,
            radius: 10, maxRadius: maxRadius, speed: speed,
            alpha: 1.0, isDash: isDash,
            hitList: new Set() // Track who has been hit by this expanding wave
        });
    }

    // --- Visual FX ---
    function createBloodSplatter(x, y, angle) {
        const particleCount = 250;
        const spread = Math.PI / 3; 
        
        // The deadly blood blast shockwave
        spawnShockwave(x, y, angle, spread, 600, 30, false);
        
        for (let i = 0; i < particleCount; i++) {
            let pAngle = angle + (Math.random() - 0.5) * spread;
            let speed = Math.random() * 45 + 15; 
            
            bloodParticles.push({
                x: x, y: y, lastX: x, lastY: y,
                vx: Math.cos(pAngle) * speed, vy: Math.sin(pAngle) * speed,
                size: Math.random() * 5 + 2,
                color: Math.random() > 0.3 ? '#8b0000' : '#c90000',
                friction: Math.random() * 0.04 + 0.88 
            });
        }
    }

    // --- Input Handling ---
    const keys = { w: false, a: false, s: false, d: false, e: false };
    const mouse = { x: 0, y: 0, screenX: 0, screenY: 0, down: false };

    window.addEventListener('keydown', e => { if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true; });
    window.addEventListener('keyup', e => { if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false; });
    
    window.addEventListener('mousemove', e => {
        const rect = canvas.getBoundingClientRect();
        mouse.screenX = e.clientX - rect.left;
        mouse.screenY = e.clientY - rect.top;
    });
    window.addEventListener('mousedown', () => mouse.down = true);
    window.addEventListener('mouseup', () => mouse.down = false);

    // --- Entities ---
    class Entity {
        constructor(x, y, isPlayer) {
            this.x = x;
            this.y = y;
            this.speed = isPlayer ? 3 : 1.5;
            this.angle = 0;
            this.radius = 6; 
            
            this.isPlayer = isPlayer;
            this.ammo = 1;
            this.reloadTime = 120;
            this.reloadTimer = 0;
            
            this.dashCooldown = 0;
            this.isDashing = false;
            this.isChargingDash = false;
            this.dashTime = 0;
            this.dashDirX = 0;
            this.dashDirY = 0;
            
            this.isKnockedBack = false;
            this.knockbackDir = 0;

            this.dead = false;
        }

        die(impactAngle) {
            if (this.dead) return;
            this.dead = true;
            createBloodSplatter(this.x, this.y, impactAngle); 
            
            if (this.isPlayer) {
                setTimeout(() => { 
                    player = new Entity(worldWidth/2, worldHeight/2, true); 
                    clearRadius(worldWidth/2, worldHeight/2, 50); 
                }, 2000);
            }
        }

        update() {
            if (this.dead) return;

            // Handle Shockwave Knockback state
            if (this.isKnockedBack) {
                let kbSpeed = 25; // Fast movement away from blast
                let dx = Math.cos(this.knockbackDir) * kbSpeed;
                let dy = Math.sin(this.knockbackDir) * kbSpeed;
                
                let nextX = this.x + dx;
                let nextY = this.y + dy;

                let hitWallX = isSolid(nextX, this.y);
                let hitWallY = isSolid(this.x, nextY);

                if (hitWallX || hitWallY) {
                    this.isKnockedBack = false; // Stop when hitting wall
                    screenShake = Math.max(screenShake, 8); // Crunch!
                    for(let i=0; i<5; i++) spawnWallExplosion(this.x, this.y); // visual flair
                } else {
                    this.x = nextX;
                    this.y = nextY;
                }

                this.x = Math.max(this.radius, Math.min(worldWidth - this.radius, this.x));
                this.y = Math.max(this.radius, Math.min(worldHeight - this.radius, this.y));
                
                // Stop at edge of world
                if (this.x === this.radius || this.x === worldWidth - this.radius ||
                    this.y === this.radius || this.y === worldHeight - this.radius) {
                    this.isKnockedBack = false;
                }
                
                return; // Skip normal movement, dash, and shooting logic during knockback
            }

            let dx = 0; let dy = 0;
            
            if (this.isPlayer) {
                if (keys.w) dy -= 1;
                if (keys.s) dy += 1;
                if (keys.a) dx -= 1;
                if (keys.d) dx += 1;
                
                // Dash Charge Logic 
                if (keys.e && this.dashCooldown <= 0) {
                    this.isChargingDash = true;
                } else if (!keys.e && this.isChargingDash) {
                    this.isChargingDash = false;
                    this.isDashing = true;
                    this.dashTime = 10;
                    this.dashCooldown = 90;
                    
                    let dashAngle = Math.atan2(dy, dx);
                    if (dx === 0 && dy === 0) dashAngle = this.angle;
                    this.dashDirX = Math.cos(dashAngle);
                    this.dashDirY = Math.sin(dashAngle);
                    
                    spawnShockwave(this.x, this.y, dashAngle, Math.PI / 4, 150, 18, true);
                }

                this.angle = Math.atan2(mouse.y - this.y, mouse.x - this.x);
            } else {
                let dist = Math.hypot(player.x - this.x, player.y - this.y);
                this.angle = Math.atan2(player.y - this.y, player.x - this.x);
                if (dist > 150) {
                    dx = Math.cos(this.angle);
                    dy = Math.sin(this.angle);
                }
            }

            let mag = Math.hypot(dx, dy);
            if (mag > 0) {
                dx /= mag;
                dy /= mag;
            }

            let currentSpeed = this.speed;
            if (this.isChargingDash) currentSpeed *= 0.6; 
            
            if (this.isDashing && this.dashTime > 0) {
                currentSpeed = this.speed * 4;
                dx = this.dashDirX;
                dy = this.dashDirY;
                this.dashTime--;
                clearRadius(this.x, this.y, this.radius + 10);
            } else {
                this.isDashing = false;
            }

            if (this.dashCooldown > 0) this.dashCooldown--;

            let nextX = this.x + dx * currentSpeed;
            let nextY = this.y + dy * currentSpeed;

            if (!isSolid(nextX, this.y)) this.x = nextX;
            if (!isSolid(this.x, nextY)) this.y = nextY;

            this.x = Math.max(this.radius, Math.min(worldWidth - this.radius, this.x));
            this.y = Math.max(this.radius, Math.min(worldHeight - this.radius, this.y));

            if (this.reloadTimer > 0) {
                this.reloadTimer--;
                if (this.reloadTimer <= 0) this.ammo = 1;
            }

            if (this.ammo > 0) {
                if (this.isPlayer && mouse.down && !this.isChargingDash) {
                    this.shoot();
                    mouse.down = false;
                } else if (!this.isPlayer) {
                    let dist = Math.hypot(player.x - this.x, player.y - this.y);
                    if (dist < 300 && Math.random() < 0.02) {
                        this.shoot();
                    }
                }
            }
        }

        shoot() {
            this.ammo = 0;
            this.reloadTimer = this.reloadTime;
            if (this.isPlayer) screenShake = 15; 

            let bx = this.x + Math.cos(this.angle) * 10;
            let by = this.y + Math.sin(this.angle) * 10;
            bullets.push(new Bullet(bx, by, this.angle, this.isPlayer));
        }

        draw() {
            if (this.dead) return;
            
            if (this.isPlayer) {
                let lx = this.x, ly = this.y;
                let stepX = Math.cos(this.angle) * 3, stepY = Math.sin(this.angle) * 3;
                let hitWall = false;
                
                for(let i = 0; i < 400; i++) {
                    lx += stepX; ly += stepY;
                    if (lx < 0 || lx >= worldWidth || ly < 0 || ly >= worldHeight || isSolid(lx, ly)) {
                        hitWall = true; break;
                    }
                }
                
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(lx, ly);
                ctx.strokeStyle = 'rgba(255, 50, 50, 0.4)';
                ctx.lineWidth = 1;
                ctx.stroke();
                
                if (hitWall) {
                    ctx.beginPath();
                    ctx.arc(lx, ly, 2.5, 0, Math.PI * 2);
                    ctx.fillStyle = '#ff3333';
                    ctx.fill();
                }
            }

            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.angle);
            ctx.scale(0.5, 0.5); 

            if (this.isChargingDash) {
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#00bfff';
            }

            ctx.fillStyle = this.isPlayer ? '#4a90e2' : '#e24a4a';
            ctx.beginPath();
            ctx.ellipse(0, 0, 10, 16, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowBlur = 0; 
            ctx.fillStyle = '#9ca3af';
            ctx.fillRect(8, -3, 16, 6);

            ctx.fillStyle = '#f3f4f6';
            ctx.beginPath();
            ctx.arc(2, 0, 8, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();

            if (this.reloadTimer > 0) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.fillRect(this.x - 10, this.y - 15, 20, 3);
                ctx.fillStyle = '#f59e0b';
                let pct = 1 - (this.reloadTimer / this.reloadTime);
                ctx.fillRect(this.x - 10, this.y - 15, 20 * pct, 3);
            }
        }
    }

    class Bullet {
        constructor(x, y, angle, isPlayerBullet) {
            this.x = x; this.y = y;
            this.vx = Math.cos(angle) * 12; this.vy = Math.sin(angle) * 12;
            this.isPlayerBullet = isPlayerBullet;
            this.active = true;
            this.radius = 2; 
        }

        update() {
            this.x += this.vx; this.y += this.vy;

            if (isSolid(this.x, this.y)) {
                this.active = false;
                clearRadius(this.x, this.y, 20); 
            }

            if (this.x < 0 || this.x > worldWidth || this.y < 0 || this.y > worldHeight) {
                this.active = false;
            }
        }

        draw() {
            ctx.fillStyle = '#fbbf24';
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    let player = new Entity(worldWidth / 2, worldHeight / 2, true);
    let bots = [];
    let bullets = [];
    
    clearRadius(worldWidth / 2, worldHeight / 2, 50);

    function spawnBot() {
        let x, y;
        do {
            x = Math.random() * worldWidth; y = Math.random() * worldHeight;
        } while (isSolid(x, y) || Math.hypot(player.x - x, player.y - y) < 400);
        
        clearRadius(x, y, 40);
        bots.push(new Entity(x, y, false));
    }

    for(let i=0; i<15; i++) spawnBot();

    // --- Main Loop ---
    function loop() {
        updateRD();

        cameraX = player.x - canvas.width / 2;
        cameraY = player.y - canvas.height / 2;
        
        cameraX = Math.max(0, Math.min(worldWidth - canvas.width, cameraX));
        cameraY = Math.max(0, Math.min(worldHeight - canvas.height, cameraY));

        if (screenShake > 0) {
            cameraX += (Math.random() - 0.5) * screenShake * 2;
            cameraY += (Math.random() - 0.5) * screenShake * 2;
            screenShake *= 0.85; 
            if (screenShake < 0.5) screenShake = 0;
        }

        mouse.x = mouse.screenX + cameraX;
        mouse.y = mouse.screenY + cameraY;

        ctx.fillStyle = '#050505';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.save();
        ctx.translate(-cameraX, -cameraY);

        // Render Squelching Pulsing Background Floor
        let time = Date.now() * 0.002;
        let bgSize = 120;
        let startX = Math.max(0, Math.floor(cameraX / bgSize) * bgSize);
        let startY = Math.max(0, Math.floor(cameraY / bgSize) * bgSize);
        
        for (let x = startX; x < cameraX + canvas.width + bgSize; x += bgSize) {
            for (let y = startY; y < cameraY + canvas.height + bgSize; y += bgSize) {
                let r = (bgSize * 0.5) + Math.sin(x * 0.01 + y * 0.02 + time) * (bgSize * 0.3);
                let col = 10 + Math.sin(time + x * 0.05) * 8;
                ctx.fillStyle = `rgb(${col}, ${col}, ${col + 2})`; 
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Draw Blood Layer
        ctx.drawImage(bloodCanvas, 0, 0);

        // Update & Render blood particles (carving walls as they fly)
        for (let i = bloodParticles.length - 1; i >= 0; i--) {
            let p = bloodParticles[i];
            p.lastX = p.x; p.lastY = p.y;
            
            p.x += p.vx; p.y += p.vy;
            p.vx *= p.friction; p.vy *= p.friction;
            p.size *= 0.96; 

            let gx = Math.floor(p.x / cellSize);
            let gy = Math.floor(p.y / cellSize);
            for (let cx = gx - 1; cx <= gx + 1; cx++) {
                for (let cy = gy - 1; cy <= gy + 1; cy++) {
                    if (cx >= 0 && cx < gridCols && cy >= 0 && cy < gridRows) {
                        let idx = cx + cy * gridCols;
                        if (gridB[idx] > 0.3) spawnWallExplosion(cx * cellSize, cy * cellSize);
                        gridB[idx] = 0;
                        gridA[idx] = 1;
                    }
                }
            }

            bloodCtx.strokeStyle = p.color;
            bloodCtx.lineWidth = p.size * 2;
            bloodCtx.lineCap = 'round';
            bloodCtx.beginPath();
            bloodCtx.moveTo(p.lastX, p.lastY);
            bloodCtx.lineTo(p.x, p.y);
            bloodCtx.stroke();

            if (p.size < 0.5 || Math.hypot(p.vx, p.vy) < 0.5) {
                bloodParticles.splice(i, 1);
            }
        }

        // Render RD Grid (Deep Dark Scarlet Walls)
        ctx.fillStyle = '#4a0404';
        let gridStartX = Math.max(0, Math.floor(cameraX / cellSize));
        let gridStartY = Math.max(0, Math.floor(cameraY / cellSize));
        let gridEndX = Math.min(gridCols, Math.ceil((cameraX + canvas.width) / cellSize));
        let gridEndY = Math.min(gridRows, Math.ceil((cameraY + canvas.height) / cellSize));

        for (let x = gridStartX; x < gridEndX; x++) {
            for (let y = gridStartY; y < gridEndY; y++) {
                if (gridB[x + y * gridCols] > 0.3) {
                    ctx.fillRect(x * cellSize, y * cellSize, cellSize + 1.5, cellSize + 1.5); 
                }
            }
        }

        // Update and Render Shockwaves (and handle physics)
        const allEntities = [player, ...bots];
        for (let i = shockwaves.length - 1; i >= 0; i--) {
            let s = shockwaves[i];
            s.radius += s.speed;
            s.alpha = 1 - (s.radius / s.maxRadius);
            
            if (s.alpha <= 0) {
                shockwaves.splice(i, 1);
                continue;
            }
            
            // Shockwave physics for blood blasts
            if (!s.isDash) {
                for (let ent of allEntities) {
                    if (ent.dead || s.hitList.has(ent)) continue;

                    let dx = ent.x - s.x;
                    let dy = ent.y - s.y;
                    let dist = Math.hypot(dx, dy);

                    // If shockwave has reached the entity
                    if (dist <= s.radius) {
                        let angleToEnt = Math.atan2(dy, dx);
                        // Normalize angle difference
                        let angleDiff = Math.abs(Math.atan2(Math.sin(angleToEnt - s.angle), Math.cos(angleToEnt - s.angle)));
                        
                        if (angleDiff <= s.spread) {
                            s.hitList.add(ent);
                            
                            // Check distance ratio (1/3 kills, 2/3 knockback)
                            if (dist < s.maxRadius / 3) {
                                ent.die(angleToEnt);
                            } else {
                                ent.isKnockedBack = true;
                                ent.knockbackDir = angleToEnt;
                            }
                        }
                    }
                }
            }

            ctx.beginPath();
            ctx.arc(s.x, s.y, s.radius, s.angle - s.spread, s.angle + s.spread);
            ctx.strokeStyle = `rgba(0, 191, 255, ${s.alpha})`;
            ctx.lineWidth = s.isDash ? 4 : 8;
            ctx.lineCap = 'round';
            ctx.stroke();
        }

        // Render Explosion Particles
        for (let i = explosionParticles.length - 1; i >= 0; i--) {
            let ep = explosionParticles[i];
            ep.x += ep.vx; ep.y += ep.vy;
            ep.vx *= 0.9; ep.vy *= 0.9;
            ep.life -= 0.05;
            
            if (ep.life <= 0) {
                explosionParticles.splice(i, 1);
                continue;
            }
            
            ctx.fillStyle = `rgba(139, 0, 0, ${ep.life})`; 
            ctx.beginPath();
            ctx.arc(ep.x, ep.y, ep.size, 0, Math.PI * 2);
            ctx.fill();
        }

        // Logic Updates
        if (!player.dead) player.update();

        for (let i = bots.length - 1; i >= 0; i--) {
            bots[i].update();
            if (bots[i].dead) {
                bots.splice(i, 1);
                setTimeout(spawnBot, 2000); 
            }
        }

        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            b.update();
            
            if (b.active) {
                if (!b.isPlayerBullet && !player.dead && !player.isDashing) {
                    if (Math.hypot(player.x - b.x, player.y - b.y) < player.radius + b.radius) {
                        b.active = false;
                        player.die(Math.atan2(b.vy, b.vx));
                    }
                }
                if (b.isPlayerBullet) {
                    for (let bot of bots) {
                        if (!bot.dead && Math.hypot(bot.x - b.x, bot.y - b.y) < bot.radius + b.radius) {
                            b.active = false;
                            bot.die(Math.atan2(b.vy, b.vx));
                        }
                    }
                }
            }
            if (!b.active) bullets.splice(i, 1);
        }

        for (let bot of bots) bot.draw();
        if (!player.dead) player.draw();
        for (let b of bullets) b.draw();

        if (player.dashCooldown > 0) {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.font = '10px monospace';
            ctx.fillText("Dash CD", player.x - 20, player.y + 20);
        } else if (player.isChargingDash) {
            ctx.fillStyle = '#00bfff';
            ctx.font = '10px monospace';
            ctx.fillText("CHARGING", player.x - 25, player.y + 20);
        }

        ctx.restore();
        requestAnimationFrame(loop);
    }

    loop();
</script>
</body>
</html>
