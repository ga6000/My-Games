<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS1 LA Highway - Wireframe Build</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
            /* Forces the browser to keep pixels sharp when scaling up */
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            width: 100vw;
            height: 100vh;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ff00;
            font-family: "Courier New", Courier, monospace;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 0px #000;
            pointer-events: none;
        }
    </style>
    <!-- Importing Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="ui">WIREFRAME DIAGNOSTIC MODE<br>AUTOPILOT ENGAGED</div>
    <script>
        // --- SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000); // Black background
        scene.fog = new THREE.Fog(0x000000, 20, 300); // Fade to black

        // --- RENDERER (PS1 STYLE) ---
        const renderer = new THREE.WebGLRenderer({ antialias: false }); // No anti-aliasing
        const width = window.innerWidth;
        const height = window.innerHeight;
        renderer.setSize(width / 3, height / 3, false); 
        document.body.appendChild(renderer.domElement);

        const camera = new THREE.PerspectiveCamera(60, width / height, 0.1, 1000);

        // --- GLOBAL MATERIAL ---
        // Lime green wireframe for everything
        const wireMat = new THREE.MeshBasicMaterial({ color: 0x00ff00, wireframe: true });

        // --- TRACK GENERATION ---
        const points = [];
        const radius = 300;
        for (let i = 0; i < 40; i++) {
            const angle = (i / 40) * Math.PI * 2;
            // Curves reduced to 1/10th, vertical reduced to 1/20th
            const x = Math.cos(angle) * (radius + Math.sin(i * 3) * 6); 
            const z = Math.sin(angle) * (radius + Math.cos(i * 2) * 8); 
            const y = 30 + Math.sin(i * 4) * 1; 
            points.push(new THREE.Vector3(x, y, z));
        }
        const path = new THREE.CatmullRomCurve3(points, true);
        
        // Pre-compute the surface normals and tangents for the car alignment
        const pathFrames = path.computeFrenetFrames(1000, true);

        // Road Geometry
        const roadShape = new THREE.Shape();
        const roadWidth = 12; // Half-width (Total width is 24)
        roadShape.moveTo(-roadWidth, 0);
        roadShape.lineTo(roadWidth, 0);
        roadShape.lineTo(roadWidth, -2);
        roadShape.lineTo(-roadWidth, -2);
        roadShape.lineTo(-roadWidth, 0);

        const extrudeSettings = { steps: 500, extrudePath: path };
        const roadGeo = new THREE.ExtrudeGeometry(roadShape, extrudeSettings);
        const roadMesh = new THREE.Mesh(roadGeo, wireMat);
        scene.add(roadMesh);

        // --- WORLD PROPS ---
        const numProps = 600;
        for (let i = 0; i < numProps; i++) {
            const t = i / numProps;
            const pos = path.getPointAt(t);
            const tangent = path.getTangentAt(t);
            const normal = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();
            
            const side = Math.random() > 0.5 ? 1 : -1;
            const rand = Math.random();

            if (rand < 0.7) { 
                // BUILDINGS
                const bWidth = 10 + Math.random() * 10;
                const bHeight = 20 + Math.random() * 100;
                
                // Offset calculation ensures building width clears the 12-unit road half-width
                const minOffset = roadWidth + (bWidth / 2) + 2; 
                const offset = minOffset + Math.random() * 40; 
                const propPos = pos.clone().add(normal.clone().multiplyScalar(side * offset));

                const bGeo = new THREE.BoxGeometry(bWidth, bHeight, bWidth);
                const bMesh = new THREE.Mesh(bGeo, wireMat);
                bMesh.position.copy(propPos);
                bMesh.position.y -= Math.random() * 20; 
                scene.add(bMesh);
            } else {
                // PALM TREES
                const offset = roadWidth + 5 + Math.random() * 20; 
                const propPos = pos.clone().add(normal.clone().multiplyScalar(side * offset));

                const treeGroup = new THREE.Group();
                const tHeight = 15 + Math.random() * 10;
                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 1, tHeight, 4), wireMat);
                trunk.position.y = tHeight / 2;
                treeGroup.add(trunk);

                const leaves = new THREE.Mesh(new THREE.ConeGeometry(4, 5, 4), wireMat);
                leaves.position.y = tHeight;
                treeGroup.add(leaves);

                treeGroup.position.copy(propPos);
                treeGroup.position.y -= 5;
                scene.add(treeGroup);
            }

            // TUNNELS
            if (i % 80 === 0) {
                const tunLength = 40;
                const tunGeo = new THREE.BoxGeometry(30, 20, tunLength);
                const tunnel = new THREE.Mesh(tunGeo, wireMat);
                tunnel.position.copy(pos);
                tunnel.lookAt(pos.clone().add(tangent));
                scene.add(tunnel);
            }
        }

        // MOUNTAINS
        for(let i=0; i<30; i++) {
            const mGeo = new THREE.ConeGeometry(100 + Math.random()*100, 150 + Math.random()*200, 4);
            const mountain = new THREE.Mesh(mGeo, wireMat);
            const mAngle = (i / 30) * Math.PI * 2;
            const mRad = radius + 250;
            mountain.position.set(Math.cos(mAngle)*mRad, -20, Math.sin(mAngle)*mRad);
            scene.add(mountain);
        }

        // --- CAR MODEL ---
        const car = new THREE.Group();
        
        const bodyGeo = new THREE.BoxGeometry(4, 1.2, 8);
        const body = new THREE.Mesh(bodyGeo, wireMat);
        body.position.y = 1;
        car.add(body);

        const roofGeo = new THREE.BoxGeometry(3, 1, 4);
        const roof = new THREE.Mesh(roofGeo, wireMat);
        roof.position.set(0, 2, -0.5);
        car.add(roof);

        scene.add(car);

        // --- CAMERA PARENTING ---
        // By adding the camera to the car, it automatically rotates with the car's pitch/yaw/roll
        car.add(camera);
        // Extrude geometry pushes +Z forward. So we place camera on -Z (behind)
        camera.position.set(0, 5, -16);
        // Look ahead down the car's local +Z axis
        camera.lookAt(0, 2, 10); 

        // --- ANIMATION LOOP ---
        let progress = 0; 
        const speed = 0.0003; 

        function animate() {
            requestAnimationFrame(animate);

            progress += speed;
            if (progress >= 1) progress = 0;

            // 1. Get exact position
            const t = progress;
            const pos = path.getPointAt(t);

            // 2. Interpolate Frenet Frames for smooth rotation matching the track surface
            // FIXED: Measure against the length of the tangents array, not points!
            const numFrames = pathFrames.tangents.length; 
            const index = Math.floor(t * (numFrames - 1));
            const nextIndex = (index + 1) % numFrames;
            const tFract = (t * (numFrames - 1)) % 1;

            const tangent = new THREE.Vector3().lerpVectors(pathFrames.tangents[index], pathFrames.tangents[nextIndex], tFract).normalize();
            const normal = new THREE.Vector3().lerpVectors(pathFrames.normals[index], pathFrames.normals[nextIndex], tFract).normalize();
            const binormal = new THREE.Vector3().lerpVectors(pathFrames.binormals[index], pathFrames.binormals[nextIndex], tFract).normalize();

            // 3. Construct the rotation matrix
            // X = binormal (right), Y = normal (up), Z = tangent (forward)
            const matrix = new THREE.Matrix4();
            matrix.makeBasis(binormal, normal, tangent);

            // 4. Apply position and rotation to the car (and inherently the camera)
            car.position.copy(pos);
            car.quaternion.setFromRotationMatrix(matrix);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            renderer.setSize(w / 3, h / 3, false); 
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
        });

        animate();
    </script>
</body>
</html>
