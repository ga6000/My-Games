<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shared layer — self test</title>

<!--
    shared/selftest.html — exercises shared/retro.js, sfx.js and leaderboard.js.

    TWO REASONS THIS PAGE EXISTS, and the second is the important one:

    1. It runs assertions against the shared layer, which nothing else does.

    2. scripts/check-global-collisions.js only inspects HTML PAGES — it walks
       each page's <script src> list and compares the files that load together.
       Until some page loaded all four shared files at once, the checker could
       not see the shared layer at all, and "these four don't collide" was an
       assumption rather than a checked fact. This page is that page. It is the
       only place identity.js, retro.js, sfx.js and leaderboard.js are declared
       to share one global scope, so the checker now covers them.

    Open it directly (file://) to verify the degradation path, or over http(s)
    to verify the full one. It says which mode it is in.

    Deliberately does NOT call LB.submit() — that would write a junk score into
    the real Firestore project. It tests the URL derivation and the module
    mechanism instead, which is the part that is actually novel.
-->

<link rel="stylesheet" href="retro.css">
<style>
    body {
        margin: 0;
        padding: 24px;
        background: var(--ground);
        color: var(--phos-mid);
        font-family: var(--font-ui);
        font-size: 16px;
        letter-spacing: 1px;
    }
    h1 { font-family: var(--font-display); color: var(--phos-hot); font-size: 18px; letter-spacing: 3px; }
    #mode { color: var(--sig-amber); margin-bottom: 18px; }
    ul { list-style: none; padding: 0; max-width: 900px; }
    li { padding: 3px 0; border-bottom: 1px solid var(--phos-dim); }
    .pass::before { content: "PASS  "; color: var(--sig-cyan); }
    .fail::before { content: "FAIL  "; color: var(--sig-magenta); }
    .skip::before { content: "SKIP  "; color: var(--phos-dim); }
    .known::before { content: "KNOWN "; color: var(--sig-amber); }
    .known { color: var(--sig-amber); }
    .fail { color: var(--sig-magenta); }
    #summary { margin-top: 18px; font-family: var(--font-display); font-size: 14px; }
    canvas { border: 1px solid var(--phos-dim); margin-top: 14px; image-rendering: pixelated; }
    button {
        font-family: var(--font-ui); font-size: 15px; letter-spacing: 1px;
        background: transparent; color: var(--sig-amber);
        border: 2px solid var(--sig-amber); padding: 8px 14px; cursor: pointer;
        margin-top: 14px; text-transform: uppercase;
    }
    .swatches { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
    .sw { width: 76px; height: 44px; border: 1px solid var(--phos-dim); font-size: 10px; color: #000; padding: 2px; }
</style>
</head>
<body data-game="zombie" data-cabinet="raster">

<h1>Shared layer — self test</h1>
<div id="mode"></div>
<ul id="out"></ul>
<div id="summary"></div>

<div class="swatches" id="swatches"></div>
<canvas id="c" width="240" height="80"></canvas>
<div>
    <button id="audioBtn">Test audio (needs a click — browsers gate AudioContext)</button>
    <button id="lbBtn">Test full Firebase load (network; no score is written)</button>
</div>

<script src="identity.js"></script>
<script src="retro.js"></script>
<script src="sfx.js"></script>
<script src="leaderboard.js"></script>
<script>
"use strict";

var out = document.getElementById("out");
var passed = 0, failed = 0;

function check(name, fn) {
    var li = document.createElement("li");
    try {
        var r = fn();
        if (r === true) { li.className = "pass"; li.textContent = name; passed++; }
        else { li.className = "fail"; li.textContent = name + "  ->  " + r; failed++; }
    } catch (e) {
        li.className = "fail";
        li.textContent = name + "  ->  threw: " + e.message;
        failed++;
    }
    out.appendChild(li);
}

// Same reporting as check(), for a test whose result is a promise. The row is
// appended when it settles, so it lands after the synchronous rows.
function checkAsync(name, fn) {
    Promise.resolve().then(fn).then(function (r) {
        var li = document.createElement("li");
        if (r === true) { li.className = "pass"; li.textContent = name; passed++; }
        else { li.className = "fail"; li.textContent = name + "  ->  " + r; failed++; }
        out.appendChild(li);
        renderSummary();
    });
}

function skip(name, why) {
    var li = document.createElement("li");
    li.className = "skip";
    li.textContent = name + "  (" + why + ")";
    out.appendChild(li);
}

var isFile = location.protocol === "file:";
document.getElementById("mode").textContent =
    "Running over " + location.protocol + "  —  " +
    (isFile ? "file:// : leaderboard MUST degrade to unavailable"
            : "http(s) : leaderboard CAN reach Firebase");

/* ---------- globals ---------- */
check("exactly one global each: IDENTITY / RETRO / SFX / LB", function () {
    var missing = ["IDENTITY", "RETRO", "SFX", "LB"].filter(function (g) { return typeof window[g] === "undefined"; });
    return missing.length === 0 || "missing: " + missing.join(", ");
});

/* ---------- retro.css tokens ---------- */
check("retro.css loaded and tokens resolve", function () {
    var cs = getComputedStyle(document.documentElement);
    var amber = cs.getPropertyValue("--sig-amber").trim();
    var hot = cs.getPropertyValue("--phos-hot").trim();
    return (amber.toUpperCase() === "#FFB000" && hot.toUpperCase() === "#E8FFF4")
        || "got --sig-amber=" + amber + " --phos-hot=" + hot;
});

check("world hue follows data-game (zombie = #FF4A1C ember)", function () {
    var h = getComputedStyle(document.body).getPropertyValue("--world-hue").trim();
    return h.toUpperCase() === "#FF4A1C" || "got " + h;
});

/*
 * §2.3: "a signal colour must never be assignable to a player." If a player can
 * be magenta, every magenta damage flash reads as that player.
 *
 * Measured in CIE76 dE in Lab, not by comparing hue numbers -- two colours can
 * sit 1 degree apart in hue and be perfectly distinguishable by lightness, and
 * a hue compare would call that a violation. It reports rather than fails:
 * fixing it means the AESTHETIC_GUIDE 2.4 palette re-solve, which changes
 * COLOR_PALETTE.length and so must land in shared/identity.js AND the separate
 * server repo in one sitting, ending in a Render redeploy. A permanently red
 * suite would just train everyone to ignore it.
 */
function srgbToLab(rgb) {
    function f(v) { v /= 255; return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }
    var r = f(rgb[0]), g = f(rgb[1]), b = f(rgb[2]);
    var X = (r * 0.4124 + g * 0.3576 + b * 0.1805) / 0.95047;
    var Y = (r * 0.2126 + g * 0.7152 + b * 0.0722);
    var Z = (r * 0.0193 + g * 0.1192 + b * 0.9505) / 1.08883;
    function t(v) { return v > 0.008856 ? Math.cbrt(v) : (7.787 * v + 16 / 116); }
    X = t(X); Y = t(Y); Z = t(Z);
    return [116 * Y - 16, 500 * (X - Y), 200 * (Y - Z)];
}
function deltaE(a, b) {
    var A = srgbToLab(a), B = srgbToLab(b);
    return Math.sqrt(Math.pow(A[0] - B[0], 2) + Math.pow(A[1] - B[1], 2) + Math.pow(A[2] - B[2], 2));
}
function hslToRgb(h, s, l) {
    s /= 100; l /= 100;
    var c = (1 - Math.abs(2 * l - 1)) * s, hp = h / 60, x = c * (1 - Math.abs(hp % 2 - 1)), t;
    if (hp < 1) t = [c, x, 0]; else if (hp < 2) t = [x, c, 0]; else if (hp < 3) t = [0, c, x];
    else if (hp < 4) t = [0, x, c]; else if (hp < 5) t = [x, 0, c]; else t = [c, 0, x];
    var m = l - c / 2;
    return [Math.round((t[0] + m) * 255), Math.round((t[1] + m) * 255), Math.round((t[2] + m) * 255)];
}
function hexToRgb(h) {
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}

(function measureSignalSeparation() {
    var SIGNALS = { "sig-amber": "#FFB000", "sig-cyan": "#00E5FF", "sig-magenta": "#FF2E88" };
    var worst = Infinity, detail = [];
    Object.keys(SIGNALS).forEach(function (name) {
        var best = Infinity, at = null;
        IDENTITY.PALETTE.forEach(function (p) {
            var m = /hsl\((\d+),\s*(\d+)%,\s*(\d+)%\)/.exec(p);
            if (!m) return;
            var d = deltaE(hexToRgb(SIGNALS[name]), hslToRgb(+m[1], +m[2], +m[3]));
            if (d < best) { best = d; at = p; }
        });
        if (best < worst) worst = best;
        detail.push("--" + name + " -> " + at + " dE " + best.toFixed(1));
    });

    var li = document.createElement("li");
    if (worst >= 26) {
        li.className = "pass";
        li.textContent = "§2.3 signal colours are unassignable to players (worst dE " + worst.toFixed(1) + ")";
        passed++;
    } else {
        li.className = "known";
        li.innerHTML = "§2.3 signal/identity separation is dE " + worst.toFixed(1) +
            ", below the guide's &ge;26 target &mdash; a player colour can read as a signal.<br>" +
            "<span style='color:var(--phos-mid)'>" + detail.join(" &nbsp;|&nbsp; ") + "<br>" +
            "Fix = AESTHETIC_GUIDE §2.4's palette re-solve, in shared/identity.js AND the server repo together.</span>";
    }
    out.appendChild(li);
})();

/* ---------- RETRO pure helpers ---------- */
check("RETRO.snap quantizes to the grid, never touching physics", function () {
    return (RETRO.snap(13.7, 4) === 12 && RETRO.snap(14.1, 4) === 16 && RETRO.snap(5, 8) === 8)
        || "got " + RETRO.snap(13.7, 4) + "," + RETRO.snap(14.1, 4) + "," + RETRO.snap(5, 8);
});

check("RETRO.band quantizes light into discrete steps and clamps", function () {
    var b = RETRO.band(0.5, 3);
    return (b === 0.5 && RETRO.band(0, 4) === 0 && RETRO.band(1, 4) === 1 &&
            RETRO.band(-3, 4) === 0 && RETRO.band(9, 4) === 1)
        || "mid=" + b + " lo=" + RETRO.band(-3, 4) + " hi=" + RETRO.band(9, 4);
});

check("RETRO.flicker draws everything inside the cap, alternates the overflow", function () {
    if (!RETRO.flicker(0, 40, 0) || !RETRO.flicker(39, 40, 1)) return "dropped an entity inside the cap";
    var a = RETRO.flicker(40, 40, 0), b = RETRO.flicker(40, 40, 1);
    return (a !== b) || "overflow entity did not alternate between frames";
});

check("RETRO.padScore zero-pads to 6 (§3.4) and clamps junk", function () {
    return (RETRO.padScore(1250) === "001250" && RETRO.padScore(0) === "000000" &&
            RETRO.padScore(-5) === "000000" && RETRO.padScore(NaN) === "000000" &&
            RETRO.padScore(42, 3) === "042")
        || "got " + RETRO.padScore(1250) + " / " + RETRO.padScore(-5) + " / " + RETRO.padScore(NaN);
});

/* ---------- RETRO canvas helpers ---------- */
var cv = document.getElementById("c");
var ctx = cv.getContext("2d");

check("RETRO.persist darkens without clearing, and restores ctx state", function () {
    ctx.fillStyle = "#FFFFFF";
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.globalAlpha = 0.33;                       // caller state that must survive
    ctx.globalCompositeOperation = "lighter";
    RETRO.persist(ctx, cv.width, cv.height, 0.5);
    var px = ctx.getImageData(4, 4, 1, 1).data;
    var stateKept = Math.abs(ctx.globalAlpha - 0.33) < 1e-9 && ctx.globalCompositeOperation === "lighter";
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
    if (!stateKept) return "clobbered caller's globalAlpha/compositeOperation";
    return (px[0] > 100 && px[0] < 200) || "expected a mid grey after one 0.5 decay, got r=" + px[0];
});

check("RETRO.beam strokes twice and leaves a hot core", function () {
    ctx.clearRect(0, 0, cv.width, cv.height);
    RETRO.beam(ctx, function (c) { c.moveTo(10, 40); c.lineTo(230, 40); },
               { color: "#00E5FF", wide: 8, narrow: 2 });
    // The 8px wide stroke spans y=36..43; the 2px core spans y=39..40. Sample
    // y=42: inside the halo, clear of the core. (y=44 is outside the stroke
    // entirely -- an earlier version of this test sampled there and "failed" on
    // correct output.)
    var core = ctx.getImageData(120, 40, 1, 1).data;
    var halo = ctx.getImageData(120, 42, 1, 1).data;
    if (!(core[0] > 200 && core[1] > 200)) return "core is not hot: rgb=" + core[0] + "," + core[1] + "," + core[2];
    return (halo[3] > 0 && halo[3] < core[3]) || "no dimmer halo beside the core (a=" + halo[3] + " vs " + core[3] + ")";
});

check("RETRO.vertexBloom accepts {x,y} and [x,y], skips junk", function () {
    ctx.clearRect(0, 0, cv.width, cv.height);
    RETRO.vertexBloom(ctx, [{ x: 30, y: 20 }, [60, 20], null, { x: "nope", y: 20 }], { radius: 3 });
    var a = ctx.getImageData(30, 20, 1, 1).data[3];
    var b = ctx.getImageData(60, 20, 1, 1).data[3];
    var empty = ctx.getImageData(200, 20, 1, 1).data[3];
    return (a > 0 && b > 0 && empty === 0) || "obj=" + a + " arr=" + b + " empty=" + empty;
});

check("RETRO helpers do not throw on null/garbage input", function () {
    RETRO.persist(null, 10, 10);
    RETRO.beam(null, null);
    RETRO.beam(ctx, null);
    RETRO.vertexBloom(ctx, null);
    RETRO.vertexBloom(ctx, []);
    return true;
});

/* ---------- attract mode: the teardown contract ---------- */
check("RETRO.attract REFUSES to attach listeners without an AbortSignal", function () {
    var warned = false;
    var realWarn = console.warn;
    console.warn = function () { warned = true; };
    var a = RETRO.attract({ idleMs: 1 });
    console.warn = realWarn;
    a.tick();
    return (warned && a.isActive() === false)
        || "expected a warning and an inert controller (warned=" + warned + ")";
});

check("RETRO.attract fires onEnter once after idle, onExit on input", function () {
    var ctrl = new AbortController();
    var enters = 0, exits = 0;
    var a = RETRO.attract({
        idleMs: 0, signal: ctrl.signal,
        onEnter: function () { enters++; }, onExit: function () { exits++; }
    });
    a.tick(); a.tick(); a.tick();          // idleMs 0 -> enters immediately, once only
    if (enters !== 1) { ctrl.abort(); return "onEnter fired " + enters + " times, expected 1"; }
    a.poke();                               // simulated input
    if (exits !== 1) { ctrl.abort(); return "onExit fired " + exits + " times, expected 1"; }
    a.tick();
    ctrl.abort();
    return enters === 2 || "did not re-enter attract after input; enters=" + enters;
});

check("RETRO.attract listeners die with the caller's AbortController", function () {
    var ctrl = new AbortController();
    var exits = 0;
    var a = RETRO.attract({ idleMs: 999999, signal: ctrl.signal, onExit: function () { exits++; } });
    a.tick();
    window.dispatchEvent(new KeyboardEvent("keydown", { key: "a" }));
    ctrl.abort();                            // what a game's destroy() does
    var before = exits;
    window.dispatchEvent(new KeyboardEvent("keydown", { key: "b" }));
    return exits === before || "listener still live after abort() -- this is the teardown leak the rule exists to stop";
});

/* ---------- SFX ---------- */
check("SFX exposes the §4.10 vocabulary", function () {
    var need = ["configure", "init", "unlockOn", "tone", "sequence", "pickup", "death", "blip", "hit", "shoot", "destroy"];
    var missing = need.filter(function (k) { return typeof SFX[k] !== "function"; });
    return missing.length === 0 || "missing: " + missing.join(", ");
});

check("SFX.unlockOn refuses without an AbortSignal", function () {
    var warned = false, realWarn = console.warn;
    console.warn = function () { warned = true; };
    SFX.unlockOn(window);
    console.warn = realWarn;
    return warned || "attached gesture listeners it could not tear down";
});

check("SFX calls before any user gesture are silent, not fatal", function () {
    // Browsers refuse an AudioContext without a gesture. Nothing here may throw.
    SFX.configure({ game: "selftest" });
    SFX.tone({ freq: 440 });
    SFX.pickup();
    SFX.death();
    return true;
});

check("SFX mute state round-trips through localStorage per game", function () {
    var before = SFX.isMuted();
    var now = SFX.toggleMute();
    var stored = null;
    try { stored = localStorage.getItem("sfx_selftest_muted"); } catch (e) { return true; } // private mode: fine
    SFX.toggleMute();                                        // restore
    return (now !== before && stored === (now ? "1" : "0"))
        || "toggled=" + now + " stored=" + stored;
});

/* ---------- LB ---------- */
check("LB derives firebase-config.js from its OWN url, not the document", function () {
    var d = LB.debug();
    if (!d.selfUrl) return "could not find its own <script> tag";
    var expected = new URL("../firebase-config.js", d.selfUrl).href;
    return (d.configUrl === expected && /\/firebase-config\.js$/.test(d.configUrl))
        || "got " + d.configUrl;
});

check("LB.submit without a game id warns instead of writing junk", function () {
    var warned = false, realWarn = console.warn;
    console.warn = function () { warned = true; };
    LB.submit({ score: 10 });
    console.warn = realWarn;
    return warned || "accepted a score with no game id";
});

check("LB.configure({preload:false}) does not touch the network", function () {
    LB.configure({ game: "selftest", preload: false });
    return LB.status() === "idle" || "status is " + LB.status() + ", expected idle";
});

/*
 * The load-bearing claim of leaderboard.js: on a double-clicked page the module
 * import FAILS, and it must fail in a way we can catch. If a blocked import
 * hung instead of rejecting, LB would sit in "loading" forever and silently
 * queue every score rather than dropping them -- which looks identical from the
 * game's side right up until memory matters.
 *
 * Asserted against a file:// URL because that is the exact scheme a
 * double-clicked page would be importing from. Costs no network.
 */
checkAsync("a blocked module import REJECTS rather than hangs (the file:// path)", function () {
    return Promise.race([
        import("file:///C:/__lb_selftest_nonexistent__.js").then(
            function () { return "resolved, which should be impossible"; },
            function (e) { return (e instanceof TypeError) || "rejected with " + (e && e.name) + ", expected TypeError"; }
        ),
        new Promise(function (r) { setTimeout(function () { r("HUNG - never settled after 4s"); }, 4000); })
    ]);
});

/* ---------- optional, click-gated ---------- */
skip("SFX audible output", "click the audio button — AudioContext needs a gesture");
skip("LB full Firebase load", "click the Firebase button — makes a network request");

function renderSummary() {
    document.getElementById("summary").innerHTML =
        '<span style="color:var(--sig-cyan)">' + passed + " passed</span>" +
        (failed ? '  <span style="color:var(--sig-magenta)">' + failed + " FAILED</span>" : "  0 failed");
}
renderSummary();

/* Swatches so the palette is eyeballable, not just asserted. */
var sw = document.getElementById("swatches");
[["--sig-amber", "amber"], ["--sig-cyan", "cyan"], ["--sig-magenta", "magenta"],
 ["--phos-hot", "hot"], ["--phos-mid", "mid"], ["--phos-dim", "dim"], ["--world-hue", "world"]]
.forEach(function (p) {
    var d = document.createElement("div");
    d.className = "sw";
    d.style.background = "var(" + p[0] + ")";
    d.textContent = p[1];
    sw.appendChild(d);
});

document.getElementById("audioBtn").addEventListener("click", function () {
    SFX.init();
    SFX.pickup();
    setTimeout(function () { SFX.death(); }, 500);
    this.textContent = SFX.ready() ? "Audio context running — you should have heard two jingles"
                                   : "AudioContext unavailable in this browser";
});

document.getElementById("lbBtn").addEventListener("click", function () {
    var btn = this;
    btn.textContent = "Loading...";
    LB.preload();
    var tries = 0;
    var poll = setInterval(function () {
        tries++;
        var s = LB.status();
        if (s === "ready" || s === "unavailable" || tries > 40) {
            clearInterval(poll);
            btn.textContent = "LB.status() = " + s +
                (s === "unavailable" && isFile ? "  (correct for file://)" : "");
        }
    }, 250);
});
</script>
</body>
</html>
